name: 娜娜莉的日常

on:
  schedule:
    # 回评：每 3 小时看一眼有没有挂太久没人回的评论。
    #
    # 这里改过两次，两次的理由都记在这儿，免得第三次又绕回去：
    #
    #   最早每 2 小时（一天 12 次）。当时的判断是「冷静期本来就是 6 小时，
    #   两小时一趟里必然有五趟空跑，只是在 Actions 列表上刷屏」，
    #   于是改成每 6 小时、和冷静期同步，一天 4 次。
    #
    #   但「和冷静期同步」恰恰是最差的一种搭配：一条评论等的是
    #   **冷静期结束之后的第一班**，班次隔多久就可能白等多久 ——
    #   6 小时冷静期 + 6 小时一班 = 最坏 12 小时才有人理。
    #   而一次空跑只花几十秒，省下的这点东西根本不值这个延迟。
    #
    # 现在是「冷静期 4 小时 + 每 3 小时一班」，最坏 7 小时。
    # 这两个数是一起算的，改一个就要重算另一个（tools/tests/automation/reply-scope.test.mjs 盯着）。
    #
    # 分针故意错开整点：GitHub 的定时任务在整点最挤。这个仓库实测过 ——
    # 00:00 的班 03:07 才跑、01:00 的 05:50、02:00 的 07:09、06:00 的 10:46，
    # 迟 3 到 5 小时。错到 :17 不保证准时，但总比守着整点排队强。
    - cron: '17 */3 * * *'
    # 巡逻 + 批注 + 贴表情：每天北京时间早上 9 点（UTC 01:00）
    #
    # 贴表情以前不在任何班次上，只有手动 dispatch 才会跑 —— 也就是从来没跑过。
    # 它和巡逻、批注是一路的（都是「她把站上的东西读一遍」），塞进同一班就够，
    # 不值得为三次 API 调用单开一个 cron。
    - cron: '0 1 * * *'
    # 资讯：每三天一期，北京时间上午 10 点（UTC 02:00）
    # 注：*/3 是按「几号」算的，所以跨月那次间隔会短一点，属正常
    - cron: '0 2 */3 * *'
    # 写随笔：每周日北京时间晚上 8 点（UTC 12:00 周日）
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      what:
        description: '做什么'
        type: choice
        options: [reply, patrol, notes, news, react, column, all]
        default: patrol
      dry:
        description: '只演练不动真格'
        type: boolean
        default: true
      force:
        description: '强制重写（今天/这周已经生成过时，覆盖重来）'
        type: boolean
        default: false

permissions:
  contents: write        # 她要把自己的随笔和批注提交进仓库
  discussions: write     # 她要发评论、贴表情
  actions: write         # 她提交完要能叫一次部署（见下方说明）

# 为什么需要 actions: write：
# GitHub 有一条防递归规则 —— 用默认 GITHUB_TOKEN 推上去的提交不会触发 on:push 的工作流。
# 所以她提交了批注或文章之后，站点不会自动重新构建，文件进了仓库但线上看不见。
# 官方认可的绕法是显式派发一次 workflow_dispatch，这需要 actions: write。

concurrency:
  group: blog-data-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装锁定的依赖
        run: npm ci --no-audit --no-fund

      - name: 决定这次做什么
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_WHAT: ${{ inputs.what }}
          INPUT_DRY: ${{ inputs.dry }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_WHAT" in
              reply|patrol|notes|news|react|column|all) ;;
              *) echo "Unsupported action" >&2; exit 1 ;;
            esac
            printf 'what=%s\n' "$INPUT_WHAT" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_DRY" = "true" ]; then
              echo 'dry=--dry' >> "$GITHUB_OUTPUT"
            else
              echo 'dry=' >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT_SCHEDULE" = "0 12 * * 0" ]; then
            echo "what=column" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 2 */3 * *" ]; then
            echo "what=news" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 1 * * *" ]; then
            echo "what=daily-round" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          else
            echo "what=reply" >> "$GITHUB_OUTPUT"
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      - name: 让她去干活
        env:
          TASK: ${{ steps.pick.outputs.what }}
          DRY_FLAG: ${{ steps.pick.outputs.dry }}
          SITE_URL: https://noimpty-zby.github.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 想让她用自己的 GitHub 账号发言（而不是显示成 github-actions 机器人），
          # 就建一个小号、拿它的 PAT 存成这个 secret。不配也能跑。
          NANALY_GITHUB_TOKEN: ${{ secrets.NANALY_GITHUB_TOKEN }}
          GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
          # 她的小号用户名，用来避免自己回自己
          NANALY_LOGIN: ${{ secrets.NANALY_LOGIN }}
          # 评论挂多少小时没人回，她才接手。想让她更快接手就调小 ——
          # 但要和上面的班次一起算：最坏等待 = 冷静期 + 一班间隔
          NANALY_REPLY_GRACE_HOURS: '4'
          NANALY_REPLY_MAX: '5'
          # 单次最多给几篇文章写批注（只处理正文变过的）
          NANALY_NOTES_MAX: '4'
          # 资讯板块用它去搜。和娜娜莉浏览器里那把是同一个 Tavily key。
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # 勾了「强制重写」时，覆盖掉「今天/这周已经生成过」的防重复判断
          NANALY_FORCE: ${{ inputs.force && '1' || '0' }}
          # 她提交时用的署名。不配就用一个不会关联到任何 GitHub 账号的地址。
          # 想让她的提交显示成你小号的头像：用小号登录 github.com/settings/emails，
          # 复制那个形如 12345678+用户名@users.noreply.github.com 的地址存成这个 secret。
          # 注意：没有数字 ID 前缀的 noreply 地址会指向同名的真人账号，代码会拦下来。
          NANALY_GIT_EMAIL: ${{ secrets.NANALY_GIT_EMAIL }}
          NANALY_GIT_NAME: ${{ secrets.NANALY_GIT_NAME }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 可选：独立私有记忆后端；只有允许公开的记忆进入公开内容提示词
          NANALY_AGENT_URL: ${{ secrets.NANALY_AGENT_URL }}
          NANALY_AGENT_TOKEN: ${{ secrets.NANALY_AGENT_TOKEN }}
        run: |
          dry_args=()
          if [ "$DRY_FLAG" = "--dry" ]; then dry_args+=(--dry); fi
          if [ "$TASK" = "daily-round" ]; then
            # 一步失败不该连累后面两步，所以分三次调用而不是 run.mjs all：
            # 每一步自己会把退出码染红（见 run.mjs 的 catch）
            failed=0
            for action in patrol notes react; do
              node tools/nanaly/run.mjs "$action" "${dry_args[@]}" || failed=1
            done
            exit "$failed"
          else
            node tools/nanaly/run.mjs "$TASK" "${dry_args[@]}"
          fi
