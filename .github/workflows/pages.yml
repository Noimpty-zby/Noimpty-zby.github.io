name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 权限写在各个 job 上，不写在这里。
# 写在这里的话 build 也会拿到 pages:write 和 id-token:write ——
# 而 build 要跑 npm ci（五百多个包的安装脚本）和 hexo generate，
# 一个被投毒的传递依赖就能直接签发部署，绕开 deploy。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # 构建之前先跑测试。红了就别部署 ——
      # 这里面守的是「保存日程不会抹掉娜娜莉自动勾的结果」这类不可逆的事。
      - name: 跑测试
        run: npm test

      - name: Build site
        run: npm run clean && npm run build

      # 构建「成功」但页面是空的，这种事真发生过：
      # 给 Hexo 的 page 加了 layout: post，Butterfly 的模板去读 page.categories.data
      # 抛了 TypeError，hexo generate 照常退出 0，只是把那个页面写成了 0 字节。
      # 工作流全绿、文件在仓库里、点进去一片空白。所以这里直接把空页面判成失败。
      - name: 检查有没有空页面
        run: |
          empty=$(find public -name '*.html' -size 0 -print)
          if [ -n "$empty" ]; then
            echo "::error::这些页面渲染成了 0 字节："
            echo "$empty"
            exit 1
          fi
          echo "没有空页面，共 $(find public -name '*.html' | wc -l) 个 HTML"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
