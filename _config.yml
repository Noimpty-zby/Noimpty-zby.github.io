# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Noimpty 的个人空间
subtitle: '记录学习，也记录生活'
description: '记录学习过程和想法，也存放生活中的碎碎念'
keywords: [Noimpty, 学习笔记, 设计, 编程, 问题复盘, 生活记录]
author: Noimpty
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://noimpty-zby.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
  # mermaid 代码块不要交给 highlight.js 处理，
  # 否则会被包成 <figure class="highlight"> 表格结构，
  # Butterfly 的 code_write 找不到 pre > code.mermaid，图就画不出来。
  exclude_languages:
    - mermaid
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
#
# per_page: 0 —— 首页不再列文章。
# 全站上锁之后，首页只留 hero + 三个板块入口（见 source/js/section-hub.js）。
# 列文章等于把标题、摘要、封面直接摆在未解锁的页面上，
# 那正是「从哪里也不能访问内部文章」要堵的口子。
index_generator:
  path: ''
  per_page: 0
  order_by: -date

# Category & Tag
default_category: uncategorized
# 分类的 slug。中文分类名不映射的话，URL 会变成一长串百分号编码。
category_map:
  课外: extra
  课内: in-class
  GAMES101: games101
  UE5-Looman: ue5-looman
  UE5-Ulibarri: ue5-ulibarri
  DSA: dsa
  CSAPP: csapp
  NJU-OS: nju-os
  CS144: cs144
  Life: life
  娜娜莉: nanaly
# tag_map 已清空：Study / GAMES101 / UE5 / Life 这些标签已删除
# （它们与分类完全重复），保留映射会指向不存在的标签。
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 8
pagination_dir: page

# 本地搜索索引。
#
# ⚠️ 这个文件是全站上锁里唯一一个「一个 URL 就能把全部正文拿走」的口子：
#    它按设计就是全站所有文章的完整正文，纯文本，一个 GET 就下完。
#    所以 scripts/noimpty-search-lock.js 会在构建的最后一步把它整体加密，
#    产物 search.xml 里是密文，解密密钥由暗号派生。
#    娜娜莉解锁之后照常能全站搜（source/js/noimpty-ai.js 里会先解密再用）。
#
# 改了暗号就必须重新构建一次，否则旧密文解不开。
search:
  path: search.xml
  field: post
  content: true
  format: html

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# 站点地图（hexo-generator-sitemap）
#
# 全站上锁之后这个东西没有存在意义了 —— 它的唯一用途是帮搜索引擎发现页面，
# 而现在我们恰恰不想被发现。所有文章都带 sitemap: false，
# 但 tags/categories 那两项仍会把分类页列出来，所以一并关掉。
#
# 想重新开放某个板块时：把下面三行的注释去掉，
# 并把对应文章 front-matter 里的 sitemap: false 删掉。
# sitemap:
#   path: sitemap.xml
#   rel: false
#   tags: false
#   categories: false

# RSS / Atom 订阅（hexo-generator-feed）
#
# 同样关掉。feed 是「把内容主动推出去」，和上锁是相反的方向；
# 就算按 privacy 过滤，只要有一篇漏标就是全文外泄。
# scripts/noimpty-lockdown.js 里还有一道兜底：即使有人把这里打开，
# 只要 lockdown 开着，构建出来的 feed 也会被清空。
# feed:
#   type: atom
#   path: atom.xml
#   limit: 20
#   content: false
#   order_by: -date
  icon: /img/favicon.svg

# Markdown 渲染器（hexo-renderer-markdown-it）
# 换掉 hexo-renderer-marked 是为了支持 KaTeX 数学公式。
# 下面的选项刻意对齐 marked 的原有行为，避免已有文章排版变化：
#   breaks: true   —— 单换行渲染成 <br>，正文里大量依赖这个
#   html: true     —— 允许正文内嵌 HTML（Study/Ideas/Life 板块页用到）
markdown:
  preset: default
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    # typographer 关闭：它会把 ... 变成 …、-- 变成 –、引号变成弯引号。
    # 技术正文里这些符号常有原意，保持原样最安全，也与源文件完全一致。
    typographer: false
  plugins:
    - '@renbaoshuo/markdown-it-katex'
    # 任务列表 - [x] / - [ ]：marked 原生支持，markdown-it 需要插件补上。
    # UE5 系列文章末尾的「完成检查清单」依赖它，共 233 个复选框。
    - name: 'markdown-it-task-lists'
      options:
        enabled: false
        label: false
  # 还原 marked 原本的标题锚点：<a class="headerlink" href="#xxx"></a>
  # Butterfly 的目录跳转和 toc-sync.js 都依赖它
  anchors:
    level: 1
    collisionSuffix: ''
    permalink: true
    permalinkClass: headerlink
    permalinkSide: left
    permalinkSymbol: ''
    case: 0
    separator: '-'

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
