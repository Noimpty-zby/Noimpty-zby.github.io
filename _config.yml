# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Noimpty 的个人空间
subtitle: '记录学习，也记录生活'
description: '记录学习过程和想法，也存放生活中的碎碎念'
keywords: [Noimpty, 学习笔记, 设计, 编程, 问题复盘, 生活记录]
author: Noimpty
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://noimpty-zby.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: false # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
  # mermaid 代码块不要交给 highlight.js 处理，
  # 否则会被包成 <figure class="highlight"> 表格结构，
  # Butterfly 的 code_write 找不到 pre > code.mermaid，图就画不出来。
  exclude_languages:
    - mermaid
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  Study: study
  GAMES101: games101
  UE5: ue5
  竞赛: competition
  Ideas: ideas
  Life: life
# tag_map 已清空：Study / GAMES101 / UE5 / Life 这些标签已删除
# （它们与分类完全重复），保留映射会指向不存在的标签。
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 8
pagination_dir: page

# Local search index (used by Butterfly)
search:
  path: search.xml
  field: post
  content: true
  format: html

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# 站点地图（hexo-generator-sitemap）
# 搜索引擎靠它高效发现全部页面。
# 加密文章通过在其 front-matter 里写 sitemap: false 排除
# （见 source/_posts/my-first-post.md）。
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# RSS / Atom 订阅（hexo-generator-feed）
# 注意：加密文章会由 scripts/noimpty-sections.js 里的 after_generate 过滤器
#       从 feed 中剔除，避免私密内容经 RSS 泄漏。
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  # content: false —— 只输出 description 摘要。
  # 开 true 会把全文塞进 feed：你的 UE5 长文单篇 1.5 万字，
  # 全文 feed 会到 1.3MB，订阅者每次拉取都要下这么多。
  content: false
  content_limit: 300
  content_limit_delim: ' '
  order_by: -date
  icon: /img/favicon.svg

# Markdown 渲染器（hexo-renderer-markdown-it）
# 换掉 hexo-renderer-marked 是为了支持 KaTeX 数学公式。
# 下面的选项刻意对齐 marked 的原有行为，避免已有文章排版变化：
#   breaks: true   —— 单换行渲染成 <br>，正文里大量依赖这个
#   html: true     —— 允许正文内嵌 HTML（Study/Ideas/Life 板块页用到）
markdown:
  preset: default
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    # typographer 关闭：它会把 ... 变成 …、-- 变成 –、引号变成弯引号。
    # 技术正文里这些符号常有原意，保持原样最安全，也与源文件完全一致。
    typographer: false
  plugins:
    - '@renbaoshuo/markdown-it-katex'
    # 任务列表 - [x] / - [ ]：marked 原生支持，markdown-it 需要插件补上。
    # UE5 系列文章末尾的「完成检查清单」依赖它，共 233 个复选框。
    - name: 'markdown-it-task-lists'
      options:
        enabled: false
        label: false
  # 还原 marked 原本的标题锚点：<a class="headerlink" href="#xxx"></a>
  # Butterfly 的目录跳转和 toc-sync.js 都依赖它
  anchors:
    level: 1
    collisionSuffix: ''
    permalink: true
    permalinkClass: headerlink
    permalinkSide: left
    permalinkSymbol: ''
    case: 0
    separator: '-'

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
