# 复习卡：课内和课外 AI Infra 两块的知识点，按文章内容写的问答。格式见 scripts/noimpty-review.js。
# front 是正面的问题，back 是答案；可以用 `代码` 和 **加粗**。复习页出题时以 back 为准，
# 所以 back 要写对、写全。改了 front 的文字就算一张新卡，原来的复习进度不再接续。
dsa:
- post: DSA-Chapter1-Introduction
  cards:
  - front: 数组的随机访问为什么是 O(1)？
    back: 因为地址是线性的，而且每个元素一样宽，所以 `A[i] 的地址 = 首地址 + i × 每个元素的字节数`。只需要一次乘法和一次加法，不用从头往后找。
  - front: 栈被称为「静态」，静态指的是什么？
    back: 不是指栈在运行时不变，而是每一层栈帧多大、每个变量放在这一层的第几个字节，都在编译期就算好了。运行时只需要移动一下栈顶指针。
  - front: 为什么栈上不能开「运行时才知道大小」的数组？
    back: 因为栈帧的大小必须在编译期确定。
  - front: '`int *p = (int *)malloc(5 * sizeof(int));` 执行后，`p` 和那 5 个 `int` 分别在哪里？'
    back: '`p` 本身在栈上，它指向的 5 个 `int` 在堆上。指针变量和它所指向的内存存放在不同的地方。'
  - front: 堆内存用错时有哪两类典型问题？
    back: 忘记 `free` 会造成内存泄漏；对同一块内存 `free` 两次，或者 `free` 之后继续使用，都属于未定义行为（悬空指针）。
  - front: 物理结构有哪几种？
    back: 只有两种：数组（一整块连续的内存）和链表（分散的节点用指针连接起来）。
  - front: 逻辑结构和物理结构是什么关系？
    back: 逻辑结构（栈、队列、树、图、哈希表）描述数据之间的关系，并不真实存在于内存里，必须借助数组或链表（或两者的组合）来实现。逻辑结构决定数据结构是什么，物理结构决定它的开销有多大。
  - front: ADT 由哪两部分组成？「抽象」体现在哪里？
    back: 由数据的表示和能对数据进行的操作组成。抽象体现在表示部分可以整个替换，调用方只依赖操作，比如把 `int *A` 换成链表，调用方的代码一行都不用改。
  - front: 求和函数逐行计数得到 `3n + 4`，为什么最后写成 O(n)？
    back: 只保留最高阶项并去掉系数。n 很大时常数 4 可以忽略；系数 3 取决于机器和编译器，不是稳定的性质。复杂度描述的是增长趋势，而不是具体数值。
  - front: 内层从 `j = i + 1` 开始的双重循环，复杂度是多少？
    back: 内层一共执行 n(n−1)/2 次，最高阶项是 n²/2，去掉系数后是 O(n²)。三角形正好是正方形的一半，「一半」只是一个常数。
  - front: '`for (int i = n; i > 0; i /= 2)` 大约循环多少次？'
    back: 约 log₂n 次。要问的就是 n 需要除以多少次 2 才能降到 1。
  - front: 遍历 m 条链表、节点总数为 n 的链表数组，复杂度是多少？
    back: O(m+n)。外层执行 m 次，内层一共执行 n 次，而不是每一轮都执行 n 次，所以不是 O(n²)；m 和 n 相互独立，也不能合并成一个量。
  - front: 空间复杂度一般计算的是哪部分空间？
    back: 辅助空间，也就是除了输入数据本身以外额外开辟的空间。传进来的数组通常不算在内。
  - front: 递归求和 `Sum(n)` 没有开任何数组，为什么空间复杂度是 O(n)？
    back: 递归 n 层时，栈上同时压着 n 个栈帧，而栈帧是要占用空间的。
- post: DSA-Chapter2-Recursion
  cards:
  - front: 每个递归函数必须有哪两样东西？只有出口够不够？
    back: 基准情形（不再调用自己的出口）和递归情形（参数每次都朝出口变化）。只有出口不够，比如 `return bad(n) + n;` 参数永远不变，仍然会无限递归，结果是栈溢出。
  - front: 递归调用时，四层栈帧里的 `n` 是同一个变量吗？
    back: 不是。它们名字相同，但存放在不同的栈帧里，是四个互不影响的变量。递归能正常工作，依靠的就是这一点。
  - front: 递归的空间复杂度要看什么？为什么不看调用总次数？
    back: 看最大栈深。已经返回的栈帧所占的空间已经归还，任何时刻栈上只有从根到当前节点的一条路径。
  - front: 每层调用自己两次的 `tree(n)`，时间和空间复杂度分别是多少？
    back: 时间 O(2ⁿ)，一共调用 2^(n+1) − 1 次；空间 O(n)，因为两个子调用先后执行，栈上同时只有一条路径。
  - front: '`return f(n - 1) + 3;` 是尾递归吗？'
    back: 不是。调用返回之后这一层还要做 `+ 3`，所以栈帧必须保留。尾递归要求调用自身是这一层做的最后一件事。
  - front: 尾递归改写成循环的规则是什么？改写后空间怎样变化？
    back: 传给下一层的每个实参，就是循环变量在下一轮的取值，比如 `fact(n - 1, acc * n)` 对应 `n--` 和 `acc *= n`。空间从 O(n) 降到 O(1)。
  - front: 为什么不能依靠编译器的尾调用优化来避免深递归出问题？
    back: 它只是一种优化，并不是保证。C 和 C++ 标准没有要求，`-O0` 时不做；函数里有需要析构的局部对象或取了局部变量的地址时可能做不了；Python 明确不做。
  - front: 头递归为什么不能照搬尾递归的改写方法？
    back: 头递归的工作全部发生在回溯阶段，而循环是从起点往前执行的，方向正好相反，需要重新设计。比如按高位到低位打印整数，改成循环时要先找出最高位。
  - front: 用 `static int acc` 做递归累加器会出什么问题？怎么修？
    back: '`acc` 存放在静态区，只初始化一次，不会因为重新调用而归零。第一次 `sum(3)` 得 6，第二次得 12，函数不可重入。修法是把累加器移到参数里，写成 `sum(n, acc)`，它同时变成了尾递归。'
  - front: 朴素斐波那契递归的时间复杂度是多少？为什么不是 O(n²)？
    back: 是指数级，约 Θ(1.618ⁿ)，常写成 O(2ⁿ)。递归树里大量相同的子树各自重新计算，`fib(30)` 实测调用 2 692 537 次；如果是 O(n²)，只有 900 次。
  - front: 记忆化怎样改善斐波那契递归？
    back: 用一张表记下算过的 `fib(n)`，再遇到时直接取。`fib(30)` 的调用次数从 2 692 537 降到 59，时间复杂度变成 O(n)。这是动态规划的雏形。
  - front: 计算 mⁿ 的折半写法依据什么性质？复杂度是多少？
    back: n 为偶数时 mⁿ = (m²)^(n/2)，奇数时先摘出一个 m。时间和空间都从 O(n) 降到 O(log n)，只适用于 n ≥ 0。
  - front: 用帕斯卡三角递推计算 nCr，比用阶乘公式好在哪里？还有什么问题？
    back: 整个过程只做加法，不会因为中间的阶乘溢出而出错（`20!` 已经超出 32 位整数）。问题是两个分支会重复计算，`nCr(20,10)` 调用 369 511 次，要用二维表记忆化，降到 O(n·r)。
  - front: 汉诺塔要移动多少次？它的指数级和斐波那契的指数级有什么不同？
    back: M(n) = 2ⁿ − 1。汉诺塔的每一步都必须移动，慢在问题本身；斐波那契慢在重复计算，加一张表就能解决。
  - front: 泰勒展开求 eˣ 时，秦九韶（Horner）写法好在哪里？
    back: 把式子写成 1 + x(1 + x/2(1 + x/3(…)))，只用一个变量从里往外算 `s = 1 + x * s / n`。它是尾递归，可以直接改成循环，空间 O(1)，也去掉了 `static` 变量，可以反复调用。
- post: DSA-Chapter3-Arrays
  cards:
  - front: 数组只有哪两条性质？
    back: 元素在地址上是连续的；每个元素占的空间一样大。数组的其他特点都由这两条推出来。
  - front: '`int C[5] = {2, 4};` 后三个元素是多少？`= {0}` 为什么能把整个数组清零？'
    back: 后三个是 0。只要写了初始化列表，没有覆盖到的位置一律补 0，这是 C 标准规定的，`= {0}` 依靠的正是这条补零规则。
  - front: 未初始化数组里的「垃圾值」是从哪里来的？
    back: 不是随机数，而是上一次使用这块内存的代码留下的数据。声明数组只是划出一段地址，没有人负责清理。
  - front: 为什么 `2[A]` 和 `A[2]` 的结果一样？
    back: C 标准把 `a[b]` 定义为 `*(a + b)`，而加法满足交换律。下标只是地址算术的简写。
  - front: 在函数里对数组参数 `int A[5]` 做 `sizeof(A)`，得到什么？
    back: 得到 8，也就是 `sizeof(int*)`。数组传参时退化成指向首元素的指针，长度信息丢失了，所以要额外传入长度。
  - front: '`int A[n]`（n 是运行时变量）在 C 和 C++ 标准里合法吗？'
    back: 变长数组（VLA）是 C99 加入 C 标准的特性，C11 改成了可选；C++ 标准里从来没有，`g++` 能接受只是因为默认开启了 GNU 扩展，加上 `-pedantic-errors` 就会报错。VLA 分配在栈上，长度很大会栈溢出。
  - front: 堆上数组扩容的三步是什么？少一步各会怎样？
    back: ① 另开一块更大的内存并拷贝（不拷贝，新块里是垃圾值）；② `delete[]` 旧块（不释放就内存泄漏）；③ 让 `p` 指向新块（不改就成了野指针）。扩容后地址会变，指向旧内存的指针全部失效。
  - front: 扩容时每次 +1 和每次翻倍，总拷贝次数分别是什么量级？
    back: 每次 +1 是 n(n−1)/2，O(n²)，插入 10 万个元素要拷贝约 50 亿次；每次翻倍的总拷贝量不超过 2n，均摊到每次插入是 O(1)，`std::vector` 就是这样做的。
  - front: '`int A[3][4]`、指针数组 `int *B[3]`、二级指针 `int **C` 三种二维写法有什么区别？'
    back: '`A` 是一整块连续的 48 字节；`B` 和 `C` 的行数据分散在堆上，行与行之间不连续，不能当一维数组遍历，读一个元素要两次内存访问。后两种的好处是每行长度可以不同，行数可以在运行时决定。'
  - front: 二维数组作参数时，为什么列数不能省略？
    back: 地址公式 `L₀ + (i × n + j) × w` 里用到了列数 n，不知道一行有几个元素就算不出 `A[i][j]` 的位置。行数没有出现在公式里，所以第一维可以省略。
  - front: 一维数组元素的地址公式是什么？它说明了什么？
    back: '`Addr(A[i]) = L₀ + i × w`。公式里没有 n，无论数组多大、访问哪个位置，都只要一次乘法和一次加法，这就是随机访问 O(1) 的含义。'
  - front: 数组下标为什么从 0 开始？「省一次减法」的说法准确吗？
    back: 主要是为了让下标和偏移量成为同一个数，公式里没有修正项，指针算术和 `*(A+i)` 才能完全对应。省减法只是附带的好处，而且下界是编译期常数时，`gcc -O2` 只是把位移写成 `-4`，并不多一条指令。
  - front: 为什么 C 语言访问越界的 `A[5]` 不会报错？
    back: 编译器只按公式算地址，不检查这个地址还属不属于这个数组。C 不做边界检查，因为那样每次访问都要多比较一次，还要保存长度。越界会悄悄改掉旁边的变量，比如 `A[5]` 就是紧挨着的 `B[0]`。
  - front: 行主序和列主序的地址公式分别是什么？C 用哪一种？
    back: 行主序是 `L₀ + (i × n + j) × w`（n 是列数），列主序是 `L₀ + (j × m + i) × w`（m 是行数）。C 和 C++ 用行主序，Fortran 和 MATLAB 用列主序。两种方式计算地址一样快。
  - front: 按行遍历和按列遍历一个大矩阵，为什么速度能差二十倍？
    back: CPU 每次搬一整条缓存行（这台机器上是 64 字节，16 个 `int`）。按行遍历时搬来的数据接下来都会用到；按列遍历每一步都跳过一整行，16 个数只用到 1 个。所以在 C 的双重循环里，应该把 `j` 放在内层。
  - front: n 维数组的地址公式怎样从 O(n²) 次乘法降到 O(n) 次？
    back: 从里往外逐层提取公因子，写成 `((i₁d₂ + i₂)d₃ + i₃)…` 的形式，也就是秦九韶算法（Horner 法则）。每多一维只多一次乘法。
- post: DSA-Chapter4-Array-ADT
  cards:
  - front: Array ADT 里的 `size` 和 `length` 分别表示什么？`length` 同时承担哪几个作用？
    back: '`size` 是容量，创建时确定；`length` 是当前存放的元素个数。`length` 同时是元素个数、下一个空位的下标和合法下标的上界，所以 Append 只要一行。'
  - front: Get 和 Set 的边界检查为什么要看 `length` 而不是 `size`？
    back: 删除只是把后面的元素前移并让 `length` 减一，不会清空最后一格。按 `size` 检查会读出已经删除的旧值（比如删掉 6 之后 `A[6]` 仍是 12），而且不会报错。
  - front: Insert 为什么要从后往前挪？Delete 为什么从前往后挪？
    back: 两者遵循同一条规则：每次把元素搬进空位，空位在哪一端，就从哪一端开始移动。插入时空位在末尾 `A[length]`，删除时空位是被删的 `A[index]`。方向反了，同一个值会被复制好几遍。
  - front: 数组插入和删除的时间复杂度是多少？慢在哪里？
    back: 最好 O(1)（在末尾），最坏和平均 O(n)，平均要移动约 n/2 次。慢在数组要求元素连续存放，在中间插入时，后面的元素都要让出一格。
  - front: 有序插入的循环 `while (i >= 0 && A[i] > x)` 里，`i >= 0` 为什么必须写在 `&&` 左边？
    back: x 比所有元素都小时，i 会减到 -1，全靠短路求值才不会读 `A[-1]`。漏掉它时，不开 ASan 也可能因为 `A[-1]` 碰巧是 0 而结果正确，所以很难测出来。
  - front: 线性查找在找得到的情况下，平均要比较几次？
    back: (n + 1)/2 次。平均和最坏都是 O(n)。
  - front: 改进查找的「换位法」和「移到最前」各有什么代价？
    back: 移到最前一步到位，但它是用交换实现的，会把原来排第一的元素换到被查元素原来的位置（例子里 8 被换到了末尾）；换位法每查一次只前进一格，但不会把其他常用元素一下子换走。两者都只适用于无序数组。
  - front: 二分查找的循环条件为什么是 `low <= high`？更新边界为什么写成 `mid + 1` 和 `mid - 1`？
    back: '`low == high` 时区间里还剩一个元素没有比较过。mid 已经比较过，所以要排除在外；写成 `low = mid` 时，在 `{1, 3}` 里查找 5 会死循环。'
  - front: 二分查找的中间位置为什么写成 `low + (high - low) / 2`？
    back: '`(low + high) / 2` 里的 `low + high` 可能超出 int 的范围，有符号整数溢出是未定义行为，实际多半回绕成负数。后一种写法没有额外开销。'
  - front: 二分查找最坏要查几轮？100 万个数最多几轮？
    back: ⌊log₂n⌋ + 1 轮。把查找过程画成一棵树，第 k 层最多 2^(k−1) 个节点。100 万个数最多 20 轮，而线性查找平均要比较 50 万次。
  - front: 求最大值时，初始值为什么取 `A[0]` 而不是 0？求平均值时要注意什么？
    back: 数组全是负数时，初始值取 0 会得到一个根本不在数组里的 0。`Sum / length` 两边都是 int，会做整数除法，要先转成 `double` 再除。
  - front: 循环左移 k 位怎样做到 O(n)？
    back: 用三次反转：先反转前 k 个元素，再反转剩下的元素，最后整体反转一次。整体反转交换了两段的位置，同时把两段内部的顺序又反转了回来。
  - front: 负数归左的双指针写法里，内层两个 while 为什么也要判断 `i < j`？
    back: 数组全是负数时，i 会走出右端；全是非负数时，j 会走到 `A[-1]` 之前。不开 ASan 时，一组数据看起来正常，另一组直接段错误。
  - front: 归并两个有序数组时，为什么两个处理剩余部分的 while 都要写？
    back: 主循环结束时一定有一个数组走完了，但具体是哪一个取决于数据。另一个数组剩下的元素都更大而且有序，要按顺序接到末尾，漏掉就会丢元素。
  - front: 有序数组求交集时，较小的那个元素为什么可以直接扔掉？
    back: 另一个数组当前的元素已经比它大，后面的只会更大，所以它不可能出现在另一个数组里。有序时并、交、差都是归并的变形，O(m + n)；无序时要 O(mn)。
  - front: 有序数组里只缺一个数，起点不一定是 1，怎样找出它？
    back: 观察 `A[i] - i`。连续的一段里这个差保持不变，缺了一个数以后，差值会增大 1，缺少的数是 `i + diff`（diff 是原来的差值）。
  - front: 有序数组找重复时，统计完一段后为什么要写 `i = j - 1`？
    back: for 循环还会执行 `i++`，这样下一轮正好从 j 开始。少了这一句，同一段会从第二个元素开始再被统计一遍。
  - front: 用查表法求两数之和时，为什么要先查表再登记？还要注意什么？
    back: 顺序反过来时，k = 10 下一个单独的 5 会先登记 `H[5]` 再去查 `H[5]`，和自己配成一对。另外要先检查 `k - A[i]` 是否在表的范围内，否则可能读到 `H[-6]`，越界。
  - front: 有序数组求两数之和用两端指针，为什么不会漏掉答案？
    back: 把所有 (i, j) 的和排成一张表，行和列都是递增的。和大于 k 时整列都太大，执行 `j--`；小于 k 时整行都太小，执行 `i++`；等于 k 时两个指针同时移动。每一步至少排除一行或一列，最多 n − 1 步。
- post: DSA-Chapter5-Strings
  cards:
  - front: C 语言里的字符串是什么？`'\0'` 和 `'0'` 有什么区别？
    back: 字符串是以 `'\0'` 结尾的字符数组。`'\0'` 是空字符，编号是 0，用来标记字符串结束；`'0'` 是数字字符，编号是 48。
  - front: '`''A''`、`''a''`、`''0''` 和空格的 ASCII 编号分别是多少？同一个字母的大小写相差多少？'
    back: 分别是 65、97、48、32。同一个字母的小写比大写大 32，二进制上只差第 5 位，所以 `'a' - 'A'` 等于 32。
  - front: 为什么说「Unicode 占 2 个字节」并不准确？
    back: Unicode 的码点范围是 U+0000 到 U+10FFFF，需要 21 位。码点存进内存还要选编码方式，UTF-8 每个字符占 1 到 4 个字节（「中」占 3 个），UTF-16 占 2 或 4 个字节。`strlen` 数的是字节数，不是字符数。
  - front: '`char x[5] = {''A'', ''B''};` 里存的是什么？它是不是字符串？'
    back: 存的是 65 66 0 0 0。没有给初值的元素一律补 0，所以末尾有 `'\0'`，它已经是字符串 "AB" 了。
  - front: 字符数组末尾没有 `'\0'` 时，用 `%s` 打印会怎样？
    back: '`printf` 会一直往后读，直到碰到内存里的某个 0 为止。实测 -O0 下把紧挨着的数组也打印了出来（ABCDEabcdefg），-O2 下碰巧输出正确，只有 AddressSanitizer 能稳定地报出 stack-buffer-overflow。'
  - front: '`char z[5] = "Hello";` 有什么问题？'
    back: 数组放不下 `'\0'`。C 允许这种写法，编译器会直接丢掉 `'\0'`，gcc 加上 -Wall -Wextra 也不警告；同样的代码用 g++ 编译会直接报错。数组大小要比字符数多 1，或者干脆不写大小。
  - front: '`char a[] = "hello"` 和 `char *p = "hello"` 有什么区别？'
    back: 前者在栈上开一个 6 字节的数组，把字面量复制进去，可以修改。后者只是一个 8 字节的指针，指向 .rodata 只读段里的字面量，执行 `p[0] = 'H'` 会段错误。指向字面量的指针最好写成 `const char *`。
  - front: 为什么不要在循环条件里写 `i < strlen(s)`？
    back: 字符串不记录长度，每次求长度都要从头数到 `'\0'`，所以每一轮循环都重新数一遍，整个循环从 O(n) 变成 O(n²)。n = 1000 时实测读取字符 1 002 001 次，先算好长度只要 1 001 次。
  - front: 把小写字母转成大写时，为什么必须先判断字符的范围？
    back: 空格的编号是 32，减去 32 就变成了 `'\0'`，字符串会从空格处被截断，"hello world" 会变成 "HELLO"。用 `^ 32` 翻转大小写也一样，只能用在字母上。
  - front: 数单词时，「只数前一格不是空格的空格，再加 1」这种写法有什么问题？更稳的写法是什么？
    back: 字符串以空格开头时，i = 0 会去读 `s[-1]`，越界；结尾的空格会多算一个单词；空串会得到 1。更稳的写法是数词首，也就是 `s[i] != ' ' && (i == 0 || s[i - 1] == ' ')` 的位置。
  - front: 原地反转字符串时，求出长度以后为什么要先执行 `j--`？
    back: 找长度的循环让 j 停在 `'\0'` 上。不退一格的话，第一次交换就会把 `'\0'` 换到最前面，打印出来是空串，虽然后面的字节其实已经反转好了。
  - front: 两个字符串怎样比较大小？"Paint" 和 "Painter"、"Zebra" 和 "apple" 分别是谁小？
    back: 从头逐个比较，找到第一个不同的字符，比较它们的编号。前缀更小，因为 `'\0'` 是 0，所以 "Paint" 小；大写字母排在小写字母前面，所以 "Zebra" 小。`strcmp` 只保证返回值的正负号，判断时要写 `< 0`，不能写 `== -1`。
  - front: 用一个整数的各个位找重复字母时，怎样检查和记录？这种方法有什么局限？
    back: 先算 `x = 1u << (c - 'a')`，如果 `H & x` 不为 0，说明这个字母出现过，否则执行 `H |= x`。一位只能表示有没有出现过，不能计数，"banana" 里的 a 会被报两次重复；它也不能用来判断变位词。
  - front: 用两层循环判断变位词时，为什么要把找到的字符划掉？
    back: 如果不划掉，第二个字符串里的同一个字符会被重复匹配，"aab" 和 "abb" 就会被误判成变位词。另外，长度不同的两个字符串一定不是变位词，应该先比较长度。
  - front: 用计数表判断变位词时，为什么开头必须先比较长度？
    back: 扫描 a 时每个字母加一，扫描 b 时减一，减到负数就不是变位词。如果不先比较长度，"abc" 和 "ab" 会被判成变位词，因为 c 剩下的 1 没有被检查到。长度相同并且没有一格是负数时，每一格只能是 0。
  - front: 全排列的标记数组写法里，`T[i] = 0` 和 `static` 各起什么作用？
    back: '`T[i] = 0` 是回溯时撤销选择，漏掉它时只打印出 ABC，而且第二次调用什么也打印不出来。`static` 让所有递归层共用同一份 T 和 R，改成普通的局部数组以后，每一层看到的 T 都是全 0，会打印出 27 个字符串。'
  - front: 交换法写全排列时，递归调用后为什么还要再交换一次？输出是字典序吗？
    back: 循环的每一轮都假设 `S[l]` 到 `S[h]` 还是进入这一层时的样子，不换回来就会得到重复的排列（实测 ABC 和 ACB 各出现两次，BAC 和 BCA 没有出现）。输出顺序是 ABC ACB BAC BCA CBA CAB，不是字典序。
linux:
- post: Linux-Command-Line-Chapter1
  cards:
  - front: 终端、Shell 和内核各自负责什么？
    back: 终端只是一个显示窗口，负责接收键盘输入和显示输出；Shell（比如 bash、zsh）负责解析命令，再通过系统调用把请求交给内核；内核管理 CPU、内存、文件系统等资源，真正执行请求。
  - front: '`command -option argument` 这三部分是由谁切分的？文件名里带空格为什么会出问题？'
    back: 由 Shell 按空格切分，再作为参数列表交给命令。文件名带空格时，Shell 照样把它拆成两个参数，命令并不知道这两个词原本是一个文件名。
  - front: 执行 `clear` 之后，按 ↑ 为什么还能翻出历史命令？
    back: 屏幕显示由终端负责，命令历史由 Shell 负责。`clear` 只是让终端重新绘制窗口；要清除历史，得用 `history -c`。
  - front: '`echo $HOME` 打印出家目录，是 `echo` 认识这个变量吗？'
    back: 不是。Shell 在把参数交给 `echo` 之前，就已经把 `$HOME` 替换成了路径。写在单引号里的 `$HOME` 不会被展开，因为引号同样属于 Shell 的语法。
  - front: '`sort names.txt > names.txt` 为什么会把文件清空？应该怎么写？'
    back: 重定向由 Shell 完成，而且先于命令：Shell 先以清空的方式打开 `names.txt`，再启动 `sort`，于是 `sort` 读到的已经是空文件。应该写到另一个文件里，或者用 `sort names.txt -o names.txt`。
  - front: '`rm *.txt` 会删掉哪些文件，是在什么时候确定的？'
    back: 在 `rm` 启动之前。通配符由 Shell 展开，`rm` 收到的是一串具体的文件名。`rm` 默认不确认、不能撤销，加 `-i` 会逐个询问。
  - front: 合并短选项时，需要带参数的选项为什么必须放在最后？
    back: '`ncal -hA1` 等价于 `ncal -h -A 1`，`A` 在最后，后面的 `1` 才会被当作它的参数。写成 `-A1h` 时，`1h` 整个会被当作 `-A` 的参数。'
  - front: '`&&` 怎样决定要不要执行后一条命令？'
    back: 由 Shell 查看前一条命令的退出状态码，`0` 表示成功，这时才执行后一条。两条命令本身并不知道对方的存在。
  - front: 怎样删除一个名叫 `-rf` 的文件？
    back: 写成 `rm -- -rf`。单独的 `--` 表示选项到此结束，后面的内容都当作普通参数。
- post: Linux-Command-Line-Chapter2
  cards:
  - front: 在 `man` 里按 `h`，显示的是什么？
    back: 是翻页器自己的按键说明，不是命令的选项。`man` 只负责找到并格式化文档，翻页和响应按键的是另一个程序 `less`，所以这套按键在 `git log`、`less 大文件` 里也一样能用。
  - front: SYNOPSIS 里的 `[ ]`、`...`、`|` 分别表示什么？
    back: '`[ ]` 里的内容可以省略，`...` 表示前面的东西可以重复多次，`|` 表示两边二选一。加粗的字要原样照抄，斜体或下划线的字是占位符。'
  - front: '`ls [OPTION]... [FILE]...` 说明了哪些写法是合法的？'
    back: '`ls` 必须照写，后面可以跟任意多个选项，也可以一个都没有，再后面可以跟任意多个文件名，同样可以没有。所以 `ls`、`ls -l`、`ls -l a.txt b.txt` 都合法。'
  - front: man 手册为什么要分章节？`passwd` 是一个什么例子？
    back: 同一个名字在不同层次上可能是不同的东西。`passwd` 既是修改密码的命令（第 1 章），又是 `/etc/passwd` 文件格式的说明（第 5 章），直接 `man passwd` 只会显示最先找到的第 1 章。
  - front: '`man 5 passwd`、`man -a passwd`、`man -k passwd` 有什么区别？'
    back: 第一个直接看第 5 章；第二个把所有章节挨个看一遍；第三个拿关键词去搜索所有手册页的名字和一句话简介（等价于 `apropos`），适合连命令叫什么都不知道的时候。
  - front: '`man -k` 提示 `nothing appropriate`，一定是没有相关的手册吗？'
    back: 不一定。`man -k` 搜索的是事先建好的索引数据库，新系统上或刚装完软件时，索引可能还没建立，执行一次 `sudo mandb` 重建就好。
  - front: '`man cd` 为什么查不到？`cd` 为什么必须是内建命令？'
    back: '`cd` 不是磁盘上的程序，而是 Shell 内建命令，所以没有 man 手册。它要改变的当前工作目录保存在 Shell 自己身上；如果它是独立程序，改变的只是新进程自己的目录，退出后就没有效果了。'
  - front: '`type` 能区分哪几类名字？为什么查文档前应该先用它？'
    back: 别名、Shell 内建命令、函数和外部程序（给出完整路径）。这四类对应四种查文档的方式：别名用 `type` 看替换结果，内建命令用 `help`，函数用 `type` 看定义，外部程序用 `man` 或 `--help`。
  - front: '`which cd` 为什么什么都不返回？为什么 `type` 比 `which` 知道得多？'
    back: '`which` 到 `PATH` 列出的目录里找同名文件，而 `cd` 在磁盘上没有文件。`which` 本身是外部程序，看不到 Shell 内部的别名、函数和内建命令；`type` 是内建命令，从 Shell 内部查看。'
  - front: '`help ls` 为什么会报错？`help` 和 `--help` 有什么不同？'
    back: '`help` 是一条内建命令，只显示 Shell 内建命令的文档，而 `ls` 不是内建命令。`--help` 是传给程序的一个选项，由程序自己打印简介，能不能用要看程序有没有实现它。'
  - front: '`man echo` 看到的手册，就是敲 `echo` 时实际运行的那个吗？'
    back: 不一定。`echo` 同时有 Shell 内建和 `/usr/bin/echo` 两种形式，内建的优先级更高；`man echo` 打开的是外部程序的手册，两者支持的选项有差别。
- post: Linux-Command-Line-Chapter3
  cards:
  - front: Linux 的根目录写成什么？反斜杠在 Shell 里是什么？
    back: 根目录是正斜杠 `/`。反斜杠 `\` 在 Shell 里是转义符，作用是让后面那个字符不再按特殊含义解释。
  - front: Windows 和 Linux 的目录树有什么不同？插入一个 U 盘会怎样？
    back: Windows 每块磁盘各有一棵树；Linux 整个系统只有一棵树，树根是 `/`。U 盘、第二块硬盘不会长出新的树根，而是挂载到这棵树的某个目录上。
  - front: '`/root` 是根目录吗？'
    back: 不是。根目录是 `/`，`/root` 只是超级用户 root 的家目录，地位和 `/home/zby` 一样。
  - front: '`~` 是一个特殊的目录名吗？为什么有些配置文件里写 `~/xxx` 不起作用？'
    back: 不是。`~` 由 Shell 在启动命令之前替换成家目录的完整路径，加上引号写成 `echo '~'` 就不会替换。配置文件不是由 Shell 读取的，没有人做这个替换，`~` 会被当成一个名叫「~」的目录。
  - front: 绝对路径和相对路径的区别是什么？
    back: 以 `/` 开头的是绝对路径，从树根出发，在哪里执行结果都一样；不以 `/` 开头的是相对路径，从当前位置（`pwd`）出发，换个位置执行就会到达不同的地方。
  - front: '`ls -l` 第三列显示的是文件的创建者吗？'
    back: 不是，是属主（owner）。Linux 根本不记录文件是谁创建的，而属主可以用 `chown` 修改。
  - front: 一个文件有哪三个时间？`ls -l` 默认显示哪一个？改文件名会改变它吗？
    back: mtime（内容被修改）、atime（内容被读取，`ls -lu`）、ctime（元数据被修改，`ls -lc`）。`ls -l` 默认显示 mtime；改名改变的是 ctime，`ls -l` 显示的时间不变。
  - front: 目录那一行里的 `4096` 和硬链接数 `3` 分别是什么意思？
    back: '`4096` 是目录本身那张「名字到数据」对照表的大小，不是内容的总大小，总大小要用 `du -sh`。空目录的链接数是 2（上层目录里的名字和自己的 `.`），每多一个子目录就加一（子目录里的 `..`），所以 3 表示有 1 个子目录。'
  - front: '`touch` 的本职工作是什么？'
    back: 把文件的时间戳更新为当前时间。只有目标不存在时，才顺便创建一个空文件；对已有的文件执行 `touch` 不会清空它。
  - front: '`file` 命令靠什么判断文件类型？'
    back: 读取文件开头的内容（magic number），而不是看扩展名。把 SVG 改名成 `.txt`，`file` 仍然认出它是 SVG。扩展名对系统没有意义。
  - front: '`mkdir -p` 有哪两个作用？'
    back: 一是把路径中间缺少的目录一次补齐；二是目标目录已经存在时不报错，这在用 `&&` 串联的脚本里尤其有用。
- post: Linux-Command-Line-Chapter4
  cards:
  - front: 为什么第一个学的编辑器是 nano 而不是 vim？
    back: nano 没有模式，打开后直接打字就能输入；vim 在普通模式下敲的字母是命令。两者是不同的取舍：nano 把功能摆在屏幕上，代价是快捷键都要按 Ctrl；vim 把功能藏在模式里，换来双手不用离开主键区。
  - front: 在 nano 里怎样看出文件有没有保存？
    back: 看标题栏末尾的 `*`。修改后出现，按 `^S` 保存后消失；一直撤销到内容和磁盘一致时，它也会自动消失。
  - front: nano 状态行（倒数第三行）的信息有什么特点？
    back: 是一次性的，再按一个键就会被清除，所以出错时要当场看清楚。
  - front: nano 里的 `^X` 和 `M-U` 分别怎么按？Alt 键被占用时怎么办？
    back: '`^X` 是按住 Ctrl 再按 X，也可以连按两下 Esc 再按 X；`M-U` 是按住 Alt（Mac 上是 Cmd 或 Option）再按 U，也可以按一下 Esc 松开再按 U。Esc 可以代替这两个修饰键。'
  - front: '`nano nope/List.txt`（nope 目录不存在）会在什么时候报错？'
    back: '打开和输入都正常，直到按 `^S` 保存时，状态行才显示 `Error writing nope/List.txt: No such file or directory`，而且这条信息一闪就没了。'
  - front: nano 的 `^S`、`^O`、`^X` 各做什么？
    back: '`^S` 写回当前文件名，不询问（缓冲区还没有名字时会问）；`^O` 问的是写到哪个文件，改了名就是另存为，之后标题栏会换成新文件名；`^X` 是退出，它自己不写盘，有修改时问一句，选 `N` 会丢弃全部修改。'
  - front: 为什么 nano 底部的提示里没有 `^S`？哪些机器上按 `^S` 不能保存？
    back: '`^S` 在终端里原本表示 XOFF（暂停输出），早期 nano 干脆忽略它。2017 年 11 月的 nano 2.9.0 才让 `^S` 用来保存，版本低于 2.9 的机器上按 `^S` 什么也不会发生。'
  - front: '`nano a.txt`（文件不存在）和 `touch a.txt` 分别在什么时候碰磁盘？'
    back: '`touch` 在敲下回车的那一刻就建一个空文件；`nano` 只在内存里开一个空缓冲区，按 `^S` 或 `^O` 时才写盘，不修改直接 `^X` 退出的话，目录里仍然是空的。'
  - front: SSH 断线导致 nano 被关掉，没有保存的内容去哪了？
    back: nano 收到 `SIGHUP` 信号时，会把缓冲区存到 `<原名>.save` 文件里。所以断线后先用 `ls -A` 看看有没有 `.save` 文件。
  - front: 在 nano 里用 `^\` 把 apple 全部替换成 kiwi，为什么 `Apple` 也被换掉了？
    back: nano 的搜索默认不区分大小写（`M-C` 的作用是开启区分），而替换会照搬输入的字符串，不保留原来的大小写。批量修改标识符之前，要先按 `M-C`。
  - front: nano 的剪切和粘贴为什么是 `^K` 和 `^U`？连续按两次 `^K` 会怎样？
    back: 在终端里 `^C` 用来发送中断信号，`^V`、`^Z` 也各有传统用途，所以终端程序一般不占用它们。连续按 `^K` 时，剪下的内容会累积成一整块，按 `^U` 时一起粘贴回去。
  - front: nano 保存文件时，可能会悄悄改变文件的什么？
    back: 会在末尾自动补上一个换行符，比如文件从 19 字节变成 20 字节。因为 POSIX 要求文本文件的每一行都以换行符结尾。
  - front: 目录里出现了 `.f.txt.swp`，是怎么回事？
    back: 这是 nano 的锁文件（Ubuntu 的配置开启了 `set locking`），说明某个地方还有一个没退出的编辑器，或者上一次编辑器是被强制结束的。这时在别的终端打开同一个文件，nano 会提示有人正在编辑。
- post: Linux-Command-Line-Chapter5
  cards:
  - front: 目录里存的是什么？文件名记录在 inode 里吗？
    back: 目录是一张「名字到 inode 号」的对照表。文件的大小、权限、时间戳和数据块的位置记录在 inode 里，文件名不在 inode 里。
  - front: 用 `ln` 给文件建了第二个名字，再 `rm` 掉第一个名字，数据还在吗？
    back: 还在。`rm` 删除的是目录里的那条记录，链接数从 2 变成 1，数据仍然可以通过第二个名字访问。
  - front: 为什么 `rm` 删除 500 MB 的文件也很快？
    back: 它只是划掉目录里的那条记录，和文件大小无关。而且 `rm` 没有回收站，从命令行无法再访问被删的文件。
  - front: '`rm -d` 和 `rm -r` 有什么区别？'
    back: '`-d` 只能删除空目录，遇到非空目录会报错，正好在你误以为目录是空的时候拦住你；`-r` 是递归删除，连里面的内容一起删掉。'
  - front: '`rm -i` 和 `rm -I` 哪个更实用？为什么？'
    back: '`-I` 更实用。`-i` 每个文件问一次，删几十个文件时会被连按成肌肉记忆；`-I` 只在参数超过三个时问一次，正好拦在批量删除这个风险点上。'
  - front: 不加任何选项时，`rm` 在什么情况下会询问？`-f` 做了什么？
    back: 删除只读文件时会先问一句。`-f` 把所有护栏都关掉：不询问、不报错，目标不存在也当作成功。`rm -rf` 危险就在于同时去掉了递归限制和所有确认。
  - front: '`mv a.txt nope`（nope 不存在）会发生什么？怎样避免？'
    back: 不会报错，而是把 `a.txt` 改名成 `nope`。想把文件移进目录时，给目标加上结尾的斜杠，写成 `mv a.txt nope/`，目录不存在时就会报 `Not a directory`。
  - front: '`mv` 和 `cp` 覆盖已存在的文件时会提示吗？怎样防止覆盖？'
    back: 不会提示，直接覆盖。可以用 `-i`（覆盖前问一次）或 `-n`（目标已存在就什么都不做），写进脚本时 `-n` 更合适。
  - front: 同一分区内 `mv` 为什么那么快？跨分区呢？
    back: 同一分区内只改目录表里的一行记录，inode 不变，速度和文件大小无关（200 MB 只要 3 ms）。跨分区要真的复制数据再删除源文件（154 ms，inode 也变了），中途被打断时，可能两边各有一份，或者源文件已经不完整。
  - front: 复制目录为什么必须加 `-r`，而 `mv` 移动目录不用？
    back: '`mv` 只改一条记录，在那张表里目录和文件没有区别；`cp` 要真的复制内容，遇到目录时必须决定里面的东西要不要一起复制，`-r` 回答的就是这个问题。'
  - front: 连续执行两次 `cp -r s d`，会得到什么？
    back: '`d` 和 `d/s` 两层目录。第一次执行时 `d` 不存在，复制成 `d`；第二次 `d` 已经存在，于是复制成 `d/s`。'
- post: Linux-Command-Line-Chapter6
  cards:
  - front: Bash 里 Ctrl+A、Ctrl+W 这些快捷键是由谁处理的？
    back: 由 GNU readline 库处理，键位沿用了 Emacs 的习惯。所以其他使用 readline 的程序（比如 Python 交互式解释器）里也能用。Alt 组合键被终端占用时，可以先按一下 Esc 再按字母。
  - front: 在 readline 看来，「词」由什么组成？
    back: 只由字母和数字组成，`/`、`.`、`-` 都是分隔符，所以 `/usr/local/share/doc` 是四个词。另外，`Alt+F` 会停在当前词的末尾，而不是下一个词的开头。
  - front: '`Ctrl+W` 和 `Alt+Backspace` 都是删除左边一个词，有什么区别？'
    back: '`Ctrl+W` 只把空格当作边界，`cd /usr/local/share/doc` 会一次删掉整条路径；`Alt+Backspace` 以字母数字为界，只删掉 `doc`。'
  - front: 光标不在行尾时，`Ctrl+U` 会清空整行吗？
    back: 不会。`Ctrl+U` 删除光标左边的全部内容，`Ctrl+K` 删除光标右边的全部内容，两者以光标为分界线。
  - front: 用 Ctrl+U、Ctrl+W 删掉的内容还能找回来吗？
    back: 能。它们进入了剪切环，`Ctrl+Y` 粘贴最近一次删除的内容（连续的删除会合并成一次），换一条命令后也还在；紧接着按 `Alt+Y` 可以换成更早删除的内容。所以可以用 `Ctrl+U` 暂存半条命令，先做别的事，再用 `Ctrl+Y` 取回。
  - front: '`Ctrl+T` 和 `Alt+T` 分别做什么？在 `cp new.txt old.txt` 末尾按 `Alt+T` 会得到什么？'
    back: '`Ctrl+T` 交换相邻的两个字符（`gti` 变成 `git`），`Alt+T` 交换相邻的两个词。因为 `old.txt` 被当作 `old` 和 `txt` 两个词，结果是 `cp new.txt txt.old`。'
  - front: '`Ctrl+L` 和 `clear` 有哪两处不同？'
    back: '`Ctrl+L` 会保留正在输入的那一行，也不清除回滚缓冲区；`clear` 是一条命令，而且会多发送一段 `\e[3J` 清空回滚缓冲区。想保留回滚内容可以用 `clear -x`。'
  - front: 当前会话里输入的命令，什么时候写进 `~/.bash_history`？怎样让一条命令不进历史？
    back: 退出时才追加写入，直接关掉终端可能写不进去。以空格开头的命令不会被记录（`HISTCONTROL=ignoreboth`），连续两次相同的命令也只记一条。
  - front: '`! 2` 和 `!2` 有什么区别？`!2` 会重新显示当时的输出吗？'
    back: '`!` 后面跟着空格表示对命令的结果取反，Bash 会去找一个名叫 `2` 的命令。`!2` 是把第 2 条命令重新执行一遍，结果可能和当时不同。`!!` 表示上一条命令，常见用法是 `sudo !!`。'
  - front: Ctrl+R 搜到命令以后，按 Enter 和按 Ctrl+E 有什么区别？
    back: Enter 会直接执行这条命令；Ctrl+E（或 →）把它放到命令行上，改完再执行；Ctrl+G 放弃搜索，回到原来那一行。
  - front: 按下 Ctrl+S 之后终端像卡死了一样，是怎么回事？
    back: Ctrl+S 在到达 readline 之前，先被终端当作流量控制里的 XOFF（暂停输出）处理了。按 Ctrl+Q 就能恢复；执行一次 `stty -ixon` 关掉这个功能之后，Ctrl+S 才会变成向前搜索。
- post: Linux-Command-Line-Chapter7
  cards:
  - front: '`cat a.txt missing.txt b.txt` 里有一个文件不存在，会怎样？'
    back: 不会停下来，打印报错之后接着打印后面的文件。
  - front: '`less` 和 man 手册的翻页键为什么一样？怎么退出？'
    back: man 在背后就是用 `less` 显示内容的。按 `q` 退出；在按 `h` 打开的帮助页里，按 `q` 只是回到正文，要再按一次才会退出。
  - front: '`tac` 和 `rev` 分别把什么倒过来？`rev` 处理中文要满足什么条件？'
    back: '`tac` 倒转行的顺序，`rev` 倒转每一行里的字符。`rev` 要在 UTF-8 的 locale 下才能正确处理中文，`LC_ALL=C` 时会报错。'
  - front: '`head -n -5` 和 `tail -n +2` 分别是什么意思？'
    back: '`head -n -5` 是除了最后 5 行以外的全部内容；`tail -n +2` 是从第 2 行开始一直到结尾，常用来跳过表头。'
  - front: '`head -c 4` 截取中文文件时为什么会出现乱码？'
    back: '`-c` 按字节截取，UTF-8 里一个汉字占 3 个字节，4 个字节就是「你」字加上「好」字的第一个字节。'
  - front: 用 `sed -i` 修改日志之后，`tail -f` 为什么不再有新输出？
    back: '`sed -i` 先写出一个新文件，再把名字换到新文件上，而 `tail -f` 跟着的仍然是旧文件。改用 `tail -F`，它会按文件名重新查找，提示文件被替换后跟踪新文件。'
  - front: '`wc -l` 统计的是什么？什么情况下会少算一行？'
    back: 统计的是换行符的个数。最后一行末尾没有换行符时，这一行不会被计算在内，比如 `printf 'hello world\nsecond line'` 只算 1 行。
  - front: '`wc -m` 和 `wc -c` 统计中文时有什么不同？'
    back: '`-c` 是字节数，`-m` 是字符数。内容是「你好 世界」加一个换行时，在 UTF-8 locale 下是 6 个字符、14 个字节；在 `LC_ALL=C` 下，`-m` 也变成了 14。'
  - front: '`sort` 排序时，大写字母和小写字母谁在前？'
    back: 取决于 locale。`C` 类 locale 按字符编码排序，所有大写字母排在所有小写字母前面；`en_US.UTF-8` 这类语言 locale 按词典习惯，先不区分大小写比较字母，字母相同时小写在前。想忽略大小写可以用 `sort -f`。
  - front: 为什么 `sort` 会把 100 排在 2 前面？只加 `-r` 能让数字从大到小吗？
    back: 默认按字符比较，`100` 的第一个字符 `1` 比 `2` 小。`-r` 只是把当前的排序结果反过来，并不知道内容是数字，要从大到小应该写 `-nr`。
  - front: '`sort -k2` 和 `sort -k2,2` 有什么区别？'
    back: '`-k2` 从第 2 列开始一直比较到行尾；`-k2,2` 只比较第 2 列。第 2 列是数字时还要写成 `-k2,2n`。分隔符不是空白时用 `-t` 指定，拿不准比较的是哪一段时，加上 `--debug`。'
- post: Linux-Command-Line-Chapter8
  cards:
  - front: 标准输入、标准输出、标准错误分别是几号文件描述符？默认接到哪里？
    back: 0 号是标准输入，默认接键盘；1 号是标准输出，2 号是标准错误，默认都接屏幕，也就是当前终端。
  - front: '`cat a.txt missing.txt b.txt > out.txt` 执行后，报错去了哪里？'
    back: 报错写在 2 号上，仍然显示在屏幕上，并没有进入 `out.txt`。结果和报错分成两条通道，报错既不会混进结果，也不会被漏看。
  - front: '`dtae > notes.txt`（命令打错了）执行之后，`notes.txt` 原来的内容还在吗？'
    back: 不在了，文件变成了 0 字节。Shell 在启动命令之前就已经把文件打开并清空了，命令能不能运行都不影响这一步。
  - front: 怎样安全地对一个文件「原地」排序？
    back: 先写到另一个文件，确认后再替换：`sort fruits.txt > fruits.sorted && mv fruits.sorted fruits.txt`，或者用 `sort -o fruits.txt fruits.txt`。不能写成 `sort fruits.txt > fruits.txt`。
  - front: '`cat t.txt` 和 `cat < t.txt` 有什么区别？'
    back: 前者把文件名作为参数交给 `cat`，由 `cat` 自己打开；后者由 Shell 打开文件并接到 `cat` 的 0 号上，`cat` 不知道文件名。所以 `wc -l < t.txt` 只输出数字，文件不存在时报错的是 `bash` 而不是 `cat`。
  - front: '`2> err.txt`、`>2 err.txt`、`2 > err.txt` 三种写法分别是什么意思？'
    back: 第一种把 2 号接到 err.txt；第二种把 1 号接到一个名叫 `2` 的文件，`err.txt` 成了要读的文件；第三种把 `2` 当成要读的文件，1 号接到 err.txt。数字必须紧贴在 `>` 前面。
  - front: 为什么 `> all.txt 2> all.txt` 会让输出和报错互相覆盖？
    back: 这是两次独立的打开，各自记录下一个字节写在哪里，都从文件开头开始写。应该写成 `> all.txt 2>&1`，只打开一次，让两者共享同一个写入位置。
  - front: '`2>&1` 里的 `&` 是什么意思？写成 `2>1` 会怎样？'
    back: '`&` 表示后面的 `1` 是文件描述符的编号，而不是文件名。写成 `2>1`，报错就会写进一个名叫 `1` 的文件。'
  - front: '`2>&1 > all.txt` 为什么没能把报错写进文件？'
    back: Shell 从左往右处理重定向。`2>&1` 写在前面时，1 号还连着屏幕，2 号复制过去的就是屏幕；后面的 `> all.txt` 只改了 1 号。`2>&1` 复制的是 1 号当时所连接的地方。
  - front: '`命令 &> all.txt` 在 `sh` 里为什么不起作用？'
    back: '`&>` 是 bash 的简写。Ubuntu 和 Debian 上的 `sh` 其实是 dash，它把 `&` 理解成后台运行，`> all.txt` 变成了一次单独的清空操作，结果输出照常显示在屏幕上，all.txt 是空的。'
  - front: '`/dev/null` 是什么？'
    back: 一个特殊的文件，写进去的内容会被直接丢弃。比如 `命令 2>/dev/null` 可以不显示报错。
- post: Linux-Command-Line-Chapter9
  cards:
  - front: '`A | B` 把什么接到了什么上？'
    back: 把 A 的标准输出（1 号）接到 B 的标准输入（0 号）上。连接由 Shell 在启动两条命令之前完成，中间是内核里的一块缓冲区，不经过任何文件。
  - front: '把 `date | rev` 误写成 `date > rev` 会怎样？'
    back: Shell 不会报错，而是把 `date` 的结果写进一个名叫 `rev` 的文件，`rev` 这条命令根本没有运行。重定向符号后面是文件名，管道符号后面是命令。
  - front: '`echo /usr/bin | ls` 为什么列出的还是当前目录？'
    back: 管道传过去的是数据的内容，不是参数。`ls` 只看参数、从不读标准输入，所以管道里的 `/usr/bin` 被忽略了。
  - front: '`cat a.txt missing.txt | wc -l` 里的报错会进入管道吗？怎样让它进入？'
    back: 不会，管道只连接 1 号，报错写在 2 号上，仍然显示在屏幕上。写成 `2>&1 |` 或者 bash 的简写 `|&` 才会让报错也进入管道。
  - front: '第八章说 `2>&1` 要写在 `>` 后面，为什么 `cmd 2>&1 | wc` 写在 `|` 前面也有效？'
    back: Shell 先把管道接好，再从左往右处理这条命令自己的重定向。处理 `2>&1` 时 1 号已经接在管道上了，所以 2 号跟过去的也是管道。
  - front: '`ls > list.txt | wc -l` 为什么输出 0？'
    back: 1 号先接到管道上，随后又被 `> list.txt` 改接到了文件，所以 `ls` 的结果全部进了 list.txt，`wc` 一行都没有收到。
  - front: '`date +%T; sleep 3 | date +%T` 的两个时间为什么是同一秒？'
    back: 管道两边的命令是同时启动的，右边的 `date` 不会等 `sleep` 结束。Shell 只是要等管道里的命令全部结束，才会执行后面的命令。
  - front: '`yes` 永远不会自己停下来，`yes | head -3` 为什么能立刻结束？'
    back: 两边同时运行，`head` 读完三行就退出了。管道的另一头没有命令在读以后，`yes` 再往里写就会被系统直接结束。
  - front: '`cat f.txt | sort > f.txt` 的结果是什么？'
    back: 不确定。`cat` 读文件和 Shell 清空文件同时进行，多数时候得到空文件，偶尔内容完好，大文件还可能只剩一部分。应该先写到另一个文件，再用 `mv` 替换回来。
  - front: '`tr s S sally.txt` 为什么报错？'
    back: '`tr` 只读标准输入，不接受文件名参数，sally.txt 被当成了多余的参数（extra operand）。要写成 `cat sally.txt | tr s S` 或 `tr s S < sally.txt`。'
  - front: "`echo 'hello world' | tr 'world' 'WORLD'` 的输出是什么？为什么？"
    back: '`heLLO WORLD`。`tr` 按字符一一对应（w→W、o→O、r→R、l→L、d→D），并不认识 world 这个词，所以 hello 里的 l 和 o 也被换掉了。替换字符串要用别的工具，比如 `sed`。'
  - front: '`tr -d` 和 `tr -s` 分别做什么？'
    back: '`-d` 删除 SET1 里的所有字符，比如 `tr -d s` 删掉所有小写 s；`-s` 把连续重复的同一个字符压缩成一个，比如 `tr -s '' ''` 让单词之间只留一个空格。'
  - front: '`tr -d [:alpha:]` 为什么要写成 `tr -d ''[:alpha:]''`？'
    back: 不加引号时，Shell 把 `[:alpha:]` 当成方括号通配符，匹配名字是 `:`、`a`、`l`、`p`、`h` 之一的单字符文件。如果当前目录里有文件 `a`，`tr` 实际收到的就是 `tr -d a`，而且不会有任何报错。
  - front: '`[:blank:]` 和 `[:space:]` 有什么区别？'
    back: '`[:blank:]` 只有空格和制表符；`[:space:]` 还包括换行符，用它删除空白会把所有行连成一行。'
  - front: '`tr -d ''你''` 能只删掉「你」这个字吗？'
    back: 不能。GNU tr 按字节处理，「你」在 UTF-8 里占 3 个字节，这 3 个字节会从所有汉字里删掉，含有相同字节的「好」「世」也被删坏，输出变成乱码。
  - front: '`ls /usr/bin | tee cmds.txt | wc -l` 中 `tee` 做了什么？'
    back: 把经过的数据写进 cmds.txt，同时原样交给 `wc -l`。所以屏幕上照常显示行数，cmds.txt 里保存了完整的列表。名字来自水管的 T 形三通。
  - front: '`tee` 会覆盖文件还是追加？能保存报错吗？'
    back: 默认和 `>` 一样先清空再写，追加要用 `tee -a`（相当于 `>>`）。`tee` 只能收到标准输出，想保存报错要在前面加 `2>&1`。
- post: Linux-Command-Line-Chapter10
  cards:
  - front: '`echo *.html` 打印出来的为什么是文件名，而不是 `*.html`？'
    back: Shell 在启动 `echo` 之前做了路径名展开，把 `*.html` 换成了当前目录里以 .html 结尾的文件名，并按字母顺序排好。`echo` 收到的是这几个文件名，它并不知道用户输入过 `*`。
  - front: '`*` 能匹配到隐藏文件和目录吗？'
    back: 以点开头的隐藏文件匹配不到，模式本身要以点开头才行，比如 `.s*`。目录的名字则和普通文件一样，会被 `*` 匹配到。
  - front: '`day?.log` 能匹配 day10.log 吗？'
    back: 不能。`?` 恰好匹配一个字符，而 day10.log 在 day 和 .log 之间有两个字符，要写成 `day??.log` 才能匹配。
  - front: 方括号 `[13]`、`[1-3]`、`[^1]` 分别匹配什么？
    back: 都只匹配一个字符。`[13]` 是 1 或 3，`[1-3]` 是 1 到 3 中的任意一个，`[^1]` 是除了 1 以外的任意字符，POSIX 的写法是 `[!1]`。方括号里的逗号也算一个字符，所以不要写成 `[1,3]`。
  - front: 当前目录里没有 png 文件，`echo *.png` 和 `ls *.png` 分别会怎样？
    back: 匹配不到时，Bash 会把模式原样交给命令。所以 `echo` 打印出 `*.png`，而 `ls` 收到的是字面上的 `*.png`，于是报错说找不到名叫 `*.png` 的文件。
  - front: 执行 `rm day?.log` 之前，怎样确认它会删掉哪些文件？
    back: 在前面加上 `echo`，写成 `echo rm day?.log`。因为展开在命令启动之前就完成了，所以屏幕上显示的就是 `rm` 将会收到的参数。也可以先执行 `set -x`。
  - front: 家目录里没有 notes.txt 时，`echo ~/notes.txt` 打印什么？`echo a~` 呢？
    back: 前者照样打印出家目录下 notes.txt 的完整路径，因为波浪号展开只替换文字，不检查路径是否存在。后者原样打印 `a~`，因为 `~` 只有在单词的开头才会被替换。
  - front: '`echo {a,b}{1,2}` 和 `echo x{a,b}y` 的输出是什么？'
    back: 分别是 `a1 a2 b1 b2` 和 `xay xby`。花括号外面的前缀和后缀会接到里面的每一个部分上，两组花括号里的部分会两两组合。
  - front: '`echo {1..10..2}` 的输出里为什么没有 10？'
    back: 序列从 1 开始每次加 2，得到 1 3 5 7 9，再加 2 就是 11，已经超过了终点，所以 10 不在结果里。
  - front: 目录里只有 day1.log 到 day3.log，`touch day{4..6}.log` 和 `touch day[4-6].log` 各会新建什么？
    back: 花括号按写法生成，所以前者新建 day4.log、day5.log、day6.log 三个文件。方括号只匹配已经存在的文件，一个都匹配不到就原样保留，所以后者新建了一个名字就叫 `day[4-6].log` 的文件。
  - front: '`echo $((10/3))` 和 `echo $((10/3.0))` 的结果是什么？'
    back: 前者是 3，后者报语法错误。Bash 的算术展开只支持整数，除法会舍去小数部分，算式里也不能出现小数。
  - front: '`echo $((10*7))` 和 `echo 10 * 7` 有什么不同？'
    back: '`$(( ))` 里的 `*` 是乘号，所以输出 70。直接写在 `echo` 后面的 `*` 是通配符，会被展开成当前目录里的所有文件名。'
  - front: '`echo $(10+7)` 为什么报 command not found？'
    back: 只有一层括号的 `$( )` 是命令替换，Shell 会把 `10+7` 当成一条命令去运行。算术展开要写两层括号，也就是 `$((10+7))`。
  - front: 双引号和单引号里，分别还有哪些展开会发生？
    back: 双引号里只有以 `$` 开头的展开（比如 `$(( ))` 和 `$( )`）和反引号还会发生，通配符、`~` 和花括号都不展开，空格也原样保留。单引号里任何展开都不会发生。
  - front: '`echo "price: $100"` 为什么打印出 `price: 00`？'
    back: '`$` 在双引号里仍然有效，`$1` 被当成了第一个位置参数，而它在终端里是空的。要改用单引号，或者写成 `\$100`。'
  - front: 10 月 4 日这天，`echo $(date)` 和 `echo "$(date)"` 的输出为什么不一样？
    back: '`date` 的输出里 Oct 和 4 之间有两个空格。没有加双引号时，命令替换的结果会按空格再拆分一遍，两个空格就变成了一个；加上双引号，结果会作为一个完整的参数原样保留。'
  - front: Bash 展开的顺序是什么？为什么 `{1..$((1+2))}` 不会展开成 1 2 3？
    back: 顺序是花括号展开，然后从左往右做波浪号、变量、算术展开和命令替换，接着拆分单词，再做路径名展开，最后去掉引号。花括号展开最先做，那时 `$((1+2))` 还没有算出来，序列不完整，所以不展开。
- post: Linux-Command-Line-Chapter11
  cards:
  - front: '`locate notes` 的参数是路径吗？在不同目录下运行，结果会不同吗？'
    back: 不是路径，而是要在完整路径里查找的一段文字，路径里包含它的文件和目录都会列出来。`locate` 查的是数据库，所以在哪个目录下运行，结果都一样。
  - front: '`locate` 的 `-i`、`-l 3`、`-c` 分别是什么意思？'
    back: '`-i` 不区分大小写，`-l 3` 最多打印 3 条，`-c` 只打印匹配到的数量。'
  - front: 为什么 `locate 'notes*'` 什么都找不到，而 `locate '*notes*'` 可以？
    back: 模式里有通配符时，`locate` 用它去匹配整条路径，而路径都以 `/` 开头，所以 `notes*` 匹配不上。另外模式要加引号，否则会先被 Shell 展开。
  - front: 刚新建的文件 `locate` 为什么查不到？刚删掉的文件为什么还查得到？
    back: '`locate` 查的是 `updatedb` 生成的数据库，默认每天才更新一次。`-e` 能去掉已经删除的文件，但是找不出数据库里没有的文件，要执行 `sudo updatedb` 重建数据库。'
  - front: '`find` 不带参数会列出什么？会跳过隐藏文件吗？'
    back: 从当前目录开始，逐层列出所有文件和目录，包括 `.` 本身。它不会跳过以点开头的隐藏文件，输出也不按字母排序。
  - front: '`find . -name *.md` 为什么可能漏掉文件？'
    back: 不加引号时，Shell 会先在当前目录展开 `*.md`。当前目录只有 README.md 时，`find` 收到的是 `-name README.md`，子目录里的 guide.md 就被漏掉了，而且没有任何报错。有多个匹配时则会报 paths must precede expression。
  - front: '`-type f`、`-type d`、`-iname` 分别是什么意思？'
    back: '`-type f` 只找普通文件，`-type d` 只找目录，`-iname` 按名字匹配时不区分大小写。'
  - front: '`find . -type f -size -1M` 为什么只找到了空文件？'
    back: '`-size` 会先把大小按单位向上取整，一个 600k 的文件算作 1M，并不小于 1M，所以只剩下大小为 0 的文件。要找小文件就换小一点的单位，比如 `-size -100k`。'
  - front: '`-size 100` 不写单位时是多大？'
    back: 100 个 512 字节的块，也就是 51200 字节。字节的单位是 `c`，此外还有 `k`、`M`、`G`。
  - front: atime、mtime、ctime 分别是什么？各用什么命令查看？
    back: atime 是最近一次读取内容的时间，用 `ls -lu`；mtime 是最近一次修改内容的时间，`ls -l` 默认显示；ctime 是属性最近一次变化的时间，用 `ls -lc`。`stat` 可以一次看到全部。
  - front: ctime 是文件的创建时间吗？
    back: 不是，c 指的是 change。内容、权限、属主、名字有任何一项变化，ctime 都会更新，而且它不能用 `touch` 往前调。创建时间在 `stat` 的 Birth 一行。
  - front: 连续 `cat` 同一个文件两次，atime 会更新两次吗？
    back: 一般不会。内核默认采用 relatime 规则，只有 atime 早于 mtime 或 ctime、或者已经超过一天时，读取才会更新 atime。
  - front: '`find . -mmin -30` 和 `find . -mmin +30` 分别找什么？'
    back: '`-mmin -30` 找 30 分钟以内修改过的文件，`-mmin +30` 找 30 分钟以前修改的文件。数字表示从修改到现在经过了多久。'
  - front: 30 小时前修改的文件，满足 `-mtime +1` 吗？
    back: 不满足。`find` 先算出经过了几个 24 小时，舍掉小数部分，30 小时是 1.25，舍掉以后是 1，不大于 1。它满足的是 `-mtime 1` 和 `-mtime +0`。
  - front: '`find . -name ''*.md'' -or -name ''*.jpg'' -exec ls -l {} \;` 为什么漏掉了 .md 文件？'
    back: 「与」比「或」先结合，`-exec` 只和 `-name '*.jpg'` 连在一起。而条件里有了 `-exec` 以后，`find` 也不再自动打印路径。要写成 `\( -name '*.md' -or -name '*.jpg' \) -exec ...`。
  - front: '`-exec` 结尾的分号为什么要写成 `\;`？换成 `+` 有什么不同？'
    back: 分号是 Shell 分隔命令的符号，不加反斜杠或引号就会被 Shell 拿走，`find` 报 missing argument to `-exec`。`\;` 每个文件执行一次命令，`+` 把路径攒在一起执行。
  - front: '`find . -name ''*.png'' | xargs ls` 在没有找到文件时会怎样？带空格的文件名呢？'
    back: GNU `xargs` 输入为空时仍会执行一次不带参数的 `ls`，列出当前目录，加 `-r` 可以避免。`xargs` 按空格拆分，带空格的文件名会被拆开，要用 `find -print0` 配合 `xargs -0`。
git:
- post: Git-Chapter0-Command-Line
  cards:
  - front: Git 的命令怎样知道要操作哪个项目？
    back: 它们不接收这个参数，依靠的是执行命令时 Shell 的当前工作目录。`git init` 把当前目录变成仓库，`git add .` 里的点也是当前目录，所以结果出乎意料时，先敲一下 `pwd`。
  - front: '`ls projects` 会进入 `projects` 目录吗？'
    back: 不会，它只是查看那个目录里的内容，`pwd` 的输出不变。查看和进入是两条不同的命令，只有 `cd` 会改变位置。
  - front: Unix 里的「隐藏文件」是怎么回事？为什么用 Git 时要特别注意？
    back: 文件系统没有「隐藏」这个属性，名字以 `.` 开头的文件就是隐藏文件，`ls` 默认跳过它们。`.git` 和 `.gitignore` 都以点开头，不加 `-a` 的 `ls` 永远看不到它们。
  - front: '`ls -a` 输出开头的 `.` 和 `..` 是什么？'
    back: 每个目录里真实存在的两个条目，`.` 指向目录本身，`..` 指向上一层。`cd ..` 能回到上一层，是因为这个条目真实存在，`cd` 只是照常走了进去。
  - front: '`cd -` 和不带参数的 `cd` 分别去哪里？'
    back: '`cd -` 回到上一次所在的位置；不带参数的 `cd` 回到家目录。'
  - front: '`rm -rf` 里的 `-r` 和 `-f` 分别关掉了什么？'
    back: '`-r` 让 `rm` 能递归地删除目录；`-f` 让它不提示、不报错，目标不存在也当作成功。两个选项凑在一起时最危险。'
  - front: '`rm -rf *` 的破坏范围由什么决定？怎样减少误删？'
    back: 由按下回车那一刻 `pwd` 的值决定，而且 `*` 由 Shell 在启动 `rm` 之前就展开好了。删除之前先 `pwd` 确认位置，再用同样的参数先跑一遍 `ls`，看清会匹配到哪些文件。
  - front: '`rm -rf .git` 会造成什么后果？'
    back: 工作区里的文件一个不少，但所有提交记录、所有分支和所有可以回退的版本都没有了，而且无法挽回。
  - front: '`open .`、`start .`、`xdg-open .`、`explorer.exe .` 分别用在哪里？'
    back: 依次用于 macOS、Windows（CMD 或 PowerShell）、Linux 桌面和 WSL。末尾的 `.` 就是当前目录，所以打开哪个窗口同样由 `pwd` 决定。
- post: Git-Chapter1-Repository-Basics
  cards:
  - front: '`git init` 在物理上做了什么？'
    back: 在当前目录里创建一个 `.git` 文件夹，项目文件一个字节都不改。它作用于当前工作目录，所以执行前先用 `pwd` 确认位置；在家目录里误执行一次，Git 就会开始管理整个家目录。
  - front: 第一次使用 Git 之前必须设置什么？不设置会怎样？
    back: 用 `git config --global user.name` 和 `user.email` 设置身份。每次提交都要记录作者，没有设置时 `git commit` 会直接失败。
  - front: 一次改动从编辑到进入历史，要经过哪三个地方？
    back: 工作区（正在编辑的文件），经过 `git add` 进入暂存区（挑好的、准备提交的内容），再经过 `git commit` 进入仓库（`.git` 里的永久记录）。
  - front: 暂存区存在的理由是什么？
    back: 让一次改动和一次提交不必强行绑定在一起。同时改了三个文件时，可以只挑与当前功能有关的两个先提交，配置改动另外提交。暂存区是用来挑选的地方，而不是用来保存的地方。
  - front: '`git status` 输出的三个栏目分别表示什么？'
    back: '`Untracked files` 是 Git 从没见过的新文件；`Changes not staged for commit` 是追踪过、改了、但还没 `add` 的文件；`Changes to be committed` 是已经 `add` 过、等待提交的内容。'
  - front: 「未跟踪」等于「被忽略」吗？
    back: 不等于。未跟踪只是 Git 还没有管理过这个文件，`add` 一次之后它就变成被追踪的文件，此后每一次改动 Git 都会关注。
  - front: 在子目录 `src/` 里执行 `git add .`，会暂存哪些改动？
    back: '`.` 就是当前目录，它会递归包括所有子目录，但只从当前位置往下找，仓库根目录下其他地方的改动抓不到。'
  - front: '`git add notes.md` 之后又修改了它，再执行 `git commit`，提交的是哪个版本？'
    back: 是 `add` 那一刻的版本。`git add` 暂存的是文件此刻的内容快照，而不是「这个文件」；这时 `git status` 里同一个文件会同时出现在两栏。想提交新版本，要再 `add` 一次。
  - front: 提交信息为什么习惯写成现在时的祈使句？
    back: 这是协作中的通行惯例，比如写成 `add gitignore for build output`，这样和 Git 自己生成的提交信息（比如 `Merge branch ...`）风格一致。
  - front: '`git commit --amend` 真的修改了上一次提交吗？'
    back: 没有。提交对象不可修改，`--amend` 是创建一个新的提交，再让分支指向它，所以 SHA 会变。已经推送到远程的提交不要 amend，否则两边的历史会从这里分叉。
  - front: '`.gitignore` 里不带斜杠的规则和中间带斜杠的规则有什么区别？'
    back: 不带斜杠的规则（如 `.DS_Store`）匹配任意层级的同名文件；中间带 `/` 的规则（如 `build/output`）是从 `.gitignore` 所在目录算起的路径。末尾的斜杠表示只匹配目录，以 `!` 开头的是反向规则。
  - front: 写进 `.gitignore` 的文件，为什么还出现在 `git status` 里？怎么解决？
    back: '`.gitignore` 只对还没有被追踪的文件有效，文件只要 `add` 或提交过一次，就会一直被追踪。用 `git rm --cached 文件` 把它移出追踪，再提交一次；`--cached` 不能漏，否则磁盘上的文件也会被删掉。'
  - front: '`.gitignore` 本身要不要提交到仓库？'
    back: 要。它是项目配置的一部分，每个克隆仓库的人都要拿到同一份忽略规则，否则大家看到的 `git status` 会不一样。
- post: Git-Chapter2-Branching
  cards:
  - front: 一个分支在 `.git` 里是什么？
    back: 是 `.git/refs/heads/` 下的一个文件，里面是一个 40 位的提交号加一个换行符，一共 41 字节。所以创建分支是瞬间完成的，一百个分支也不会让仓库变大，删除分支也不会删除提交。
  - front: 在空仓库里执行 `git branch`，为什么什么都不输出？
    back: 分支是记录着某个提交的文件，还没有任何提交时就没有东西可以记录，`master` 要等第一次 `commit` 之后才真正出现。
  - front: '`HEAD` 记录的是什么？切换分支在文件层面做了什么？'
    back: '分支记录提交号，`HEAD` 记录分支名（比如 `ref: refs/heads/master`）。切换分支就是改写 `.git/HEAD` 那一行，再把工作区更新成新分支所指提交的样子。'
  - front: 什么是分离头指针（detached HEAD）？有什么风险？
    back: '`HEAD` 里直接写着一个提交号，而不是分支名。这时照样可以修改和提交，但新的提交没有任何分支记录着它，切换走以后，只有 `git reflog` 里还留着它的编号。'
  - front: '`git branch tmp` 会把新分支建在哪里？会切换过去吗？'
    back: 建在 `HEAD` 当前所在的提交上，不一定是 master。它只创建、不切换，想一步完成两件事要用 `git switch -c tmp`。
  - front: '`git checkout f.txt` 为什么会弄丢未提交的改动？换成 `git switch f.txt` 呢？'
    back: '`checkout` 一个人承担了两项工作，参数不是分支名时，它会用暂存区的版本覆盖工作区的文件，没有确认也没有警告。`switch` 只负责切换分支，参数不是分支名就报错退出；覆盖文件的功能交给了 `git restore`。'
  - front: '`git branch -d` 和 `-D` 有什么区别？日常应该用哪个？'
    back: '`-d` 会检查分支上的提交是否已经合并到别处，没合并就拒绝删除；`-D` 跳过检查强制删除。日常默认用 `-d`，确认真要删时，再照着报错信息改用 `-D`。'
  - front: 为什么不能删除当前所在的分支？删错了分支怎样找回？
    back: '`HEAD` 记录着这个分支名，删掉分支文件后 `HEAD` 就指向了不存在的东西，所以要先切到别的分支。删错了可以从 `git reflog` 找回提交号，再执行 `git branch <名字> <提交号>` 重建，因为删掉的只是一个 41 字节的指针。'
  - front: '`git branch -m` 带一个参数和带两个参数有什么区别？'
    back: 一个参数时修改当前分支的名字，要求 HEAD 在那条分支上；两个参数时修改指定的那条分支，在哪里都能执行。
  - front: 带着未提交的改动切换分支，Git 在什么情况下会拒绝？
    back: 不看改动的种类，而看切换过去会不会覆盖还没提交的内容。改了的已追踪文件在目标分支上内容相同就放行，不同就拦下；新建的未追踪文件在目标分支上不存在就放行，已被追踪就拦下。报错的关键词都是 `would be overwritten`。
  - front: 没有提交的改动属于哪个分支？
    back: 不属于任何分支。它们留在工作区里，切换到哪个分支就跟到哪个分支，在哪个分支上提交，就进入哪个分支。
- post: Git-Chapter3-Merging
  cards:
  - front: '`git merge feature` 的方向是什么？'
    back: 把 `feature` 合并进当前分支，所以要先切换到接收合并的那一边。
  - front: 什么情况下会快进？快进做了什么？
    back: 当前分支指向的提交是对方的祖先、中间没有分叉时会快进。Git 只是把当前分支那个 41 字节的文件改写成对方的提交号，不产生新提交；提交本身没有移动，移动的是分支。
  - front: 快进有什么代价？怎样保留分支存在过的痕迹？
    back: 所有提交排成一条直线，从历史上看不出这条分支曾经存在过。用 `git merge --no-ff` 可以强制创建一个合并提交。
  - front: 「三方合并」的三方是哪三方？
    back: 共同祖先（用 `git merge-base` 能查到）、HEAD 这一边的现状和对方那一边的现状。Git 拿两边分别和祖先比较，得出两份改动清单，再把它们合起来。
  - front: 合并提交和普通提交在结构上有什么区别？
    back: 合并提交有两个父提交，第一个是合并之前的 HEAD，第二个是被合并进来的那条分支。被合并的那条分支本身不动。
  - front: 两边修改了同一个文件，一定会冲突吗？
    back: 不一定。Git 比较的是一块一块连续的改动区域，两处改动之间隔着至少一行没动过的内容，就能干净合并；紧挨在一起才会冲突。冲突块按区域整块交出来，所以没改动过的行也可能被卷进去。
  - front: 发生冲突时，索引里会发生什么？
    back: 这个文件在索引里占三个位置，编号 1、2、3 分别是共同祖先、HEAD 这一边和被合并进来的那一边，用 `git ls-files -u` 可以看到。这三个槽还在时，无法提交。
  - front: modify/delete 冲突有什么特别之处？
    back: 文件里没有冲突标记，内容就是 HEAD 那一边的原文。要决定的是这个文件留不留：保留就 `git add`，不保留就 `git rm`。所以看到 `CONFLICT` 时，不要直接去文件里找尖括号。
  - front: 解决冲突时 `git add` 的含义是什么？它会检查冲突标记有没有删干净吗？
    back: 它把索引里的三个槽合并成一个，声明「就按工作区现在的样子算」，并不检查内容。`git merge --continue` 也不检查。
  - front: 冲突解决后执行了 `git add`，为什么 `git diff --check` 查不出残留的冲突标记？
    back: 不加参数的 `git diff` 比较的是工作区和索引，`add` 之后两边已经一致了。提交之前要用 `git diff --cached --check`，检查即将被提交的内容。
  - front: 冲突出现以后，想放弃这次合并怎么办？
    back: 执行 `git merge --abort`，整个合并都会被丢掉，回到执行 merge 之前的状态。
  - front: 工作区有未提交的改动时 `git merge` 被拒绝，判断标准是什么？
    back: 和切换分支一样，看合并会不会覆盖还没提交的内容（`would be overwritten`）。Git 不在意手上有没有正在进行的工作，只是拒绝在自己操作的过程中把它冲掉。
  - front: '`git config merge.conflictStyle diff3` 有什么用？'
    back: 让冲突块里多显示一栏共同祖先的内容。对照着祖先，就能看出每一边各改了什么，从而判断应该怎样把两边合起来。
- post: Git-Chapter4-Diff
  cards:
  - front: '`diff --git a/config.txt b/config.txt` 里的 `a/` 和 `b/` 是什么？'
    back: 只是给比较的两份内容起的名字，前一份叫 a，后一份叫 b，磁盘上并没有叫 `a` 的目录。`---` 和 `+++` 两行是图例：以 `-` 开头的行只在 a 里有，以 `+` 开头的行只在 b 里有。
  - front: 块头 `@@ -14,5 +15,5 @@` 怎么读？
    back: 这一块在 a 里从第 14 行开始共 5 行，在 b 里从第 15 行开始共 5 行。两套起始行号不同，是因为前面插入了一行，后面的内容整体往后移了。
  - front: 为什么只插入了一行，一个块却占了 6 行和 7 行？
    back: 改动前后默认各带 3 行上下文，好让人看出改动落在什么位置，这个行数可以用 `-U` 调整。
  - front: diff 里怎样表示「修改了一行」？
    back: diff 里没有「修改」这个动作。旧行记作一行 `-`，新行记作一行 `+`，两者成对出现，`--stat` 也按这种方式统计。
  - front: '`index 2559e6f..43a5fe0 100644` 里的两个编号是提交号吗？'
    back: 不是，是两份文件内容（blob）的哈希值。右边那个往往是执行 `git diff` 时才现算出来的工作区文件哈希，仓库里并没有这个对象。Git 保存的是完整的快照，改动是比较出来的。`100644` 表示普通文件，`100755` 表示可执行文件。
  - front: '`git diff`、`git diff --staged`、`git diff HEAD` 分别比较哪两份内容？'
    back: '`git diff` 比较暂存区和工作区（还没 add 的改动）；`--staged`（同 `--cached`）比较 HEAD 和暂存区（下一次提交会进去的内容）；`git diff HEAD` 比较 HEAD 和工作区（自上次提交以来的全部改动）。'
  - front: '`git status -s` 输出的 `MM` 两列分别是什么意思？'
    back: 左列表示暂存区相对于 HEAD 有没有变化（也就是 `--staged` 有没有输出），右列表示工作区相对于暂存区有没有变化（也就是 `git diff` 有没有输出）。
  - front: 一个从来没有 `add` 过的新文件，`git diff HEAD` 能看到吗？
    back: 看不到。diff 只比较 Git 手里的快照，未跟踪的文件既不在暂存区，也不在任何提交里。`add` 之后才能看到；用 `git add -N` 只登记文件、不暂存内容，它就会出现在 `git diff` 里。
  - front: 文件名和分支名重名时，怎样让 `git diff` 只看那个文件？
    back: 用 `--` 隔开，左边写提交或分支，右边写文件。`git diff -- feature` 看的是名叫 feature 的文件，`git diff feature --` 是拿工作区和 feature 分支比较。
  - front: '`git diff master feature` 为什么会显示 feature 从来没做过的改动？'
    back: diff 只比较两个端点的快照，不关心中间的历史，所以 master 自己的改动在这里显示成了反方向的差异。调换两个分支的顺序，所有的 `-` 和 `+` 都会对调。
  - front: 想知道「feature 分出去以后自己改了什么」，应该怎么写？
    back: 写成 `git diff master...feature`（三个点），它用两条分支的共同祖先作为 a。两个点的 `master..feature` 和用空格隔开的写法一样，仍然是直接比较两个最新提交。
- post: Git-Chapter5-Stash
  cards:
  - front: 带着未提交的改动切换分支，会遇到哪两种不理想的结果？
    back: 要么被拦下（`would be overwritten`），哪里也去不了；要么被放行，改动跟着到了目标分支上，看到的是一个混着半截改动的版本。stash 的作用就是先把改动收起来，让工作区回到 HEAD，办完别的事再拿回来。
  - front: '`git stash` 收起来的东西存在哪里？'
    back: 存成一个提交，挂在 `.git/refs/stash` 上，不在任何分支上。它有两个父提交，一个是收起时 HEAD 所在的提交，另一个是 Git 为暂存区拍下的 `index on ...` 提交。
  - front: '`git stash` 默认会把未跟踪的新文件也收起来吗？'
    back: 不会，因为 Git 手里并没有它，它会留在工作区里，并跟着切换分支。加上 `-u` 才会一起收起（会多出第三个父提交），`-a` 连被忽略的文件也收。
  - front: 已经 `add` 过的改动，`stash` 之后再 `pop`，为什么变成了未暂存的状态？
    back: '`pop` 默认只还原工作区，不处理暂存区。要连暂存区一起还原，用 `git stash pop --index`。'
  - front: '`git stash pop` 和 `git stash apply` 有什么区别？'
    back: 两者都把收起的改动放回当前工作区，区别在于事后要不要删除那一份：`pop` 成功后删除，`apply` 保留。
  - front: 在 feature 上收起的改动，拿到 master 上 `apply`，会把 feature 的提交也带过来吗？
    back: 不会。取出来的只是收起那一刻相对于当时 HEAD 的那一段改动。Git 以当时的 HEAD 作为共同祖先做一次三方合并，所以也可能发生冲突。
  - front: '`git stash pop` 遇到冲突时，那一份会被删除吗？'
    back: 不会。它不知道冲突最终会怎样解决，所以留着以防万一。冲突解决之后，需要自己执行 `git stash drop`。
  - front: '`git stash branch <名字>` 做什么？'
    back: 从收起改动时的那个 HEAD 拉出一条新分支，在新分支上取出改动，成功之后再删除那一份。适合取出改动时冲突太多的情况。
  - front: 为什么要用 `git stash push -m "说明"`？`git stash save` 还能用吗？
    back: 同一条分支、同一个 HEAD 上收起的改动，默认说明都一样，过几天就分不清了。`save` 已经被标记为弃用，它把所有参数拼成说明，而 `push` 会把额外的参数当成文件路径。
  - front: '`stash@{0}` 是一个固定的编号吗？'
    back: 不是。它是 `refs/stash` 的 reflog 写法，表示往前数第 n 次的值，`stash@{0}` 永远是最新的一份。每收起或删除一次，编号都会变化，所以按编号操作之前，先执行 `git stash list` 看一眼。
  - front: '`git stash drop` 和 `git stash clear` 删掉的内容还能找回吗？'
    back: '`drop` 会打印被删那一份的提交号，提交本身还在对象库里，用 `git stash apply <提交号>` 能取回。`clear` 连提交号都不打印，基本找不回来。'
- post: Git-Chapter6-Undoing
  cards:
  - front: '`HEAD~1` 和 `HEAD~2` 分别表示什么？'
    back: '`HEAD~1`（也可以写成 `HEAD~`）是上一个提交，`HEAD~2` 是上一个提交的上一个提交。也可以直接写提交号。'
  - front: '`git checkout HEAD~2` 之后，`.git/HEAD` 和分支文件分别是什么样子？'
    back: '`HEAD` 里直接写着那个提交号，也就是分离 HEAD；分支文件一个字都没变，只是工作区和暂存区被更新成了那个版本。'
  - front: 分离 HEAD 时 `git log` 只显示了两个提交，后面的提交被删了吗？
    back: 没有。`git log` 默认从 HEAD 开始往回找，HEAD 停在旧提交上，自然找不到更新的提交。用 `git log --all` 从所有引用出发，它们就都在。
  - front: 在分离 HEAD 状态下做了提交，切回分支之后会怎样？
    back: 新提交只有 HEAD 记录着它，切回分支后，从任何一条分支出发都走不到它了。想保留它，就在切走之前（或者从 reflog 找回之后）给它建一个分支。
  - front: '`git switch 1d33476` 为什么会报错？'
    back: '`switch` 要求参数是分支名，给它提交号就拒绝执行，所以不会一不小心进入分离状态。而 `checkout` 会接受任何参数。'
  - front: 为什么 `HEAD` 必须写成大写？
    back: 在 Linux 上，`head~1` 会被当成文件路径而报错。在不区分大小写的 Windows、macOS 文件系统上，小写有时碰巧能用，换到 Linux 服务器上就不行了。
  - front: '`git restore 文件` 会把文件恢复成什么样子？'
    back: 用暂存区里的那一份覆盖工作区，也就是恢复成上一次 `add` 时的样子，而不是上一次提交时的样子。它的旧写法是 `git checkout -- 文件`。
  - front: '`git checkout -- 文件` 和 `git checkout HEAD 文件` 有什么区别？'
    back: 前者用暂存区覆盖工作区；后者用 HEAD 里的那一份同时覆盖暂存区和工作区，已经 `add` 过的改动也会被丢掉。
  - front: 怎样「撤销 add」？
    back: 执行 `git restore --staged 文件`，用 HEAD 里的那一份覆盖暂存区，工作区保持不变。`--staged` 前面的两个短横线不能省，否则 `staged` 会被当成文件名。
  - front: '`git restore --source HEAD~2 文件` 和 `git checkout HEAD~2` 有什么不同？'
    back: 前者只把那个文件的旧版本放进工作区，HEAD 和分支都不动，工作区里多了一处未提交的修改；后者让 HEAD 离开分支，整个工作区都换成那个旧版本。
  - front: 被 `restore` 覆盖掉的内容还能找回来吗？
    back: 如果被覆盖的改动从来没有 `add` 过，就找不回来了，因为 Git 手里从来没有过那一份。`restore` 执行完不打印任何信息，没有确认，也没有回收站。
  - front: '`git checkout <提交>` 和 `git reset <提交>` 移动的指针有什么不同？'
    back: '`checkout` 改写的是 `.git/HEAD`，让 HEAD 离开分支；`reset` 改写的是分支文件本身，HEAD 仍然记录着分支名，所以跟着分支一起回去。'
  - front: '`reset --soft`、`--mixed`、`--hard` 有什么区别？'
    back: 三者都把分支往回拨。`--soft` 不动暂存区和工作区，改动留在暂存区，再 commit 一次就把几个提交合成一个；`--mixed`（默认）让暂存区跟着回去，改动留在工作区；`--hard` 三层全部回去，文件内容也变回旧版本。
  - front: 被 `reset` 拨走的提交还在吗？拨错了怎么回来？
    back: 还在，只是没有分支指向它们了，`git reflog` 能找到。`reset` 会把原来的位置记在 `.git/ORIG_HEAD` 里，执行 `git reset --hard ORIG_HEAD` 就能拨回来。
  - front: '`reset --hard` 有什么东西是真的找不回来的？'
    back: 执行那一刻还没有提交的改动。即使用 `ORIG_HEAD` 拨回来，回来的也只是那些提交。所以执行 `--hard` 之前先 `git status` 看一眼，有未提交的内容就先 `stash`。
  - front: '`git revert 1d33476` 做了什么？它和「回到那个提交」有什么不同？'
    back: 它新建一个提交，把 `1d33476` 带来的改动反着做一遍（把 60 改回 30），其他内容不动。它撤销的是那一个提交的改动，而不是回到那个提交的时候。revert 同样用三方合并计算，所以也可能冲突。
  - front: 什么时候用 `reset`，什么时候用 `revert`？
    back: 看这些提交有没有离开过这台机器。只在本地的提交可以用 `reset` 改写历史；已经推送过的提交要用 `revert`，因为 reset 之后推送会被拒绝（`non-fast-forward`），强行推送又会让别人的历史和远程对不上。
- post: Git-Chapter7-GitHub
  cards:
  - front: '`git clone` 除了复制文件，还做了哪三件事？'
    back: 它复制的是整个仓库和全部历史。另外它还记下远程地址并取名为 origin；为远程的每一条分支在本地建一条 `origin/<分支>` 远程跟踪分支；按照远程的默认分支在本地建一条同名分支，并给它设置好上游。
  - front: clone 下来本地只有 master，怎样在远程的另一条分支（比如 test）上工作？
    back: 直接执行 `git switch test`。本地没有 test 时，switch 会按照 `origin/test` 新建一条同名分支，并让它和 `origin/test` 配成一对。
  - front: 为什么推送到 GitHub 之前，要先配置 SSH 密钥或者令牌？
    back: 推送需要证明自己对仓库有写权限，而 GitHub 已经不再接受用账号密码完成 Git 操作。使用 HTTPS 地址时，要在询问密码时输入个人访问令牌；使用 SSH 地址时，要把本机的公钥加到 GitHub 上，配置一次之后就不用再输入任何东西。
  - front: 配置 GitHub 的 SSH 密钥分哪三步？
    back: 先用 `ssh-keygen -t ed25519 -C "邮箱"` 生成密钥；再把 `~/.ssh/id_ed25519.pub` 那一行公钥粘贴到 GitHub 的 Settings 里的 SSH and GPG keys；最后用 `ssh -T git@github.com` 测试，看到 `Hi 用户名!` 就说明成功了。
  - front: '`id_ed25519` 和 `id_ed25519.pub`，哪一个交给 GitHub？'
    back: 带 `.pub` 的是公钥，交给 GitHub；不带后缀的是私钥，只能留在本机，不能交给任何人。
  - front: 第一次执行 `ssh -T git@github.com` 时，SSH 问 `Are you sure you want to continue connecting`，这是什么意思？
    back: SSH 第一次连接这台主机，在询问要不要相信它出示的指纹。和 GitHub 公布的指纹核对一致之后输入 yes，它会被记进 `~/.ssh/known_hosts`，以后就不会再问了。
  - front: '`git init` 之后，为什么常常要执行 `git branch -m main`？'
    back: git 2.34 新建仓库的第一条分支叫 master，而 GitHub 新建仓库的默认分支叫 main。先改名让两边一致，以后推送就不用考虑名字不同的问题。也可以执行一次 `git config --global init.defaultBranch main`，以后的新仓库直接叫 main。
  - front: '`git remote add origin <地址>` 做了什么？地址写错了会怎样？'
    back: 它只是在 `.git/config` 里写下 `[remote "origin"]` 一段，记下名字和地址，并不联网。所以地址写错了也会默默成功，要等到 push 时才报 `does not appear to be a git repository`。
  - front: 要把本地已有的提交推到新建的 GitHub 仓库，为什么建仓库时不能勾选添加 README？
    back: 勾选之后，远程一开始就有一个本地没有的提交，第一次推送会被拒绝（`rejected` 后面写着 `fetch first`），因为直接覆盖会丢掉那个提交。对于刚建好的仓库，最省事的办法是删掉它，重新建一个空仓库。
  - front: '`git push origin main` 里的 origin 和 main 分别是什么？'
    back: origin 是目的地，也就是记下的那个远程仓库；main 是本地的分支，决定推送哪些提交。Git 用本地的 main 去更新远程的同名分支，远程没有这条分支就新建一条。
  - front: 怎样证明 `git push origin <名字>` 里的名字指的是本地分支？
    back: 写一个本地没有的名字，会报 `src refspec nosuch does not match any`，其中 src 指的是本地这一边。即使远程已经有同名的分支，报错也完全一样。
  - front: '`origin/main` 是什么？它什么时候会变？'
    back: 它是远程跟踪分支，记的是上一次和远程仓库通信时，远程的 main 在哪里。它也是一个记录着提交号的文件，只在和远程通信（比如 push）的时候更新，不会跟着本地的提交移动。
  - front: '`git push origin cat:main` 做了什么？本地的 main 会变吗？'
    back: 它用本地的 cat 更新远程的 main，冒号左边是本地分支（src），右边是远程分支（dst）。本地的 main 不会移动，跟着更新的只有本地的 `origin/main`。
  - front: 什么是上游？`git push -u origin cat` 写下了什么？
    back: 上游是本地分支配对的那一条远程分支。`-u` 在 `.git/config` 里写下 `[branch "cat"]` 下面的 `remote = origin` 和 `merge = refs/heads/cat` 两行。之后不带参数的 `git push` 就能用了，`git status` 也会报告领先或落后了几个提交。
  - front: '`git status` 说 `Your branch is up to date`，就一定和远程一致吗？'
    back: 不一定。git status 不联网，它比较的只是本地记录的 `origin/<分支>`。如果别人在那之后推送了新的提交，本地的 origin/* 还没有更新，status 仍然会说一致。
  - front: '`git push -u origin cat:main` 之后，不带参数的 `git push` 为什么拒绝执行？'
    back: 因为上游（远程的 main）和本地分支（cat）的名字不同。默认的 push 行为出于安全会中止推送，并列出 `git push origin HEAD:main` 和 `git push origin HEAD` 两种写法让人自己选。
  - front: 本地分支落后于远程时，怎样只设置上游、不推送？
    back: 执行 `git branch -u origin/main`。这时不能用 `git push -u`，因为落后时推送会被拒绝，而 `-u` 只在推送成功时才生效。设置之后，`git status` 会显示落后了几个提交。
- post: Git-Chapter8-Fetch-Pull
  cards:
  - front: '`origin/main` 保存在哪里？它什么时候会移动？'
    back: 它是远程跟踪分支，保存在本地的 `.git` 里（clone 时写进 `.git/packed-refs`），并不在 GitHub 上。它记录的是上一次和远程通信时远程 main 的位置，只有 fetch、pull、push 这些和远程通信的命令才会移动它，本地提交不会移动它。
  - front: '`git branch`、`git branch -r`、`git branch -a` 分别列出什么？'
    back: '`git branch` 只列本地分支；`-r` 只列远程跟踪分支（`origin/...`）；`-a` 把两种都列出来。'
  - front: '`git switch origin/draft` 和 `git checkout origin/draft` 分别会怎样？'
    back: switch 只接受本地分支，会报 `a branch is expected, got remote branch 'origin/draft'`，退出码 128。checkout 会进入分离头指针状态，可以查看文件，但是新的提交不属于任何分支，origin/draft 也不会跟着移动。
  - front: 本地没有 draft 分支，为什么 `git switch draft` 不报错？
    back: 因为 switch 默认带着 `--guess` 选项。如果本地找不到这个分支，而恰好有一个远程仓库里有同名分支，那么它等同于 `git switch -c draft --track origin/draft`，照着 origin/draft 新建本地分支并设置上游。`git checkout draft` 的效果一样。
  - front: 合作者推送了新提交之后，为什么本地的 `git status` 仍然说 `up to date` 或者只领先？
    back: git status 不联网，它比较的是本地分支和本地的 `origin/<分支>`。合作者推送之后，本地的 origin/* 要等到下一次 fetch、pull 或 push 时才会更新，在那之前 status 的判断都是过时的。
  - front: '`git fetch` 改变了什么？没有改变什么？'
    back: 它把远程的新提交拿进本地仓库，移动对应的 `origin/*`，远程新出现的分支会新建一条 `origin/<分支>`。本地分支、暂存区和工作区都不变，所以任何时候执行 fetch 都是安全的。
  - front: 'fetch 输出里的 `8c565ad..7169997  main -> origin/main` 怎么读？'
    back: 箭头左边是远程仓库里的 main，右边是本地记录它的 origin/main，`8c565ad..7169997` 是 origin/main 移动前后的位置。如果是远程新出现的分支，这一行会写成 `* [new branch]`。
  - front: fetch 之后，怎样查看拿回来、还没有合并的提交？
    back: '`git log --oneline main..origin/main` 列出在 origin/main 上、不在 main 上的提交，`git show --stat origin/main` 看最新那个提交改了什么。想直接看文件，可以 `git checkout origin/main`，看完再 `git switch main`。'
  - front: '`git fetch origin review` 和不带参数的 `git fetch` 有什么区别？'
    back: 它只拿远程的 review 一条分支，输出里多一行 `* branch review -> FETCH_HEAD`，同时也会更新 origin/review。其他分支的新提交这一次不拿，对应的 origin/* 保持不变。
  - front: '`git pull` 和 `git fetch` 是什么关系？'
    back: pull 先用同样的参数执行一次 fetch，再根据配置调用 merge 或 rebase，把拿到的提交合并进当前分支。所以 pull 的输出前半段是 fetch 的 From 那几行，后半段是合并的输出。
  - front: 本地分支没有自己的新提交时，`git pull` 会怎样合并？
    back: 直接快进，输出是 `Updating 旧..新` 和 `Fast-forward`，和第三章的快进一样，不会生成合并提交，也不需要任何配置。
  - front: 在 git 2.34 上，两边都有新提交时执行 `git pull` 为什么报 `Need to specify how to reconcile divergent branches`？
    back: 分叉时 pull 要求先说明怎样合并。`git config pull.rebase false` 用合并（fetch + merge），`pull.rebase true` 用变基，`pull.ff only` 只允许快进；加 `--global` 对所有仓库生效。也可以在命令行上临时加 `--no-rebase`、`--rebase` 或 `--ff-only`。
  - front: pull 合并成功之后，为什么 `git status` 说领先了 2 个提交？
    back: 领先的是本地原来的提交和新生成的合并提交，它们都还没有推送。origin/main 停在合作者的那个提交上，要 push 之后才会跟过来；这时推送不会被拒绝，因为合并提交的父提交里已经有远程的那个提交。
  - front: '`git pull` 发生冲突之后，要做哪几步？'
    back: 打开文件解决冲突、删掉冲突标记，然后 `git add` 标记已解决，`git commit` 生成合并提交，最后别忘了 `git push`，因为合并提交只在本地。想放弃这次合并就执行 `git merge --abort`，fetch 拿到的提交仍然留在 origin/* 上。
  - front: pull 产生的冲突里，`>>>>>>>` 后面为什么是一串提交号而不是分支名？
    back: 因为 pull 合并的是 fetch 拿到的那个提交（记录在 FETCH_HEAD 里），而不是一条本地分支，所以标记上写的是它的提交号。
  - front: 不带参数的 `git pull` 怎么知道拉取哪一条分支？远程有同名分支就够了吗？
    back: 它读当前分支在 `.git/config` 里的上游配置（`remote` 和 `merge` 两行），不会按名字去找同名的远程分支。没有上游时会报 `There is no tracking information for the current branch`。可以用 `git branch -u origin/<分支>` 补上上游，或者写成 `git pull origin <分支>`。
  - front: '`git pull origin main` 会把远程的 main 合并到哪里？'
    back: 合并进当前所在的分支，而不一定是本地的 main。如果当时在别的分支上，远程 main 的提交就会被合并进那条分支，所以带参数 pull 之前先确认当前分支。`git branch -vv` 可以列出每条分支的上游。
- post: Git-Chapter9-README-Gist-Pages
  cards:
  - front: 公开仓库和私有仓库分别谁能看到？建好之后在哪里改可见性？
    back: 公开仓库所有人都能看到，不登录也能浏览和 clone；私有仓库只有拥有者和被邀请的合作者能看到。改可见性在仓库 Settings 的 General 页最下面，Danger Zone 里的 Change repository visibility，GitHub 会先列出后果，确认之后才生效。
  - front: 把仓库从公开改成私有，会发生什么？已经公开过的内容能收回来吗？
    back: star 和 watcher 会被清空；别人 fork 出去的副本仍然是公开的，只是和原仓库断开了联系；免费账号已经发布的 Pages 网站会被撤下。已经 fork 和 clone 出去的副本都收不回来，所以改回私有管不住已经公开过的内容。
  - front: 私有仓库里有一个写着令牌的文件，后来提交了一次把它删掉，现在改成公开安全吗？
    back: 不安全。公开的是包括全部历史的整个仓库，删除只是新提交里没有这个文件，旧提交仍然保存着它，任何人 clone 之后用 `git show HEAD~1:<文件>` 这类命令就能看到。公开前先用 `git log --all --stat` 检查历史；令牌进过历史就当作已经泄露，去发放的地方作废并重新生成。
  - front: 怎样把别人加为个人仓库的合作者？
    back: 打开仓库的 Settings，点击左侧栏 Access 一组里的 Collaborators（早些时候叫 Manage access），点 Add people，输入对方的用户名或邮箱并确认。对方会收到邀请邮件，接受之后才成为合作者。
  - front: 个人仓库的合作者能做什么？不能做什么？
    back: 合作者可以 pull 和 push，也就是读和写；邀请合作者、修改可见性、删除仓库这些和设置有关的操作只有拥有者能做。私有仓库不能给合作者只读权限，需要更细的分工要把仓库建在组织下面。移除合作者之后，对方已经 clone 到本地的仓库仍然留在对方手里。
  - front: README 是什么？GitHub 会在哪几个地方找它？
    back: README 是仓库的说明文件，一般是 README.md，GitHub 把它渲染出来显示在仓库首页的文件列表下面。GitHub 会在 `.github` 目录、根目录和 `docs` 目录里找，几个地方都有时按 `.github`、根目录、`docs` 的顺序，先找到哪个显示哪个。
  - front: 在 GitHub 网页上直接编辑了 README，本地接下来要注意什么？
    back: 网页上保存会在远程仓库里生成一个提交，本地还没有这个提交。所以下一次在本地推送之前，要先 pull（或 fetch 再合并）把它拿下来，否则 push 会因为 `fetch first` 被拒绝。
  - front: Markdown 里 `>`、一对反引号、`~~ ~~` 分别表示什么？
    back: '`>` 开头是引用块，左边有一条竖线，文字显示成灰色；一对反引号围起来的是行内代码，用等宽字体、浅灰色背景显示；`~~删除线~~` 是删除线，这是 GitHub 在标准 Markdown 之外加上的写法。'
  - front: 代码块开头的三个反引号后面写的名字有什么用？
    back: 那是语言的名字，GitHub 根据它决定怎样高亮，比如 bash、py、js、c。写一个不认识的名字，代码块照样显示，只是没有高亮。
  - front: '`#没有空格` 和 `! [logo](logo.png)` 在 GitHub 上会显示成什么？'
    back: 前者不是标题，`#` 后面必须有空格，否则原样显示这几个字符。后者不是图片，因为感叹号和方括号之间多了空格，结果是一个普通的感叹号加上一个叫 logo 的链接；图片要写成 `![logo](logo.png)`。
  - front: 在 README.md 里只按一次回车，两行会分开显示吗？怎样才能换行？
    back: 不会。两行被放进同一个 `<p>` 段落，换行符对浏览器来说就是空白，所以接在一起显示。空一行是开始新段落；只想换行就在行尾加两个空格或一个反斜杠，它们会变成 `<br>`。issue 和 pull request 的评论框不一样，每次回车都会显示成换行。
  - front: 为什么 `这是**加粗。**后面` 在 GitHub 上显示的是星号？
    back: 结尾的 `**` 前面是标点、后面紧跟汉字，按照 Markdown 的规则它不能当作粗体的结束标记，于是星号原样显示。把标点挪到外面，写成 `这是**加粗**。后面` 就正常了。
  - front: Gist 和 Git 仓库是什么关系？
    back: 每一个 Gist 都是一个 Git 仓库，可以 clone、fork，也可以在本地提交后 push 回自己的 Gist。在网页上每编辑一次就多一个提交（网页上没有填写提交信息的地方，所以提交信息是空的），Revisions 标签列出的就是这些提交。
  - front: secret Gist 是私有的吗？
    back: 不是。secret Gist 只是不出现在发现页、也搜不到，但任何人拿到网址就能看到内容。公开的 Gist 不能改成 secret，secret 可以改成公开。真正不能给人看的代码应该放进私有仓库。
  - front: 从分支发布 GitHub Pages 要选什么？入口文件是哪个？
    back: 在 Settings 的 Pages 页，Source 选 Deploy from a branch，再选一条分支和一个目录（只能是根目录 `/` 或 `/docs`）。之后每次推送到这条分支都会重新发布。Pages 在发布的目录里找 index.html、index.md 或 README.md 当入口文件。
  - front: 仓库里只有 README.md、没有任何 .html 文件，为什么也能发布成 Pages 网站？
    back: 因为从分支发布时 Pages 默认先用 Jekyll 构建一遍，Jekyll 会把 Markdown 转换成 HTML。不想让 Jekyll 处理就在发布目录里放一个空的 `.nojekyll` 文件；想用别的生成器，Source 可以改成 GitHub Actions。
  - front: 项目网站和用户网站的地址有什么区别？免费账号能从私有仓库发布 Pages 吗？
    back: 项目网站是 `https://<用户名>.github.io/<仓库名>/`，每个仓库一个；仓库名正好是 `<用户名>.github.io` 时发布的是用户网站 `https://<用户名>.github.io/`，每个账号一个。免费账号只能给公开仓库开 Pages；付费账号能从私有仓库发布，但网站本身仍然是公开的。
