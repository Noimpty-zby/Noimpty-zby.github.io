<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<title>Bind Event 节点的三根输入线</title>
<desc>白线来自 Event Construct 决定什么时候登记，蓝线是组件实例决定登记到谁的名单上，红线是自定义事件决定交上哪个函数；绑定完成的那一刻回调并不会执行。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect{stroke-width:.8}
.g{fill:#F1EFE8;stroke:#888780}
.tl{fill:#E1F5EE;stroke:#1D9E75}
.rd{fill:#FCEBEB;stroke:#E24B4A}
.bl{fill:#E6F1FB;stroke:#378ADD}
.am{fill:#FAEEDA;stroke:#EF9F27}
.lw{stroke:#3d3d3a;stroke-width:2.5;fill:none}
.lb{stroke:#378ADD;stroke-width:1.4;fill:none}
.lr{stroke:#E24B4A;stroke-width:1.4;fill:none}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DE}.ts{fill:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}
.tl{fill:#085041;stroke:#5DCAA5}
.rd{fill:#791F1F;stroke:#F09595}
.bl{fill:#0C447C;stroke:#85B7EB}
.am{fill:#633806;stroke:#EF9F27}
.lw{stroke:#E8E6DE}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="g" x="40" y="40" width="210" height="48" rx="8"/>
<text class="th" x="56" y="58" dominant-baseline="central">Event Construct</text>
<text class="ts" x="56" y="76" dominant-baseline="central">白线：什么时候登记</text>

<rect class="bl" x="40" y="110" width="210" height="48" rx="8"/>
<text class="th" x="56" y="128" dominant-baseline="central">Action System Component</text>
<text class="ts" x="56" y="146" dominant-baseline="central">蓝线：登记到谁的名单</text>

<rect class="rd" x="40" y="180" width="210" height="48" rx="8"/>
<text class="th" x="56" y="198" dominant-baseline="central">OnHealthChanged 事件</text>
<text class="ts" x="56" y="216" dominant-baseline="central">红线：交上哪个函数</text>

<path class="lw" d="M250 64 L294 118" marker-end="url(#a)"/>
<path class="lb" d="M250 134 L294 140" marker-end="url(#a)"/>
<path class="lr" d="M250 204 L294 162" marker-end="url(#a)"/>

<rect class="tl" x="300" y="110" width="290" height="64" rx="8"/>
<text class="th" x="445" y="134" text-anchor="middle" dominant-baseline="central">Bind Event to OnHealthChanged</text>
<text class="ts" x="445" y="154" text-anchor="middle" dominant-baseline="central">把回调登记进组件的订阅名单</text>

<rect class="am" x="300" y="250" width="290" height="56" rx="8"/>
<text class="th" x="445" y="270" text-anchor="middle" dominant-baseline="central">绑定 ≠ 调用</text>
<text class="ts" x="445" y="290" text-anchor="middle" dominant-baseline="central">此刻回调一次都没跑，等 Broadcast 才唤醒</text>
</svg>
