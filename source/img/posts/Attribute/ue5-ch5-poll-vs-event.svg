<svg xmlns="http://www.w3.org/2000/svg" width="680" height="325" viewBox="0 0 680 325" role="img">
<title>轮询与事件驱动的对比</title>
<desc>第二节的轮询方案由 Event Tick 每帧读取血量并写进度条，血量没变也照跑；第三节改为事件驱动，只有 ApplyHealthChange 真正改变血量并广播时才更新界面。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.lb{font-size:12px;font-weight:500;fill:#5F5E5A}
rect{stroke-width:.8}
.g{fill:#F1EFE8;stroke:#888780}
.c{fill:#FAECE7;stroke:#D85A30}
.tl{fill:#E1F5EE;stroke:#1D9E75}
.box{fill:none;stroke:#B4B2A9;stroke-width:.8;stroke-dasharray:5 4}
.ln{stroke:#888780;stroke-width:1.2;fill:none}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DE}.ts,.lb{fill:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}
.c{fill:#712B13;stroke:#F0997B}
.tl{fill:#085041;stroke:#5DCAA5}
.box{stroke:#5F5E5A}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="40" y="40" width="600" height="110" rx="12"/>
<text class="lb" x="58" y="60" dominant-baseline="central">第二节 · 轮询：每帧都跑，血量没变也跑</text>
<rect class="g" x="70" y="82" width="130" height="44" rx="8"/>
<text class="th" x="135" y="97" text-anchor="middle" dominant-baseline="central">Event Tick</text>
<text class="ts" x="135" y="114" text-anchor="middle" dominant-baseline="central">每一帧</text>
<rect class="g" x="235" y="82" width="170" height="44" rx="8"/>
<text class="th" x="320" y="97" text-anchor="middle" dominant-baseline="central">读组件血量</text>
<text class="ts" x="320" y="114" text-anchor="middle" dominant-baseline="central">Cast + 整条取值链</text>
<rect class="g" x="440" y="82" width="170" height="44" rx="8"/>
<text class="th" x="525" y="104" text-anchor="middle" dominant-baseline="central">Set Percent</text>
<path class="ln" d="M200 104 H229" marker-end="url(#a)"/>
<path class="ln" d="M405 104 H434" marker-end="url(#a)"/>

<rect class="box" x="40" y="175" width="600" height="110" rx="12"/>
<text class="lb" x="58" y="195" dominant-baseline="central">第三节 · 事件驱动：只在血量真正变化时跑</text>
<rect class="c" x="70" y="217" width="170" height="44" rx="8"/>
<text class="th" x="155" y="232" text-anchor="middle" dominant-baseline="central">ApplyHealthChange</text>
<text class="ts" x="155" y="249" text-anchor="middle" dominant-baseline="central">值真的变了</text>
<rect class="c" x="275" y="217" width="130" height="44" rx="8"/>
<text class="th" x="340" y="232" text-anchor="middle" dominant-baseline="central">Broadcast()</text>
<text class="ts" x="340" y="249" text-anchor="middle" dominant-baseline="central">通知监听者</text>
<rect class="tl" x="440" y="217" width="170" height="44" rx="8"/>
<text class="th" x="525" y="239" text-anchor="middle" dominant-baseline="central">Set Percent</text>
<path class="ln" d="M240 239 H269" marker-end="url(#a)"/>
<path class="ln" d="M405 239 H434" marker-end="url(#a)"/>
</svg>
