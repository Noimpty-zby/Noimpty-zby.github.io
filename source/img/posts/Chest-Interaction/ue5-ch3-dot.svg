<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" role="img" aria-label="点积挑选交互目标">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f1f1f}
.s{font-size:12px;fill:#5c5c5c}
.cap{font-size:12px;fill:#7d7d76}
rect.b,circle.b{stroke-width:1.5}
.teal{fill:#dff2ea;stroke:#149472}
.purple{fill:#e6e3f8;stroke:#6259c9}
.coral{fill:#fbe4dc;stroke:#d4593a}
.gray{fill:#eeeeec;stroke:#8a8a82}
.ln{stroke:#8a8a82;stroke-width:1.5;fill:none}
.lnteal{stroke:#149472;stroke-width:2;fill:none}
.lnpurple{stroke:#6259c9;stroke-width:2;fill:none}
.dash{stroke:#b4b4ae;stroke-width:1;fill:none;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){
.t{fill:#eaeae8}
.s{fill:#a8a8a2}
.cap{fill:#8f8f88}
.teal{fill:#0f2f26;stroke:#2bb98f}
.purple{fill:#1c1938;stroke:#8b83e8}
.coral{fill:#38180f;stroke:#e87a5c}
.gray{fill:#26261f;stroke:#9a9a92}
.ln{stroke:#9a9a92}
.lnteal{stroke:#2bb98f}
.lnpurple{stroke:#8b83e8}
.dash{stroke:#55554e}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle class="dash" cx="300" cy="230" r="150" fill="none"/>
<line class="lnteal" x1="300" y1="230" x2="365" y2="118"/>
<line class="ln" x1="300" y1="230" x2="440" y2="210"/>
<line class="ln" x1="300" y1="230" x2="200" y2="140"/>
<line class="ln" x1="300" y1="230" x2="240" y2="350"/>
<line class="lnpurple" x1="300" y1="230" x2="300" y2="88" marker-end="url(#a)"/>
<g class="teal"><circle class="b" cx="365" cy="118" r="9"/></g>
<g class="coral"><circle class="b" cx="440" cy="210" r="9"/></g>
<g class="coral"><circle class="b" cx="200" cy="140" r="9"/></g>
<g class="coral"><circle class="b" cx="240" cy="350" r="9"/></g>
<g class="gray"><circle class="b" cx="300" cy="230" r="7"/></g>
<text class="t" x="382" y="122">0.86</text>
<text class="s" x="456" y="214">0.14</text>
<text class="s" x="170" y="138" text-anchor="end">0.67</text>
<text class="s" x="222" y="356" text-anchor="end">-0.90</text>
<text class="s" x="312" y="252">玩家</text>
<text class="s" x="300" y="66" text-anchor="middle">视线方向（单位向量）</text>
<text class="s" x="140" y="234" text-anchor="end">重叠球体</text>
<text class="cap" x="300" y="412" text-anchor="middle">点积 = 两个单位向量夹角的余弦，绿色为得分最高者</text>
</svg>
