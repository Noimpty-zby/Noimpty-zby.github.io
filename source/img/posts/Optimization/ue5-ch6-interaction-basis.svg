<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 320" role="img" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif">
<title>交互评分的两个基准点</title>
<desc>俯视图：球体重叠与距离项以角色位置为基准，点积方向项以相机位置为基准，过肩视角下两点并不重合。</desc>
<style>
.bg{fill:#FAF9F5}
.tp{fill:#2C2C2A}
.tsec{fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#B4B2A9}
.boxt{fill:#2C2C2A}
.line{stroke:#888780}
.tl{stroke:#0F6E56}
.tlt{fill:#0F6E56}
.pu{stroke:#534AB7}
.put{fill:#534AB7}
.dot{fill:#5F5E5A}
@media (prefers-color-scheme: dark){
.bg{fill:#1F1E1C}
.tp{fill:#E8E6DF}
.tsec{fill:#B4B2A9}
.box{fill:#2C2C2A;stroke:#5F5E5A}
.boxt{fill:#E8E6DF}
.tl{stroke:#5DCAA5}
.tlt{fill:#5DCAA5}
.pu{stroke:#AFA9EC}
.put{fill:#AFA9EC}
.dot{fill:#B4B2A9}
}
</style>

<rect class="bg" x="0" y="0" width="680" height="320" rx="10"/>
<text class="tp" x="24" y="34" font-size="15" font-weight="500">交互评分的两个基准点（俯视）</text>

<circle cx="390" cy="180" r="90" fill="none" class="line" stroke-width="1" stroke-dasharray="5 5"/>
<text class="tsec" x="390" y="282" font-size="12" text-anchor="middle">InteractionRadius 球体重叠范围</text>

<circle class="dot" cx="390" cy="180" r="6"/>
<text class="tsec" x="390" y="204" font-size="12" text-anchor="middle">角色</text>

<rect class="box" x="140" y="162" width="70" height="30" rx="4" stroke-width="1"/>
<text class="boxt" x="175" y="182" font-size="12" text-anchor="middle">相机</text>

<rect class="box" x="400" y="92" width="92" height="34" rx="4" stroke-width="1"/>
<text class="boxt" x="446" y="114" font-size="12" text-anchor="middle">可交互物体</text>

<line class="tl" x1="390" y1="174" x2="434" y2="128" stroke-width="1.6"/>
<line class="pu" x1="212" y1="176" x2="398" y2="120" stroke-width="1.6"/>

<line class="tl" x1="60" y1="296" x2="90" y2="296" stroke-width="1.6"/>
<text class="tsec" x="98" y="300" font-size="12">距离项：以角色位置为基准</text>
<line class="pu" x1="330" y1="296" x2="360" y2="296" stroke-width="1.6"/>
<text class="tsec" x="368" y="300" font-size="12">方向项：以相机位置为基准</text>
</svg>
