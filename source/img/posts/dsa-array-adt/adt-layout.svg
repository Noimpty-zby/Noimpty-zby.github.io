eight="500" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="489.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="464" y="120" width="50" height="44" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="489.0" y="146.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><text x="543.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="518" y="120" width="50" height="44" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="543.0" y="146.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><text x="597.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><rect x="572" y="120" width="50" height="44" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="597.0" y="146.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><text x="651.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><rect x="626" y="120" width="50" height="44" rx="5" fill="#ffffff" stroke="#7b7280" stroke-width="1.1" stroke-opacity="0.6" stroke-dasharray="3 3"/><text x="651.0" y="146.68" font-size="13" fill="#7b7280" fill-opacity="0.55" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><text x="705.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><rect x="680" y="120" width="50" height="44" rx="5" fill="#ffffff" stroke="#7b7280" stroke-width="1.1" stroke-opacity="0.6" stroke-dasharray="3 3"/><text x="705.0" y="146.68" font-size="13" fill="#7b7280" fill-opacity="0.55" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">?</text><text x="759.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="734" y="120" width="50" height="44" rx="5" fill="#ffffff" stroke="#7b7280" stroke-width="1.1" stroke-opacity="0.6" stroke-dasharray="3 3"/><text x="759.0" y="146.68" font-size="13" fill="#7b7280" fill-opacity="0.55" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">?</text><text x="813.0" y="112" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">9</text><rect x="788" y="120" width="50" height="44" rx="5" fill="#ffffff" stroke="#7b7280" stroke-width="1.1" stroke-opacity="0.6" stroke-dasharray="3 3"/><text x="813.0" y="146.68" font-size="13" fill="#7b7280" fill-opacity="0.55" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">?</text><path d="M302,172 L302,178 L622,178 L622,172" fill="none" stroke="#4d7fc4" stroke-width="1.2"/><text x="462.0" y="196" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="600">有效：[0, length)</text><text x="462.0" y="213" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400">Display、Get、Set 只碰这一段</text><path d="M626,172 L626,178 L838,178 L838,172" fill="none" stroke="#7b7280" stroke-width="1.2"/><text x="732.0" y="196" font-size="12" fill="#7b7280" text-anchor="middle" font-weight="600">空着：[length, size)</text><text x="732.0" y="213" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400">6 号格里那个 12 是删除留下的旧值</text><line x1="651.0" y1="86" x2="651.0" y2=