-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">j = 5（走完了）</text><path d="M650.0,344 l-6,10 l12,0 z" fill="#2f2a33" stroke="#2f2a33" stroke-width="1"/><text x="650.0" y="368" font-size="11.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">k = 9</text><text x="470" y="110" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="600">第一个 while 刚退出时的样子：</text><text x="470" y="132" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">B 的 23 放进 C[8] 之后，j 走到了末尾，</text><text x="470" y="152" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">循环条件 i &lt; m &amp;&amp; j &lt; n 不再成立。</text><text x="470" y="180" font-size="11.5" fill="#c98a2b" text-anchor="start" font-weight="600">A 还剩一个 25 —— 它比 C 里所有的都大，</text><text x="470" y="200" font-size="11.5" fill="#c98a2b" text-anchor="start" font-weight="600">不用再比，直接接到 C 的末尾。</text><text x="470" y="228" font-size="11.5" fill="#ee5d7b" text-anchor="start" font-weight="400">少了收尾那两个 while，C 就只有 9 个。</text><text x="28" y="388" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">C 里每个数的颜色是它的出处。A、B 各 5 个，比较 9 次，O(m + n)。</text></svg>