<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="399" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">归并：三个指针，各走各的</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">每一步把 A[i]、B[j] 里小的那个放进 C[k] —— 一边先走完，另一边剩下的整段照抄</text><text x="28" y="122" font-size="14" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><text x="28" y="212" font-size="14" fill="#3f9e79" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><text x="28" y="326" font-size="14" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><rect x="140" y="96" width="48" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="164.0" y="120.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="194" y="96" width="48" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="218.0" y="120.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="248" y="96" width="48" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="272.0" y="120.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">16</text><rect x="302" y="96" width="48" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="326.0" y="120.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">20</text><rect x="356" y="96" width="48" height="40" rx="5" fill="#c98a2b" fill-opacity="0.16" stroke="#c98a2b" stroke-width="1.1"/><text x="380.0" y="120.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">25</text><rect x="140" y="186" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="164.0" y="210.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="194" y="186" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="218.0" y="210.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><rect x="248" y="186" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="272.0" y="210.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><rect x="302" y="186" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="326.0" y="210.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">22</text><rect x="356" y="186" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="380.0" y="210.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">23</text><rect x="410" y="186" width="48" height="40" rx="5" fill="#ffffff" stroke="#7b7280" stroke-width="1.1" stroke-opacity="0.6" stroke-dasharray="3 3"/><rect x="140" y="300" width="48" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="164.0" y="324.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><rect x="194" y="300" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="218.0" y="324.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="248" y="300" width="48" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="272.0" y="324.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="302" y="300" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="326.0" y="324.68" font-size="13" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><rect x="356" y="300" width="48" height="40" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f