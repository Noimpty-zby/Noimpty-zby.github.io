<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 516" width="880" height="516" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="515" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">编译器怎么找到 A[i]：一次乘法，一次加法</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">数组「随机访问 O(1)」这句话，全部的内容就是下面这一行公式</text><rect x="28" y="80" width="824" height="156" rx="8" fill="#eef3fb" stroke="#4d7fc4" stroke-width="1"/><rect x="56" y="128" width="76" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="94.0" y="148.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[0]</text><text x="94.0" y="178" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="138" y="128" width="76" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="176.0" y="148.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[1]</text><text x="176.0" y="178" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="220" y="128" width="76" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.26" stroke="#4d7fc4" stroke-width="1"/><text x="258.0" y="148.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">A[2]</text><text x="258.0" y="178" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="302" y="128" width="76" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="340.0" y="148.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[3]</text><text x="340.0" y="178" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><rect x="384" y="128" width="76" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="422.0" y="148.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[4]</text><text x="422.0" y="178" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">16</text><text x="46" y="178" font-size="9.5" fill="#7b7280" text-anchor="end" font-weight="400">偏移</text><line x1="56" y1="190" x2="56" y2="202" stroke="#4d7fc4" stroke-width="1.2"/><text x="56" y="216" font-size="10.5" fill="#4d7fc4" text-anchor="start" font-weight="400">L₀ 首地址</text><line x1="56" y1="114" x2="220" y2="114" stroke="#ee5d7b" stroke-width="1.4" marker-end="url(#arp)"/><text x="138.0" y="106" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400">i × w = 2 × 4 = 8 字节</text><text x="500" y="122" font-size="15" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Addr(A[i]) = L₀ + i × w</text><text x="500" y="148" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">L₀ 首地址　i 下标　w 一个元素占几个字节</text><text x="500" y="176" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">乘一次、加一次就到了，和 i 多大、数组多长都无关 ——</text><text x="500" y="196" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">这就是「随机访问 O(1)」的全部内容，不是因为数组「本来就快」。</text><rect x="28" y="252" width="396" height="152" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="274" font-size="12.5" fill="#3f9e79" text-anchor="start" font-weight="700">下标从 0 开始</text><text x="44" y="302" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Addr = L₀ + i × w</text><text x="44" y="326" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">gcc -O2 编出来的取数指令：</text><rect x="44" y="334" width="364" height="26" rx="4" fill="#3f9e79" fill-opacity="0.07" stroke="#3f9e79" stroke-width="1"/><text x="54" y="351" font-size="10.5" fill="#3f9e79" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">mov eax, DWORD PTR [rdi+rsi*4]</text><text x="44" y="378" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">下标就是偏移，公式里没有多余的项。</text><rect x="456" y="252" width="396" height="152" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="472" y="274" font-size="12.5" fill="#c98a2b" text-anchor="start" font-weight="700">下标从 1 开始</text><text x="472" y="302" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Addr = L₀ + (i − 1) × w</text><text x="472" y="326" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">gcc -O2 编出来的取数指令：</text><rect x="472" y="334" width="364" height="26" rx="4" fill="#c98a2b" fill-opacity="0.07" stroke="#c98a2b" stroke-width="1"/><text x="482" y="351" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">mov eax, DWORD PTR -4[rdi+rsi*4]</text><text x="472" y="378" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">同一条指令，只是多带了个 −4 的位移 —— x86 的寻址方式</text><text x="472" y="394" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">本来就有这个字段，所以「减一」在这里是白送的。</text><line x1="424" y1="320" x2="452" y2="320" stroke="#7b7280" stroke-width="1.3" marker-end="url(#ar)"/><text x="438" y="312" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400">vs</text><rect x="28" y="420" width="824" height="62" rx="8" fill="#fdeef1" stroke="#ee5d7b" stroke-width="1"/><text x="44" y="442" font-size="12" fill="#ee5d7b" text-anchor="start" font-weight="700">公式只会算，不会拦：i = 5 也照算不误</text><text x="44" y="464" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">紧挨着放两个数组 A[5]、B[5]，A[5] 读出来正是 B[0]，写 A[5] = −1 之后 B[0] 变成了 −1 —— gcc 开 -Wall -Wextra 一句警告都没有。</text><text x="28" y="496" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">下界是运行期才知道的变量时，才会真多出一条 sub 指令 —— 那时候「从 0 开始」才省下了东西。</text></svg>