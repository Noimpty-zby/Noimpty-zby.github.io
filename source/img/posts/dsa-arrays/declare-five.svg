-opacity="0.1" stroke="#c98a2b" stroke-width="1"/><text x="587.0" y="407.14" font-size="11.5" fill="#c98a2b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="624" y="388" width="58" height="30" rx="4" fill="#c98a2b" fill-opacity="0.1" stroke="#c98a2b" stroke-width="1"/><text x="653.0" y="407.14" font-size="11.5" fill="#c98a2b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><text x="704" y="402" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">容量由列表长度定</text><text x="704" y="418" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">—— 这里是 5</text><text x="28" y="464" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">第一行的 111…555 不是随便编的：让另一个函数先在同一块栈空间上写下这五个数，再进这个函数读未初始化的数组，读回来的就是它们。</text></svg>