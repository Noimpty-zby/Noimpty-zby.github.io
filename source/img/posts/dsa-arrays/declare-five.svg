<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 484" width="880" height="484" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="483" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">五种声明写法，在内存里分别是什么样子</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">容量和初值是两件事 —— 只要写了初始化列表，没写到的位置一律补 0</text><text x="44" y="96" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="700">写法</text><text x="360" y="96" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="700">这 5 个格子里的值</text><text x="704" y="96" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="700">说明</text><text x="44" y="134" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">int A[5];</text><rect x="360" y="116" width="58" height="30" rx="4" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="389.0" y="135.14" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">111</text><text x="389" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[0]</text><rect x="426" y="116" width="58" height="30" rx="4" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="455.0" y="135.14" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">222</text><text x="455" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[1]</text><rect x="492" y="116" width="58" height="30" rx="4" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="521.0" y="135.14" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">333</text><text x="521" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[2]</text><rect x="558" y="116" width="58" height="30" rx="4" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="587.0" y="135.14" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">444</text><text x="587" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[3]</text><rect x="624" y="116" width="58" height="30" rx="4" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1" stroke-dasharray="3 3"/><text x="653.0" y="135.14" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">555</text><text x="653" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[4]</text><text x="704" y="130" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">上一个函数在这块</text><text x="704" y="146" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">栈空间留下的值</text><line x1="28" y1="170" x2="852" y2="170" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="202" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">int A[5] = {2,4,6,8,10};</text><rect x="360" y="184" width="58" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="389.0" y="203.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,m