nospace,Menlo,Consolas,monospace">4</text><rect x="492" y="252" width="58" height="30" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1"/><text x="521.0" y="271.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="558" y="252" width="58" height="30" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1"/><text x="587.0" y="271.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="624" y="252" width="58" height="30" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1"/><text x="653.0" y="271.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><text x="704" y="266" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">写到的照抄，没写到</text><text x="704" y="282" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">的补 0 —— 不是垃圾值</text><line x1="28" y1="306" x2="852" y2="306" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="338" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">int A[5] = {0};</text><rect x="360" y="320" width="58" height="30" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1"/><text x="389.0" y="339.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="426" y="320" width="58" height="30" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1"/><text x="455.0" y="339.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="492" y="320" width="58" height="30" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79"