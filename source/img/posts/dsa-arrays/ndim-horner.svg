="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="306.0" y="179.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,1,1</text><rect x="326" y="164" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="344.0" y="179.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,1,2</text><rect x="364" y="164" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="382.0" y="179.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,1,3</text><rect x="250" y="192" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="268.0" y="207.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,2,0</text><rect x="288" y="192" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="306.0" y="207.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,2,1</text><rect x="326" y="192" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="344.0" y="207.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,2,2</text><rect x="364" y="192" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="382.0" y="207.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,2,3</text><text x="440" y="132" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Addr(A[i][j][k]) = L₀ + ((i × 3 + j) × 4 + k) × w</text><text x="440" y="158" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[1][2][3] → ((1×3+2)×4+3) × 4 = 92</text><text x="440" y="180" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">实测：24 个元素的真实偏移与公式逐个核对，全部一致。</text><text x="440" y="200" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">把维数加到 n，公式就是一层套一层地往里嵌。</text><rect x="28" y="244" width="824" height="124" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="266" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">同一个地址，两种写法</text><rect x="44" y="278" width="640" height="36" rx="5" fill="#ee5d7b" fill-opacity="0.05" stroke="#ee5d7b" stroke-width="1"/><text x="56" y="294" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">朴素展开   L₀ + (i₁·d₂·d₃⋯dₙ + i₂·d₃⋯dₙ + ⋯ + iₙ₋₁·dₙ + iₙ) × w</text><text x="56" y="308" font-size="9.5" fill="#7b7280" text-anchor="start" font-weight="400">每一项都要把它后面所有的维度再乘一遍</text><text x="700" y="296" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700">n(n−1)/2 + 1 次乘法</text><text x="700" y="312" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">O(n²)</text><rect x="44" y="322" width="640" height="36" rx="5" fill="#3f9e79" fill-opacity="0.05" stroke="#3f9e79" stroke-width="1"/><text x="56" y="338" font-size="11" fill="#3f9e79" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">提公因式   L₀ + ( ⋯ ((i₁·d₂ + i₂)·d₃ + i₃)·d₄ ⋯ ·dₙ + iₙ ) × w</text><text x="56" y="352" font-size="9.5" fill="#7b7280" text-anchor="start" font-weight="400">算过的部分接着用，每多一维只多一次乘法</text><text x="700" y="340" font-size="11" fill="#3f9e79" text-anchor="start" font-weight="700">n 次乘法</text><text x="700" y="356" font-size="11" fill="#3f9e79" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">O(n)</text><rect x="28" y="384" width="824" height="104" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="406" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700">实测乘法次数（两种写法算出来的地址完全一致）</text><rect x="120" y="464.8695652173913" width="20" height="1.1304347826086956" rx="2" fill="#ee5d7b" fill-opacity="0.55"/><rect x="144" y="464.8695652173913" width="20" height="1.1304347826086956" rx="2" fill="#3f9e79" fill-opacity="0.55"/><text x="130" y="460.8695652173913" font-size="8.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="154" y="460.8695652173913" font-size="8.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="142" y="480" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><rect x="186" y="463.7391304347826" width="20" height="2.260869565217391" rx="2" fill="#ee5d7b" fill-opacity="0.55"/><rect x="210" y="463.7391304347826" width="20" height="2.260869565217391" rx="2" fill="#3f9e79" fill-opacity="0.55"/><text x="196" y="459.7391304347826" font-size="8.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="220" y="459.7391304347826" font-size="8.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="208" y="480" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="252" y="461.4782608695652" width="20" height="4.521739130434782" rx="2" fill="#ee5d7b" fill-opacity="0.55"/><rect x="276" y="462.60869565217394"