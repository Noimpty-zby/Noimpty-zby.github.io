<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="880" height="512" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="511" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">推广到 n 维：把公式提一提，乘法次数从 O(n²) 降到 O(n)</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">这一步和上一章泰勒展开那道题是同一个招式 —— 提公因式</text><rect x="28" y="80" width="824" height="148" rx="8" fill="#eef3fb" stroke="#4d7fc4" stroke-width="1"/><text x="44" y="102" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700">先看三维　int A[2][3][4];　—— 就是「2 个 3×4 的表」，仍然一口气排在一条直线上</text><text x="60" y="128" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">第 0 块</text><rect x="60" y="136" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1"/><text x="78.0" y="151.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,0,0</text><rect x="98" y="136" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1"/><text x="116.0" y="151.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,0,1</text><rect x="136" y="136" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1"/><text x="154.0" y="151.42" font-size="9.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,0,2</text><rect x="174" y="136" width="36" height="24" rx="4" fill="#4d7fc4" fill-opacity="0.08" stroke="#4