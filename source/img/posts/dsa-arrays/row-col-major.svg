 fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="346" y="116" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="367.0" y="134.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,1</text><text x="367.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="392" y="116" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="413.0" y="134.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,2</text><text x="413.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="438" y="116" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="459.0" y="134.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,3</text><text x="459.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><rect x="484" y="116" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="505.0" y="134.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,0</text><text x="505.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">16</text><rect x="530" y="116" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="551.0" y="134.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,1</text><text x="551.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">20</text><rect x="576" y="116" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="597.0" y="134.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,2</text><text x="597.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">24</text><rect x="622" y="116" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="643.0" y="134.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,3</text><text x="643.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">28</text><rect x="668" y="116" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="689.0" y="134.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,0</text><text x="689.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">32</text><rect x="714" y="116" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="735.0" y="134.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,1</text><text x="735.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">36</text><rect x="760" y="116" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="781.0" y="134.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,2</text><text x="781.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">40</text><rect x="806" y="116" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="827.0" y="134.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,3</text><text x="827.0" y="160" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">44</text><text x="300" y="184" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Addr(A[i][j]) = L₀ + (i × n + j) × w</text><text x="300" y="204" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">n = 列数 = 4。A[2][1] → (2×4+1)×4 = 36，实测偏移正是 36。</text><text x="300" y="232" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700">列主序（column major）—— Fortran / MATLAB 用的是这种</text><rect x="300" y="240" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="321.0" y="258.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,0</text><text x="321.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="346" y="240" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="367.0" y="258.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,0</text><text x="367.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><rect x="392" y="240" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="413.0" y="258.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,0</text><text x="413.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><rect x="438" y="240" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="459.0" y="258.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,1</text><text x="459.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">12</text><rect x="484" y="240" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="505.0" y="258.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,1</text><text x="505.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">16</text><rect x="530" y="240" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="551.0" y="258.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,1</text><text x="551.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">20</text><rect x="576" y="240" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="597.0" y="258.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,2</text><text x="597.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">24</text><rect x="622" y="240" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="643.0" y="258.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,2</text><text x="643.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">28</text><rect x="668" y="240" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="689.0" y="258.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,2</text><text x="689.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">32</text><rect x="714" y="240" width="42" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="735.0" y="258.78" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,3</text><text x="735.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">36</text><rect x="760" y="240" width="42" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1"/><text x="781.0" y="258.78" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1,3</text><text x="781.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">40</text><rect x="806" y="240" width="42" height="30" rx="4" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1"/><text x="827.0" y="258.78" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">2,3</text><text x="827.0" y="284" font-size="9" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">44</text><text x="290" y="284" font-size="9" fill="#7b7280" text-anchor="end" font-weight="400">偏移</text><text x="300" y="308" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">Addr(A[i][j]) = L₀ + (j × m + i) × w</text><text x="300" y="328" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">m = 行数 = 3。同一个 A[2][1] → (1×3+2)×4 = 20。</text><rect x="28" y="356" width="824" height="96" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="378" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700">为什么说「两种一样快」：把两条公式分别编出来，指令形状一模一样</text><rect x="44" y="390" width="390" height="48" rx="5" fill="#4d7fc4" fill-opacity="0.05" stroke="#4d7fc4" stroke-width="1"/><text x="56" y="408" font-size="10.5" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">row_major:  imul esi, ecx</text><text x="56" y="426" font-size="10.5" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">            add esi, edx  →  mov eax, [rdi+rsi*4]</text><rect x="452" y="390" width="390" height="48" rx="5" fill="#c98a2b" fill-opacity="0.05" stroke="#c98a2b" stroke-width="1"/><text x="464" y="408" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">col_major:  imul edx, ecx</text><text x="464" y="426" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">            add edx, esi  →  mov eax, [rdi+rdx*4]</text><text x="28" y="476" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">都是一次乘、一次加、一次取数。所以选哪种是设计者的自由 —— 代价相同，真正有差别的是「按什么顺序遍历」，那是下一张图的事。</text></svg>