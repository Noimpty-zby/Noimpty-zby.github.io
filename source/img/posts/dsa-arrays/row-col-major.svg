<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" width="880" height="496" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="495" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">同一张表，两种铺法 —— 而且两种一样快</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">二维只是画给人看的；内存里永远是一条直线，区别只在「按行铺」还是「按列铺」</text><text x="44" y="96" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="700">逻辑上　int A[3][4]</text><text x="62" y="137" font-size="10" fill="#7b7280" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><rect x="72" y="116" width="50" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="97.0" y="135.96" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,0</text><rect x="126" y="116" width="50" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="151.0" y="135.96" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,1</text><rect x="180" y="116" width="50" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="205.0" y="135.96" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,2</text><rect x="234" y="116" width="50" height="32" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><text x="259.0" y="135.96" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0,3</text><text x="62" y="173" font-size="10" fill="#7b7280" text-anchor="end" font-weight="400" font-family="ui-mo