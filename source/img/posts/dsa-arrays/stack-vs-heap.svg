<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" height="468" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="467" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">数组住在哪，谁负责收尸</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">「静态 / 动态」说的不是值能不能改，是容量定下来之后还能不能换一块</text><rect x="28" y="82" width="396" height="196" rx="8" fill="#eef3fb" stroke="#4d7fc4" stroke-width="1"/><text x="44" y="104" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">栈上　int A[5];</text><text x="408" y="104" font-size="12" fill="#4d7fc4" text-anchor="end" font-weight="700">静态</text><rect x="48" y="118" width="52" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="74.0" y="137.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="74" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[0]</text><rect x="108" y="118" width="52" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="134.0" y="137.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="134" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[1]</text><rect x="168" y="118" width="52" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="194.0" y="137.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="194" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[2]</text><rect x="228" y="118" width="52" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="254.0" y="137.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="254" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[3]</text><rect x="288" y="118" width="52" height="30" rx="4" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="314.0" y="137.14" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="314" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[4]</text><text x="44" y="190" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">sizeof(A) = 20 —— 长度是类型的一部分</text><text x="44" y="214" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">· 进作用域时整块划出来，出作用域自动收回</text><text x="44" y="234" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">· 谁都不用写 free，也没法中途换一块更大的</text><text x="44" y="254" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">· 想扩容？只有一条路：另开一块，把值搬过去</text><rect x="456" y="82" width="396" height="196" rx="8" fill="#fdeef1" stroke="#ee5d7b" stroke-width="1"/><text x="472" y="104" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">堆上　int *p = new int[5];</text><text x="836" y="104" font-size="12" fill="#ee5d7b" text-anchor="end" font-weight="700">动态</text><rect x="472" y="118" width="64" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.22" stroke="#ee5d7b" stroke-width="1"/><text x="504.0" y="137.14" font-size="11.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">p</text><text x="504" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400">栈上</text><line x1="540" y1="133" x2="566" y2="133" stroke="#ee5d7b" stroke-width="1.5" marker-end="url(#arp)"/><rect x="572" y="118" width="44" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.12" stroke="#ee5d7b" stroke-width="1"/><text x="594.0" y="137.14" font-size="11.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="624" y="118" width="44" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.12" stroke="#ee5d7b" stroke-width="1"/><text x="646.0" y="137.14" font-size="11.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="676" y="118" width="44" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.12" stroke="#ee5d7b" stroke-width="1"/><text x="698.0" y="137.14" font-size="11.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="728" y="118" width="44" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.12" stroke="#ee5d7b" stroke-width="1"/><text x="750.0" y="137.14" font-size="11.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="780" y="118" width="44" height="30" rx="4" fill="#ee5d7b" fill-opacity="0.12" stroke="#ee5d7b" stroke-width="1"/><text x="802.0" y="137.14" font-size="11.5" fill="#ee5d7b" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="702" y="162" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400">堆上</text><text x="472" y="190" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">sizeof(p) = 8 —— 它只是个指针，数不出长度</text><text x="472" y="214" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">· 长度可以是运行期才知道的变量</text><text x="472" y="234" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">· 必须自己 delete[] / free，否则就是泄漏</text><text x="472" y="254" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">· 能换一块更大的，然后让 p 指过去 —— 这就是扩容</text><rect x="28" y="296" width="824" height="128" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="318" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">那 int n; cin &gt;&gt; n; int A[n]; 到底合不合法？—— 让编译器自己回答</text><text x="44" y="342" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">gcc -std=c99 -pedantic-errors</text><text x="300" y="342" font-size="10.5" fill="#3f9e79" text-anchor="start" font-weight="700">通过</text><text x="340" y="342" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">C99 起变长数组（VLA）进了 C 标准</text><text x="44" y="362" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">gcc -std=c89 -pedantic-errors</text><text x="300" y="362" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="700">报错</text><text x="340" y="362" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">ISO C90 forbids variable length array</text><text x="44" y="382" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">g++ -std=c++17 -pedantic-errors</text><text x="300" y="382" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="700">报错</text><text x="340" y="382" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">ISO C++ forbids variable length array</text><text x="44" y="402" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">g++ -std=c++17（不加 -pedantic）</text><text x="300" y="402" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="700">通过</text><text x="340" y="402" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">这是 GNU 扩展，不是 C++ 标准给的</text><text x="28" y="448" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">所以「C 只能定长、C++ 才能变长」正好说反了：变长数组是 C 的东西，C++ 标准里没有，g++ 肯收只是因为它默认开着扩展。</text></svg>