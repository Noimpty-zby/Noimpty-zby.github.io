14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="756" y="320" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="768.0" y="337.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="782" y="320" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="794.0" y="337.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="808" y="320" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="820.0" y="337.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="638" y="354" width="48" height="26" rx="4" fill="#3f9e79" fill-opacity="0.18" stroke="#3f9e79" stroke-width="1"/><text x="662.0" y="370.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[2]</text><line x1="690" y1="367" x2="715" y2="367" stroke="#3f9e79" stroke-width="1.3" marker-end="url(#arg)"/><rect x="723" y="354" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="735.0" y="371.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="749" y="354" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="761.0" y="371.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="775" y="354" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="787.0" y="371.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><rect x="801" y="354" width="24" height="26" rx="4" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="813.0" y="371.14" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace"></text><text x="662" y="406" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400">指针数组</text><text x="774" y="406" font-size="9.5" fill="#7b7280" text-anchor="middle" font-weight="400">三段各自 new，地址互不相干</text><text x="44" y="458" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">实测：B[0] 和 B[1] 之间差 32 字节，不是一行该有的 16 字节 —— 多出来的是堆的块头和对齐。所以后两种写法不能当成一维扫。</text><text x="44" y="480" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">代价也不同：方法一算一次「乘 + 加」就到了元素；方法二、三要先读出行指针，再读元素 —— 两次内存访问，而且两次落在完全无关的地方。</text><text x="28" y="510" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">sizeof 也照实说话：48 是真的一整块，24 是三个指针，8 是一个指针。</text></svg>