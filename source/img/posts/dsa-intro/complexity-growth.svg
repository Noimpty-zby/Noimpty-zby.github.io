las,monospace">1 000</text><text x="28" y="476" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">O(n²)</text><text x="150" y="476" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">100</text><text x="260" y="476" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">10 000</text><text x="380" y="476" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1 000 000</text><text x="520" y="432" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">低阶项和常数在这个尺度上早就看不见了 ——</text><text x="520" y="450" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">所以只留最高阶，系数也一起扔掉。</text></svg>