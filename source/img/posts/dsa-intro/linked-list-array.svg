9" y="232" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">H[2]</text><rect x="176" y="208" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="220" y1="208" x2="220" y2="244" stroke="#3f9e79" stroke-width="1"/><text x="198" y="231" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="140" y1="226" x2="172" y2="226" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="268" y="208" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="312" y1="208" x2="312" y2="244" stroke="#3f9e79" stroke-width="1"/><text x="290" y="231" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="220" y1="226" x2="264" y2="226" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="360" y="208" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="404" y1="208" x2="404" y2="244" stroke="#3f9e79" stroke-width="1"/><text x="382" y="231" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="312" y1="226" x2="356" y2="226" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="452" y="208" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="496" y1="208" x2="496" y2="244" stroke="#3f9e79" stroke-width="1"/><text x="474" y="231" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="404" y1="226" x2="448" y2="226" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><text x="526" y="231" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">∅</text><text x="554" y="231" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">4 个</text><rect x="62" y="266" width="74" height="44" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="99" y="294" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">H[3]</text><rect x="176" y="270" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="220" y1="270" x2="220" y2="306" stroke="#3f9e79" stroke-width="1"/><text x="198" y="293" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="140" y1="288" x2="172" y2="288" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><text x="250" y="293" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">∅</text><text x="278" y="293" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">1 个</text><rect x="596" y="78" width="254" height="154" rx="10" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="614" y="104" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">外层：m 个头指针</text><text x="614" y="124" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">→ 走 m 次</text><text x="614" y="152" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="700">内层：所有节点加起来</text><text x="614" y="172" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">→ 一共走 n 次</text><line x1="614" y1="190" x2="832" y2="190" stroke="#ded9e3" stroke-width="1"/><text x="614" y="214" font-size="15" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">合计 O(m + n)</text><text x="62" y="346" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">m 和 n 是两个互相独立的量：</text><text x="258" y="346" font-size="13" fill="#2f2a33" text-anchor="start" 