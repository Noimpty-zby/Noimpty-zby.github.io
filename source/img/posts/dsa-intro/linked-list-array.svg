<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="371" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">m 条链表、一共 n 个节点，全部走一遍是 O(m + n)</text><rect x="62" y="80" width="74" height="44" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="99" y="108" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">H[0]</text><rect x="176" y="84" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="220" y1="84" x2="220" y2="120" stroke="#3f9e79" stroke-width="1"/><text x="198" y="107" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="140" y1="102" x2="172" y2="102" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="268" y="84" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="312" y1="84" x2="312" y2="120" stroke="#3f9e79" stroke-width="1"/><text x="290" y="107" font-size="13" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">•</text><line x1="220" y1="102" x2="264" y2="102" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="360" y="84" width="62" height="36" rx="4" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><line x1="404" y1="84" x2="404" y2="120" stroke="#3f9e7