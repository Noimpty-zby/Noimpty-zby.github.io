<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 442" width="880" height="442" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="441" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">逻辑结构说「数据之间是什么关系」，物理结构说「实际怎么放」</text><text x="28" y="84" font-size="12" fill="#7b7280" text-anchor="start" font-weight="600">逻辑结构</text><rect x="60" y="94" width="240" height="76" rx="10" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="74" y="112" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">线性</text><rect x="79.0" y="122" width="92" height="34" rx="17" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="125.0" y="144" font-size="14" fill="#ee5d7b" text-anchor="middle" font-weight="600">栈</text><rect x="189.0" y="122" width="92" height="34" rx="17" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="235.0" y="144" font-size="14" fill="#ee5d7b" text-anchor="middle" font-weight="600">队列</text><rect x="320" y="94" width="240" height="76" rx="10" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="334" y="112" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">非线性</text><rect x="339.0" y="122" width="92" height="34" rx="17" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="385.0" y="144" font-size="14" fill="#ee5d7b" text-anchor="middle" font-weight="600">树</text><rect x="449.0" y="122" width="92" height="34" rx="17" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="495.0" y="144" font-size="14" fill="#ee5d7b" text-anchor="middle" font-weight="600">图</text><rect x="580" y="94" width="240" height="76" rx="10" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="594" y="112" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">表格</text><rect x="654.0" y="122" width="92" height="34" rx="17" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="700.0" y="144" font-size="14" fill="#ee5d7b" text-anchor="middle" font-weight="600">哈希表</text><line x1="180.0" y1="170" x2="180.0" y2="196" stroke="#ded9e3" stroke-width="1.2"/><line x1="440.0" y1="170" x2="440.0" y2="196" stroke="#ded9e3" stroke-width="1.2"/><line x1="700.0" y1="170" x2="700.0" y2="196" stroke="#ded9e3" stroke-width="1.2"/><line x1="180" y1="196" x2="700" y2="196" stroke="#ded9e3" stroke-width="1.2"/><text x="440" y="190" font-size="12" fill="#7b7280" text-anchor="middle" font-weight="400">落地时只能选下面这两种排布（或者两者的组合）</text><line x1="250" y1="196" x2="250" y2="224" stroke="#7b7280" stroke-width="1.2" marker-end="url(#ar)"/><line x1="630" y1="196" x2="630" y2="224" stroke="#7b7280" stroke-width="1.2" marker-end="url(#ar)"/><text x="28" y="250" font-size="12" fill="#7b7280" text-anchor="start" font-weight="600">物理结构</text><rect x="90" y="232" width="330" height="132" rx="10" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="110" y="258" font-size="14" fill="#4d7fc4" text-anchor="start" font-weight="700">数组 —— 连续的一整块</text><rect x="110" y="274" width="40" height="34" rx="4" fill="#ffffff" stroke="#4d7fc4" stroke-width="1"/><text x="130" y="296" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[0]</text><rect x="154" y="274" width="40" height="34" rx="4" fill="#ffffff" stroke="#4d7fc4" stroke-width="1"/><text x="174" y="296" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[1]</text><rect x="198" y="274" width="40" height="34" rx="4" fill="#ffffff" stroke="#4d7fc4" stroke-width="1"/><text x="218" y="296" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[2]</text><rect x="242" y="274" width="40" height="34" rx="4" fill="#ffffff" stroke="#4d7fc4" stroke-width="1"/><text x="262" y="296" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[3]</text><rect x="286" y="274" width="40" height="34" rx="4" fill="#ffffff" stroke="#4d7fc4" stroke-width="1"/><text x="306" y="296" font-size="11" fill="#4d7fc4" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">A[4]</text><text x="110" y="332" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">地址能算出来 → 取第 i 个是 O(1)；</text><text x="110" y="350" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">但大小不好改，插一个要挪一片。</text><rect x="460" y="232" width="330" height="132" rx="10" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="480" y="258" font-size="14" fill="#3f9e79" text-anchor="start" font-weight="700">链表 —— 靠指针串起来</text><rect x="480" y="274" width="62" height="34" rx="4" fill="#ffffff" stroke="#3f9e79" stroke-width="1"/><line x1="524" y1="274" x2="524" y2="308" stroke="#3f9e79" stroke-width="1"/><text x="502" y="296" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">data</text><line x1="533" y1="291" x2="572" y2="291" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="576" y="274" width="62" height="34" rx="4" fill="#ffffff" stroke="#3f9e79" stroke-width="1"/><line x1="620" y1="274" x2="620" y2="308" stroke="#3f9e79" stroke-width="1"/><text x="598" y="296" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">data</text><line x1="629" y1="291" x2="668" y2="291" stroke="#3f9e79" stroke-width="1.2" marker-end="url(#ar)"/><rect x="672" y="274" width="62" height="34" rx="4" fill="#ffffff" stroke="#3f9e79" stroke-width="1"/><line x1="716" y1="274" x2="716" y2="308" stroke="#3f9e79" stroke-width="1"/><text x="694" y="296" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">data</text><text x="742" y="296" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">∅</text><text x="480" y="332" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">想插就插、想删就删 O(1)；</text><text x="480" y="350" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">但找第 i 个得从头一路走 O(n)。</text><text x="28" y="396" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="400">同一个栈，用数组实现和用链表实现，push / pop 的行为一模一样 —— 差别只在代价。</text><text x="28" y="418" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="600">逻辑结构定义「是什么」，物理结构决定「多少钱」。</text></svg>