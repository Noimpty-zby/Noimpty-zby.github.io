<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="443" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">主存：方格是画法，地址是一条直线</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">一个格子 = 一个字节，每个字节都有自己的编号（地址）</text><text x="54" y="108" font-size="11" fill="#7b7280" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1000</text><rect x="62" y="86" width="44" height="32" rx="3" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="84.0" y="108" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1000</text><rect x="108" y="86" width="44" height="32" rx="3" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="130.0" y="108" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1001</text><rect x="154" y="86" width="44" height="32" rx="3" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="176.0" y="108" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1002</text><rect x="200" y="86" width="44" height="32" rx="3" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="222.0" y="108" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monos