<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="471" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">程序跑起来之后，主存里的三块</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">从下往上：代码区 / 栈 / 堆</text><rect x="62" y="80" width="300" height="130" rx="8" fill="#fdf3e3" stroke="#c98a2b" stroke-width="1"/><text x="78" y="106" font-size="14" fill="#c98a2b" text-anchor="start" font-weight="700">堆  heap</text><text x="346" y="106" font-size="11" fill="#c98a2b" text-anchor="end" font-weight="400" fill-opacity="0.8">动态 · 手动</text><rect x="62" y="210" width="300" height="120" rx="8" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="78" y="236" font-size="14" fill="#4d7fc4" text-anchor="start" font-weight="700">栈  stack</text><text x="346" y="236" font-size="11" fill="#4d7fc4" text-anchor="end" font-weight="400" fill-opacity="0.8">静态 · 自动</text><rect x="62" y="330" width="300" height="100" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="78" y="356" font-size="14" fill="#3f9e79" text-anchor="start" font-weight="700">代码区  code</text><text x="346" y="356" font-size="11" fill="#3f9e79" text-anchor="end" font-weight="400" fill-opacity="0.8">只读 · 固定</text><rect x="78" y="124" width="70" height="20" rx="3" fill="#c98a2b" fill-opacity="0.32"/><rect x="160" y="124" width="44" height="20" rx="3" fill="#ffffff" stroke="#c98a2b" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><rect x="216" y="124" width="96" height="20" rx="3" fill="#c98a2b" fill-opacity="0.32"/><rect x="78" y="156" width="52" height="20" rx="3" fill="#ffffff" stroke="#c98a2b" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><rect x="142" y="156" width="60" height="20" rx="3" fill="#c98a2b" fill-opacity="0.32"/><rect x="214" y="156" width="98" height="20" rx="3" fill="#c98a2b" fill-opacity="0.32"/><rect x="78" y="188" width="92" height="20" rx="3" fill="#c98a2b" fill-opacity="0.32"/><rect x="182" y="188" width="44" height="20" rx="3" fill="#ffffff" stroke="#c98a2b" stroke-width="1" stroke-dasharray="3 3" fill-opacity="0.5"/><rect x="238" y="188" width="74" height="20" rx="3" fill="#c98a2b" fill-opacity="0.32"/><text x="346" y="196" font-size="10" fill="#c98a2b" text-anchor="end" font-weight="400">虚线 = free 之后留下的空洞</text><rect x="78" y="300" width="150" height="20" rx="3" fill="#4d7fc4" fill-opacity="0.22"/><text x="86" y="315" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">main() 的一层</text><rect x="78" y="276" width="150" height="20" rx="3" fill="#4d7fc4" fill-opacity="0.32"/><text x="86" y="291" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fun1() 的一层</text><rect x="78" y="252" width="150" height="20" rx="3" fill="#4d7fc4" fill-opacity="0.42000000000000004"/><text x="86" y="267" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fun2() 的一层</text><line x1="248" y1="300" x2="248" y2="244" stroke="#4d7fc4" stroke-width="1.2" marker-end="url(#ar)"/><text x="256" y="250" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400">调用 → 往上开一层</text><line x1="330" y1="244" x2="330" y2="300" stroke="#4d7fc4" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)"/><text x="322" y="292" font-size="10" fill="#4d7fc4" text-anchor="end" font-weight="400">返回 → 整层收回</text><rect x="78" y="352" width="210" height="12" rx="2" fill="#3f9e79" fill-opacity="0.22"/><rect x="78" y="374" width="160" height="12" rx="2" fill="#3f9e79" fill-opacity="0.22"/><rect x="78" y="396" width="240" height="12" rx="2" fill="#3f9e79" fill-opacity="0.22"/><rect x="400" y="68" width="452" height="114" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="416" y="86" font-size="13" fill="#c98a2b" text-anchor="start" font-weight="700">堆：运行时才申请，大小可以是变量</text><text x="416" y="110" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">malloc / new 去要，free / delete 还回来 —— 全是手写的。</text><text x="416" y="129" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">忘了还就是内存泄漏。要到的块可以整齐排着，也可以东</text><text x="416" y="148" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">一块西一块，还回去之后就在中间留下空洞。</text><text x="416" y="167" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">链表、树的节点，还有跨函数用的数据，都住在这里。</text><rect x="400" y="198" width="452" height="114" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="416" y="216" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">栈：函数调用一次开一层，返回就整层收回</text><text x="416" y="240" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">「静态」不是说它运行时不动，而是说每一层要多大、</text><text x="416" y="259" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">哪个变量放在这一层的第几个字节，编译期就算好了。</text><text x="416" y="278" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">运行时只是把栈顶指针挪一下，不需要你写一个字。</text><text x="416" y="297" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">代价是总量有限，递归太深就是 stack overflow。</text><rect x="400" y="320" width="452" height="70" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="416" y="338" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="700">代码区：编译出来的机器指令</text><text x="416" y="362" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">程序一跑起来就固定在那儿，只读。</text><text x="416" y="381" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">你写的每一行代码最后都落在这一块里。</text><text x="28" y="452" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">课上就画这三块。严格说还有全局 / 静态变量区，真实系统里栈和堆的生长方向也和这张图不一样 —— 第一天要记的是「谁自动、谁手动」。</text></svg>