 fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="249" y="228" width="23" height="23" rx="2" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="274" y="228" width="23" height="23" rx="2" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="299" y="228" width="23" height="23" rx="2" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="74" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="99" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="124" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="149" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="174" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="199" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="224" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="249" y="253" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="274" y="253" width="23" height="23" rx="2" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="299" y="253" width="23" height="23" rx="2" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="74" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="99" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="124" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="149" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="174" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="199" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="224" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="249" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="274" y="278" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="299" y="278" width="23" height="23" rx="2" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="74" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="99" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="124" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="149" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="174" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="199" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="224" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="249" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="274" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><rect x="299" y="303" width="23" height="23" rx="2" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1" fill-opacity="0.7"/><text x="62" y="203.0" font-size="13" fill="#7b7280" text-anchor="end" font-weight="600">i</text><text x="199.0" y="68" font-size="13" fill="#7b7280" text-anchor="middle" font-weight="600">j</text><text x="332" y="92" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">n = 10</text><text x="390" y="96" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="700">内层一共跑了多少次？</text><text x="390" y="124" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">i = 0   →  n−1 次</text><text x="390" y="146" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">i = 1   →  n−2 次</text><text x="390" y="168" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">……</text><text x="390" y="190" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">i = n−1 →  0 次</text><line x1="390" y1="208" x2="720" y2="208" stroke="#ded9e3" stroke-width="1"/><text x="390" y="236" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">(n−1) + (n−2) + … + 1 + 0</text><text x="390" y="262" font-size="14" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">= n(n−1)/2 = n²/2 − n/2</text><rect x="390" y="284" width="336" height="74" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="404" y="308" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">阴影正好是整块正方形的一半。</text><text x="404" y="327" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">1/2 是常数，扔掉之后剩下 n² ——</text><text x="404" y="346" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">所以它和「完整的二重循环」同为 O(n²)。</text><text x="28" y="386" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="600">n 翻一倍，格子数变成 4 倍。这就是 O(n²) 想说的全部。</text></svg>