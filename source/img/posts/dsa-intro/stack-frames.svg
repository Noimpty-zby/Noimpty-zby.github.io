<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="959" height="395" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">函数调用时，栈是怎么长出来又怎么消失的</text><rect x="36" y="76" width="196" height="244" rx="10" fill="#fcfbfd" stroke="#e8e4ea" stroke-width="1"/><rect x="56" y="246" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="68" y="264" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">main()</text><text x="68" y="280" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int a = 10</text><line x1="50" y1="300" x2="218" y2="300" stroke="#2f2a33" stroke-width="1.5"/><text x="134" y="318" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400">栈底</text><text x="134" y="346" font-size="12" fill="#2f2a33" text-anchor="middle" font-weight="600">① 进入 main</text><rect x="268" y="76" width="196" height="244" rx="10" fill="#fcfbfd" stroke="#e8e4ea" stroke-width="1"/><rect x="288" y="246" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="300" y="264" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">main()</text><text x="300" y="280" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int a = 10</text><rect x="288" y="198" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="300" y="216" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun1()</text><text x="300" y="232" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int b = 20</text><line x1="282" y1="300" x2="450" y2="300" stroke="#2f2a33" stroke-width="1.5"/><text x="366" y="318" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400">栈底</text><text x="366" y="346" font-size="12" fill="#2f2a33" text-anchor="middle" font-weight="600">② main 调用 fun1</text><rect x="500" y="76" width="196" height="244" rx="10" fill="#fcfbfd" stroke="#e8e4ea" stroke-width="1"/><rect x="520" y="246" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="532" y="264" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">main()</text><text x="532" y="280" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int a = 10</text><rect x="520" y="198" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="532" y="216" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun1()</text><text x="532" y="232" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int b = 20</text><rect x="520" y="150" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="532" y="168" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun2()</text><text x="532" y="184" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int c = 30</text><line x1="514" y1="300" x2="682" y2="300" stroke="#2f2a33" stroke-width="1.5"/><text x="598" y="318" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400">栈底</text><text x="598" y="346" font-size="12" fill="#2f2a33" text-anchor="middle" font-weight="600">③ fun1 调用 fun2</text><rect x="732" y="76" width="196" height="244" rx="10" fill="#fcfbfd" stroke="#e8e4ea" stroke-width="1"/><rect x="752" y="150" width="156" height="42" rx="5" fill="#ffffff" stroke="#ded9e3" stroke-width="1" stroke-dasharray="4 3"/><text x="830" y="176" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="400">fun2 那一层没了</text><rect x="752" y="246" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="764" y="264" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">main()</text><text x="764" y="280" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int a = 10</text><rect x="752" y="198" width="156" height="42" rx="5" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="764" y="216" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun1()</text><text x="764" y="232" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.75">int b = 20</text><line x1="746" y1="300" x2="914" y2="300" stroke="#2f2a33" stroke-width="1.5"/><text x="830" y="318" font-size="10" fill="#7b7280" text-anchor="middle" font-weight="400">栈底</text><text x="830" y="346" font-size="12" fill="#2f2a33" text-anchor="middle" font-weight="600">④ fun2 返回</text><text x="36" y="372" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="400">最后进来的 fun2 最先出去 —— 后进先出。函数调用天然就是一个栈，这也是它叫「栈」的原因。</text></svg>