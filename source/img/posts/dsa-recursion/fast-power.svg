<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" height="468" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="467" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">m ⁿ 的两种递归：一次剥一个，还是一次砍一半</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">偶数就 (m²)^(n/2)，奇数就先摘出一个 m 再照办 —— 指数每层至少减半</text><text x="44" y="100" font-size="13" fill="#9b93a3" text-anchor="start" font-weight="700">朴素：每次只剥掉一个 m</text><rect x="28" y="110" width="396" height="88" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="132" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">double power(double m, int n) {</text><text x="44" y="150" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n == 0) return 1;</text><text x="44" y="168" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    return m * power(m, n - 1);</text><text x="44" y="186" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><rect x="48" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="63" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="84" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="99" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="120" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="135" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="156" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="171" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="192" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="207" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="228" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="243" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="264" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="279" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="300" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="315" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="336" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="351" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><rect x="372" y="238" width="30" height="28" rx="4" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="387" y="257" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">×2</text><text x="44" y="292" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">2¹⁰ 要乘 10 次 —— 每层剥一个，一共 n+1 层。</text><text x="44" y="316" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="700">时间 O(n)、空间 O(n)。</text><rect x="28" y="336" width="396" height="66" rx="8" fill="#f5f3f6" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="360" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">n = 1000 时：1000 次乘法，栈上压 1001 层。</text><text x="44" y="382" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">这和写个 for 循环没有任何区别，白付了函数调用的钱。</text><text x="472" y="100" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="700">折半：n 是偶数就把底数平方</text><rect x="456" y="110" width="396" height="106" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="472" y="132" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">double power(double m, int n) {</text><text x="472" y="150" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n == 0) return 1;</text><text x="472" y="168" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n % 2 == 0) return power(m * m, n / 2);</text><text x="472" y="186" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    return m * power(m * m, (n - 1) / 2);</text><text x="472" y="204" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><text x="472" y="252" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(2, 10)</text><text x="590" y="252" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="700">偶</text><line x1="604" y1="248" x2="622" y2="248" stroke="#e8e4ea" stroke-width="1.2" marker-end="url(#ar)"/><text x="630" y="252" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(4, 5)</text><text x="472" y="279" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(4, 5)</text><text x="590" y="279" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700">奇</text><line x1="604" y1="275" x2="622" y2="275" stroke="#e8e4ea" stroke-width="1.2" marker-end="url(#ar)"/><text x="630" y="279" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">4 × power(16, 2)</text><text x="472" y="306" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(16, 2)</text><text x="590" y="306" font-size="10.5" fill="#3f9e79" text-anchor="middle" font-weight="700">偶</text><line x1="604" y1="302" x2="622" y2="302" stroke="#e8e4ea" stroke-width="1.2" marker-end="url(#ar)"/><text x="630" y="306" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(256, 1)</text><text x="472" y="333" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(256, 1)</text><text x="590" y="333" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700">奇</text><line x1="604" y1="329" x2="622" y2="329" stroke="#e8e4ea" stroke-width="1.2" marker-end="url(#ar)"/><text x="630" y="333" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">256 × power(65536, 0)</text><text x="472" y="360" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">power(65536, 0)</text><text x="590" y="360" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="700">—</text><line x1="604" y1="356" x2="622" y2="356" stroke="#e8e4ea" stroke-width="1.2" marker-end="url(#ar)"/><text x="630" y="360" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">返回 1</text><text x="472" y="392" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">2¹⁰ 只乘了 6 次，栈上最多 5 层。</text><text x="472" y="414" font-size="11.5" fill="#3f9e79" text-anchor="start" font-weight="700">时间 O(log n)、空间 O(log n)：n = 1000 只要 16 次、11 层。</text><line x1="440" y1="88" x2="440" y2="420" stroke="#e8e4ea" stroke-width="1"/><text x="28" y="448" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">这是后面二分查找、快速排序、归并排序共用的同一个套路：能把规模砍半，log 就出来了。</text></svg>