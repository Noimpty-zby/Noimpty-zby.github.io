<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="459" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">斐波那契的递归树：慢不在递归本身，在同一个子问题算了很多遍</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">树形递归的时间看「节点总数」，空间看「最深的那条路」—— 这两个数差得非常远</text><rect x="40" y="196" width="176" height="164" rx="10" fill="#ee5d7b" fill-opacity="0.06" stroke="#ee5d7b" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="350" y="138" width="176" height="164" rx="10" fill="#ee5d7b" fill-opacity="0.06" stroke="#ee5d7b" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="333.375" y1="120" x2="213.25" y2="146" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="333.375" y1="120" x2="453.5" y2="146" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="213.25" y1="178" x2="143.5" y2="204" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="213.25" y1="178" x2="283" y2="204" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="143.5" y1="236" x2="97" y2="262" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="143.5" y1="236" x2="190" y2="262" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="97" y1="294" x2="66" y2="320" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="97" y1="294" x2="128" y2="320" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="283" y1="236" x2="252" y2="262" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="283" y1="236" x2="314" y2="262" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="453.5" y1="178" x2="407" y2="204" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="453.5" y1="178" x2="500" y2="204" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="407" y1="236" x2="376" y2="262" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><line x1="407" y1="236" x2="438" y2="262" stroke="#9b93a3" stroke-width="1" stroke-opacity="0.8"/><circle cx="333.375" cy="104" r="16" fill="#ffffff"/><circle cx="333.375" cy="104" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="333.375" y="108" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><circle cx="213.25" cy="162" r="16" fill="#ffffff"/><circle cx="213.25" cy="162" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="213.25" y="166" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><circle cx="143.5" cy="220" r="16" fill="#ffffff"/><circle cx="143.5" cy="220" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="143.5" y="224" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="97" cy="278" r="16" fill="#ffffff"/><circle cx="97" cy="278" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="97" y="282" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="66" cy="336" r="16" fill="#ffffff"/><circle cx="66" cy="336" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="66" y="340" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="128" cy="336" r="16" fill="#ffffff"/><circle cx="128" cy="336" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="128" y="340" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><circle cx="190" cy="278" r="16" fill="#ffffff"/><circle cx="190" cy="278" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="190" y="282" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="283" cy="220" r="16" fill="#ffffff"/><circle cx="283" cy="220" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="283" y="224" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="252" cy="278" r="16" fill="#ffffff"/><circle cx="252" cy="278" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="252" y="282" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="314" cy="278" r="16" fill="#ffffff"/><circle cx="314" cy="278" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="314" y="282" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><circle cx="453.5" cy="162" r="16" fill="#ffffff"/><circle cx="453.5" cy="162" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="453.5" y="166" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="407" cy="220" r="16" fill="#ffffff"/><circle cx="407" cy="220" r="16" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1.1"/><text x="407" y="224" font-size="11.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="376" cy="278" r="16" fill="#ffffff"/><circle cx="376" cy="278" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="376" y="282" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="438" cy="278" r="16" fill="#ffffff"/><circle cx="438" cy="278" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="438" y="282" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><circle cx="500" cy="220" r="16" fill="#ffffff"/><circle cx="500" cy="220" r="16" fill="#3f9e79" fill-opacity="0.14" stroke="#3f9e79" stroke-width="1.1"/><text x="500" y="224" font-size="11.5" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="28" y="392" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">圆里是 f 的参数；绿色是直接返回的基准情形；两个虚线框里的子树一模一样，却从头到尾算了两遍。</text><rect x="586" y="78" width="266" height="200" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="602" y="100" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700">f(5) 这一棵树里，每个值算了几遍</text><text x="606" y="126" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f(5)</text><text x="700" y="126" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1 次</text><text x="606" y="147" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f(4)</text><text x="700" y="147" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1 次</text><text x="606" y="168" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f(3)</text><text x="700" y="168" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2 次</text><text x="606" y="189" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f(2)</text><text x="700" y="189" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3 次</text><text x="606" y="210" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f(1)</text><text x="700" y="210" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">5 次</text><text x="606" y="231" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f(0)</text><text x="700" y="231" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3 次</text><line x1="602" y1="244" x2="836" y2="244" stroke="#e8e4ea" stroke-width="1"/><text x="606" y="264" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="700">合计 15 次调用</text><text x="836" y="264" font-size="11" fill="#7b7280" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">= 2·F(6) − 1</text><rect x="586" y="292" width="266" height="126" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="602" y="310" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">所以它不是 O(n²)</text><text x="602" y="334" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">调用次数 = 2·F(n+1) − 1，</text><text x="602" y="352" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">按 φ = 1.618 的指数长 —— Θ(1.618ⁿ)，</text><text x="602" y="370" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">通常直接写成 O(2ⁿ)。</text><text x="602" y="388" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">但深度只有 n，空间还是 O(n)。</text><text x="28" y="440" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">把算过的值记在一张表里（记忆化），树上重复的那些子树就整片消失，15 次调用降到 2n+1 次。</text></svg>