<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="475" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">汉诺塔：承认「n−1 个我已经会搬了」，剩下的只有一步</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">不要去想那 n−1 个具体怎么动 —— 那是同一个函数的事，交给它就行</text><rect x="28" y="86" width="188" height="208" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="42" y="110" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="700">起点</text><text x="42" y="128" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">n 个盘全在 A，大的在下</text><line x1="42" y1="262" x2="202" y2="262" stroke="#7b7280" stroke-width="2"/><line x1="64" y1="262" x2="64" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="64" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">A</text><line x1="122" y1="262" x2="122" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="122" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">B</text><line x1="180" y1="262" x2="180" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="180" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">C</text><rect x="36" y="238" width="56" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="42" y="218" width="44" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="47" y="198" width="34" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="52" y="178" width="24" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="240" y="86" width="188" height="208" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="254" y="110" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="700">① 上面 n−1 个：A → B</text><text x="254" y="128" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">借 C 当中转 —— 这是同一个问题</text><line x1="254" y1="262" x2="414" y2="262" stroke="#7b7280" stroke-width="2"/><line x1="276" y1="262" x2="276" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="276" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">A</text><line x1="334" y1="262" x2="334" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="334" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">B</text><line x1="392" y1="262" x2="392" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="392" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">C</text><rect x="248" y="238" width="56" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="312" y="238" width="44" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><rect x="317" y="218" width="34" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><rect x="322" y="198" width="24" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><rect x="452" y="86" width="188" height="208" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="466" y="110" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="700">② 最底下那个：A → C</text><text x="466" y="128" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">只剩一个，直接搬，不需要递归</text><line x1="466" y1="262" x2="626" y2="262" stroke="#7b7280" stroke-width="2"/><line x1="488" y1="262" x2="488" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="488" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">A</text><line x1="546" y1="262" x2="546" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="546" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">B</text><line x1="604" y1="262" x2="604" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="604" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">C</text><rect x="524" y="238" width="44" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="529" y="218" width="34" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="534" y="198" width="24" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="576" y="238" width="56" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><rect x="664" y="86" width="188" height="208" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="678" y="110" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="700">③ 那 n−1 个：B → C</text><text x="678" y="128" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">这次借 A 当中转 —— 还是同一个问题</text><line x1="678" y1="262" x2="838" y2="262" stroke="#7b7280" stroke-width="2"/><line x1="700" y1="262" x2="700" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="700" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">A</text><line x1="758" y1="262" x2="758" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="758" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">B</text><line x1="816" y1="262" x2="816" y2="146" stroke="#e8e4ea" stroke-width="3"/><text x="816" y="280" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="700">C</text><rect x="788" y="238" width="56" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1"/><rect x="794" y="218" width="44" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><rect x="799" y="198" width="34" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><rect x="804" y="178" width="24" height="16" rx="4" fill="#ee5d7b" fill-opacity="0.34" stroke="#ee5d7b" stroke-width="1"/><path d="M220,190 l16,0" fill="none" stroke="#7b7280" stroke-width="1.4" marker-end="url(#ar)"/><path d="M432,190 l16,0" fill="none" stroke="#7b7280" stroke-width="1.4" marker-end="url(#ar)"/><path d="M644,190 l16,0" fill="none" stroke="#7b7280" stroke-width="1.4" marker-end="url(#ar)"/><rect x="28" y="322" width="396" height="104" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="342" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">void hanoi(int n, char from, char via, char to) {</text><text x="44" y="357" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n == 0) return;</text><text x="44" y="372" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    hanoi(n - 1, from, to, via);   // ①</text><text x="44" y="387" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    printf("%c -&gt; %c\n", from, to);  // ②</text><text x="44" y="402" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    hanoi(n - 1, via, from, to);   // ③</text><text x="44" y="417" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><rect x="456" y="322" width="396" height="108" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="472" y="340" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">搬的次数：M(n) = 2·M(n−1) + 1</text><text x="472" y="364" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">M(1) = 1，往回代：M(n) = 2ⁿ − 1，时间 O(2ⁿ)。</text><text x="472" y="382" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">但它是树形递归 —— 深度只有 n，空间还是 O(n)。</text><text x="472" y="400" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">64 个盘按每秒一步要走五千多亿年，慢在问题本身，不在写法。</text><text x="28" y="456" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">递归最难的一关就在这里：你要信任那个还没写完的函数，而不是在脑子里把每一层都展开一遍。</text></svg>