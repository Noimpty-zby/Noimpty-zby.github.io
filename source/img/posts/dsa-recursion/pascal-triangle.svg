<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="479" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">帕斯卡三角：nCr 的递归定义，画出来就一目了然</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">不用先算三个阶乘再相除 —— 组合数本身就有一条只含加法的递推式</text><line x1="254" y1="280" x2="274" y2="294" stroke="#ee5d7b" stroke-width="1.4" marker-end="url(#arp)"/><line x1="306" y1="280" x2="286" y2="294" stroke="#ee5d7b" stroke-width="1.4" marker-end="url(#arp)"/><text x="56" y="117" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 0</text><circle cx="280" cy="112" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="280" y="117" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="56" y="167" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 1</text><circle cx="254" cy="162" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="254" y="167" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="306" cy="162" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="306" y="167" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="56" y="217" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 2</text><circle cx="228" cy="212" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="228" y="217" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="280" cy="212" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="280" y="217" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="332" cy="212" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="332" y="217" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="56" y="267" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 3</text><circle cx="202" cy="262" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="202" y="267" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="254" cy="262" r="18" fill="#c98a2b" fill-opacity="0.2" stroke="#c98a2b" stroke-width="1"/><text x="254" y="267" font-size="12" fill="#c98a2b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="306" cy="262" r="18" fill="#c98a2b" fill-opacity="0.2" stroke="#c98a2b" stroke-width="1"/><text x="306" y="267" font-size="12" fill="#c98a2b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="358" cy="262" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="358" y="267" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="56" y="317" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 4</text><circle cx="176" cy="312" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="176" y="317" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="228" cy="312" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="228" y="317" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><circle cx="280" cy="312" r="18" fill="#ee5d7b" fill-opacity="0.3" stroke="#ee5d7b" stroke-width="1.6"/><text x="280" y="317" font-size="12" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><circle cx="332" cy="312" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="332" y="317" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><circle cx="384" cy="312" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="384" y="317" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="56" y="367" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 5</text><circle cx="150" cy="362" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="150" y="367" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="202" cy="362" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="202" y="367" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><circle cx="254" cy="362" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="254" y="367" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><circle cx="306" cy="362" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="306" y="367" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><circle cx="358" cy="362" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="358" y="367" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><circle cx="410" cy="362" r="18" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="410" y="367" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="280" y="404" font-size="12" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">C(4, 2) = C(3, 1) + C(3, 2) = 3 + 3 = 6</text><rect x="500" y="92" width="352" height="126" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="516" y="110" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">递推式就写在图里</text><text x="516" y="134" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">每个数 = 它上面左右两个数之和：</text><text x="516" y="152" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">C(n, r) = C(n−1, r−1) + C(n−1, r)。</text><text x="516" y="170" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">两条斜边全是 1 —— r == 0 或 r == n，</text><text x="516" y="188" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">这就是基准情形。</text><rect x="500" y="230" width="352" height="108" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="516" y="248" font-size="13" fill="#c98a2b" text-anchor="start" font-weight="700">比 n! / (r!·(n−r)!) 安全</text><text x="516" y="272" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">13! 撑爆 32 位 int，21! 撑爆 64 位。</text><text x="516" y="290" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">C(20,10) 才 184756，分子却早溢出了。</text><text x="516" y="308" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">帕斯卡这条路全程只做加法。</text><rect x="500" y="350" width="352" height="90" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="516" y="368" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">但它和斐波那契是一个毛病</text><text x="516" y="392" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">两个分支会反复重算同一个 C(n, r)。</text><text x="516" y="410" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">拿二维表记下来 → O(n·r)。</text><text x="28" y="460" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">横着读一行是 (a+b)ⁿ 的系数，竖着读是「从 n 个里挑 r 个」的方案数，同一张表两种读法。</text></svg>