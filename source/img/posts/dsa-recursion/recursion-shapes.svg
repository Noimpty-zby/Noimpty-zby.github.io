<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="509" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">递归的四种形态：看的是「在哪调、调几次」</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">和头递归 / 尾递归是两个互不相干的维度 —— 那两个说的是「工作挂在下行还是回溯」</text><rect x="28" y="78" width="396" height="190" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="46" y="106" font-size="13.5" fill="#4d7fc4" text-anchor="start" font-weight="700">线性递归</text><text x="406" y="106" font-size="10.5" fill="#4d7fc4" text-anchor="end" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">O(n) 时间 · O(n) 空间</text><text x="46" y="128" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">从上往下，每层只调用自己一次</text><circle cx="76" cy="158" r="15" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1.1"/><text x="76" y="162" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><line x1="91" y1="158" x2="135" y2="158" stroke="#4d7fc4" stroke-width="1.2" marker-end="url(#arb)"/><circle cx="150" cy="158" r="15" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1.1"/><text x="150" y="162" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><line x1="165" y1="158" x2="209" y2="158" stroke="#4d7fc4" stroke-width="1.2" marker-end="url(#arb)"/><circle cx="224" cy="158" r="15" fill="#4d7fc4" fill-opacity="0.16" stroke="#4d7fc4" stroke-width="1.1"/><text x="224" y="162" font-size="10.5" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><line x1="239" y1="158" x2="283" y2="158" stroke="#4d7fc4" stroke-width="1.2" marker-end="url(#arb)"/><circle cx="298" cy="158" r="15" fill="#7b7280" fill-opacity="0.16" stroke="#7b7280" stroke-width="1.1"/><text x="298" y="162" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><text x="46" y="202" font-size="10.5" fill="#4d7fc4" text-anchor="start" font-weight="400">一条链走到底，圆里是这一层的 n</text><text x="46" y="250" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400">求和、阶乘、线性查找，大多数递归都是这一类</text><rect x="456" y="78" width="396" height="190" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="474" y="106" font-size="13.5" fill="#ee5d7b" text-anchor="start" font-weight="700">树形递归</text><text x="834" y="106" font-size="10.5" fill="#ee5d7b" text-anchor="end" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">O(2ⁿ) 时间 · O(n) 空间</text><text x="474" y="128" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">一层里调用自己不止一次</text><circle cx="660" cy="146" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="660" y="150" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="600" cy="186" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="600" y="190" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="720" cy="186" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="720" y="190" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="570" cy="224" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="570" y="228" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="630" cy="224" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="630" y="228" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="690" cy="224" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="690" y="228" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="750" cy="224" r="12" fill="#ee5d7b" fill-opacity="0.16" stroke="#ee5d7b" stroke-width="1.1"/><text x="750" y="228" font-size="10.5" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><line x1="660" y1="158" x2="600" y2="174" stroke="#ee5d7b" stroke-width="1.1"/><line x1="660" y1="158" x2="720" y2="174" stroke="#ee5d7b" stroke-width="1.1"/><line x1="600" y1="198" x2="570" y2="212" stroke="#ee5d7b" stroke-width="1.1"/><line x1="600" y1="198" x2="630" y2="212" stroke="#ee5d7b" stroke-width="1.1"/><line x1="720" y1="198" x2="690" y2="212" stroke="#ee5d7b" stroke-width="1.1"/><line x1="720" y1="198" x2="750" y2="212" stroke="#ee5d7b" stroke-width="1.1"/><text x="474" y="146" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400">每下</text><text x="474" y="162" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400">一层</text><text x="474" y="178" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400">翻一倍</text><text x="474" y="250" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400">斐波那契、汉诺塔 —— 时间按节点数算，空间只按最深那条路算</text><rect x="28" y="286" width="396" height="190" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="46" y="314" font-size="13.5" fill="#c98a2b" text-anchor="start" font-weight="700">间接递归</text><text x="406" y="314" font-size="10.5" fill="#c98a2b" text-anchor="end" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">A → B → A</text><text x="46" y="336" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">谁都没有直接调自己</text><circle cx="150" cy="378" r="26" fill="#c98a2b" fill-opacity="0.16" stroke="#c98a2b" stroke-width="1.1"/><text x="150" y="382" font-size="10.5" fill="#c98a2b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><circle cx="298" cy="378" r="26" fill="#c98a2b" fill-opacity="0.16" stroke="#c98a2b" stroke-width="1.1"/><text x="298" y="382" font-size="10.5" fill="#c98a2b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><path d="M172,364 C208,340 240,340 276,364" fill="none" stroke="#c98a2b" stroke-width="1.3" marker-end="url(#ara)"/><path d="M276,392 C240,416 208,416 172,392" fill="none" stroke="#c98a2b" stroke-width="1.3" marker-end="url(#ara)"/><text x="344" y="372" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="400">① A 调 B</text><text x="344" y="392" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="400">② B 调回 A</text><text x="46" y="458" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400">C 里要先写函数声明，否则 A 看不见写在它后面的 B</text><rect x="456" y="286" width="396" height="190" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="474" y="314" font-size="13.5" fill="#3f9e79" text-anchor="start" font-weight="700">嵌套递归</text><text x="834" y="314" font-size="10.5" fill="#3f9e79" text-anchor="end" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">深度不由 n 定</text><text x="474" y="336" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">自己的返回值，又是自己的参数</text><text x="474" y="358" font-size="10.5" fill="#3f9e79" text-anchor="start" font-weight="400">外层的实参，要等里面那层先算出来</text><rect x="510" y="372" width="288" height="62" rx="8" fill="#3f9e79" fill-opacity="0.08" stroke="#3f9e79" stroke-width="1.2"/><text x="526" y="410" font-size="14" fill="#3f9e79" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(</text><rect x="570" y="386" width="168" height="34" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="586" y="409" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(n + 11)</text><text x="748" y="410" font-size="14" fill="#3f9e79" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">)</text><text x="474" y="458" font-size="10.5" fill="#2f2a33" text-anchor="start" font-weight="400">复杂度很难估，多见于数学定义（McCarthy 91、阿克曼函数）</text><text x="28" y="490" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">真写题时九成是线性和树形；间接与嵌套主要是拿来认，认出来画跟踪树才不会画错。</text></svg>