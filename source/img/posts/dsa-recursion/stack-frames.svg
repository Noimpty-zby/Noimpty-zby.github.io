<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="499" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">sum(3)：一次调用开一层栈帧，返回就整层收回</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">递归的时间和空间是两个问题：一个数「一共调了几次」，一个数「最多同时压着几层」</text><rect x="28" y="78" width="352" height="96" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="102" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">int sum(int n) {</text><text x="44" y="121" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n == 0) return 0;   // 基准情形</text><text x="44" y="140" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    return sum(n - 1) + n;  // 递归情形</text><text x="44" y="159" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><rect x="28" y="188" width="352" height="250" rx="8" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="44" y="210" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700">栈  stack</text><text x="364" y="210" font-size="10" fill="#4d7fc4" text-anchor="end" font-weight="400" fill-opacity="0.85">↑ 越晚开的在上面</text><rect x="84" y="392" width="170" height="32" rx="5" fill="#9b93a3" fill-opacity="0.14" stroke="#9b93a3" stroke-width="1"/><text x="96" y="413" font-size="12" fill="#9b93a3" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">main()</text><rect x="84" y="352" width="170" height="32" rx="5" fill="#4d7fc4" fill-opacity="0.19" stroke="#4d7fc4" stroke-width="1"/><text x="96" y="373" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(3)</text><text x="242" y="373" font-size="10.5" fill="#4d7fc4" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 3</text><rect x="84" y="312" width="170" height="32" rx="5" fill="#4d7fc4" fill-opacity="0.26" stroke="#4d7fc4" stroke-width="1"/><text x="96" y="333" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(2)</text><text x="242" y="333" font-size="10.5" fill="#4d7fc4" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 2</text><rect x="84" y="272" width="170" height="32" rx="5" fill="#4d7fc4" fill-opacity="0.33" stroke="#4d7fc4" stroke-width="1"/><text x="96" y="293" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(1)</text><text x="242" y="293" font-size="10.5" fill="#4d7fc4" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 1</text><rect x="84" y="232" width="170" height="32" rx="5" fill="#ee5d7b" fill-opacity="0.4" stroke="#ee5d7b" stroke-width="1"/><text x="96" y="253" font-size="12" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(0)</text><text x="242" y="253" font-size="10.5" fill="#ee5d7b" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">n = 0</text><line x1="62" y1="388" x2="62" y2="238" stroke="#4d7fc4" stroke-width="1.4" marker-end="url(#arb)"/><text x="56" y="300" font-size="11" fill="#4d7fc4" text-anchor="start" font-weight="400">①</text><text x="264" y="253" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">返回 0</text><text x="264" y="293" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0 + 1 = 1</text><text x="264" y="333" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">1 + 2 = 3</text><text x="264" y="373" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">3 + 3 = 6</text><line x1="352" y1="258" x2="352" y2="408" stroke="#ee5d7b" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arp)"/><text x="352" y="240" font-size="11" fill="#ee5d7b" text-anchor="middle" font-weight="400">②</text><text x="44" y="428" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">① 一路调用到 n == 0　② 再一路加回来</text><rect x="400" y="78" width="452" height="130" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="416" y="96" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">时间：把每一层的工作加起来</text><text x="416" y="120" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">一共调用 n+1 次（sum(n) 一直到 sum(0)），</text><text x="416" y="139" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">每层只做一次比较、一次加法，是常数。</text><text x="416" y="158" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">写成递推式：T(n) = T(n−1) + 1，T(0) = 1，</text><text x="416" y="177" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">往回代 n 次得 T(n) = n + 1 → O(n)。</text><rect x="400" y="220" width="452" height="111" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="416" y="238" font-size="13" fill="#c98a2b" text-anchor="start" font-weight="700">空间：数的是「最多同时压着几层」</text><text x="416" y="262" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">不是调用总次数 —— 返回过的帧早还回去了。</text><text x="416" y="281" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">上限是递归树的最大深度 × 每帧的大小。</text><text x="416" y="300" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">这里深度 n+1、每帧常数 → O(n)。</text><rect x="400" y="343" width="452" height="111" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="416" y="361" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">所以每个递归函数都必须有两件东西</text><text x="416" y="385" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">基准情形：一个不再调用自己的出口；</text><text x="416" y="404" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">递归情形：每次都要朝那个出口挪一步。</text><text x="416" y="423" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">少一样就是无限递归 —— 栈满，程序直接崩。</text><text x="28" y="480" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">这就是第一章那张栈帧图的直接延续 —— 唯一的新东西是：这些帧全是同一个函数的。</text></svg>