<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="475" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">递归里的 static：栈上每层各一份，静态区从头到尾只有一份</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">它像全局变量一样活在栈外面 —— 这正是它能当「跨层累加器」的原因，也是它的坑</text><rect x="28" y="88" width="196" height="300" rx="8" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="44" y="110" font-size="12" fill="#4d7fc4" text-anchor="start" font-weight="700">栈  stack</text><text x="44" y="138" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">每多调一层，</text><text x="44" y="154" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">就多一份自己的 n。</text><text x="44" y="176" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">互不干扰。</text><rect x="44" y="196" width="164" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.22" stroke="#4d7fc4" stroke-width="1"/><text x="56" y="213" font-size="11" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(0)</text><text x="56" y="229" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.8">int n = 3;</text><path d="M208,216 L250,284" fill="none" stroke="#c98a2b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ara)"/><rect x="44" y="244" width="164" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.18" stroke="#4d7fc4" stroke-width="1"/><text x="56" y="261" font-size="11" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(1)</text><text x="56" y="277" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.8">int n = 2;</text><path d="M208,264 L250,284" fill="none" stroke="#c98a2b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ara)"/><rect x="44" y="292" width="164" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.14" stroke="#4d7fc4" stroke-width="1"/><text x="56" y="309" font-size="11" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(2)</text><text x="56" y="325" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.8">int n = 1;</text><path d="M208,312 L250,284" fill="none" stroke="#c98a2b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ara)"/><rect x="44" y="340" width="164" height="40" rx="5" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1"/><text x="56" y="357" font-size="11" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">sum(3)</text><text x="56" y="373" font-size="10" fill="#4d7fc4" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" fill-opacity="0.8">int n = 0;</text><path d="M208,360 L250,284" fill="none" stroke="#c98a2b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ara)"/><rect x="256" y="236" width="172" height="96" rx="8" fill="#fdf3e3" stroke="#c98a2b" stroke-width="1"/><text x="272" y="258" font-size="12" fill="#c98a2b" text-anchor="start" font-weight="700">静态区</text><rect x="272" y="270" width="144" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1"/><text x="284" y="288" font-size="9.5" fill="#c98a2b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">static int acc = 0;</text><text x="272" y="318" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="700">全程只有这一份</text><text x="240" y="364" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400">四层看到的是同一个 acc</text><rect x="460" y="88" width="392" height="111" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="476" y="106" font-size="13" fill="#c98a2b" text-anchor="start" font-weight="700">「只初始化一次」的准确含义</text><text x="476" y="130" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">static int acc = 0; 这一行不在每次进函数时执行。</text><text x="476" y="149" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">acc 在程序加载时就已经是 0 了，往后每一层再经过</text><text x="476" y="168" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">这一行什么都不会发生 —— 只会在原值上继续改。</text><rect x="460" y="214" width="392" height="84" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="476" y="236" font-size="12" fill="#3f9e79" text-anchor="start" font-weight="700">第一次调用 sum(3)</text><text x="476" y="260" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">acc 从 0 开始，3 + 2 + 1 —— 干净的起点。</text><text x="476" y="282" font-size="11" fill="#3f9e79" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">返回 6 ✓</text><rect x="460" y="312" width="392" height="96" rx="8" fill="#fdeef1" stroke="#ee5d7b" stroke-width="1"/><text x="476" y="334" font-size="12" fill="#ee5d7b" text-anchor="start" font-weight="700">紧接着再调一次 sum(3)</text><text x="476" y="358" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">acc 还停在上一次留下的 6，函数却当它是 0，</text><text x="476" y="378" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">于是接着往上加 —— 这一次直接算错。</text><text x="476" y="398" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">返回 12，再调返回 18 ✗</text><text x="460" y="434" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">修法：别让状态待在函数外面 —— 把累加量当参数传下去。</text><text x="28" y="456" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">第一遍跑出来的结果是对的，所以这个坑通常要等到「同一个函数被调第二次」才暴露出来。</text></svg>