<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="475" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">尾递归改循环：时间不变，空间从 O(n) 掉到 O(1)</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">能这么改的前提只有一条 —— 调用自己之后，这一层再没有事情要做</text><rect x="28" y="78" width="396" height="118" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="100" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">尾递归版</text><text x="44" y="124" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">int fact(int n, int acc) {</text><text x="44" y="142" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n == 0) return acc;</text><text x="44" y="160" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    return fact(n - 1, acc * n);</text><text x="44" y="178" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">}   // 调用之后，这一层再没事可做</text><rect x="28" y="208" width="396" height="234" rx="8" fill="#fdeef1" stroke="#ee5d7b" stroke-width="1"/><text x="44" y="230" font-size="12" fill="#ee5d7b" text-anchor="start" font-weight="700">栈</text><text x="408" y="230" font-size="12" fill="#ee5d7b" text-anchor="end" font-weight="700">空间 O(n)</text><rect x="56" y="396" width="236" height="28" rx="4" fill="#ee5d7b" fill-opacity="0.09" stroke="#ee5d7b" stroke-width="1"/><text x="68" y="415" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fact(n,   1)</text><rect x="56" y="362" width="236" height="28" rx="4" fill="#ee5d7b" fill-opacity="0.13" stroke="#ee5d7b" stroke-width="1"/><text x="68" y="381" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fact(n−1, …)</text><rect x="56" y="328" width="236" height="28" rx="4" fill="#ee5d7b" fill-opacity="0.16999999999999998" stroke="#ee5d7b" stroke-width="1"/><text x="68" y="347" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fact(n−2, …)</text><rect x="56" y="294" width="236" height="28" rx="4" fill="#ee5d7b" fill-opacity="0.05" stroke="#ee5d7b" stroke-width="0.8" stroke-dasharray="3 3"/><text x="68" y="313" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">⋮</text><rect x="56" y="260" width="236" height="28" rx="4" fill="#ee5d7b" fill-opacity="0.25" stroke="#ee5d7b" stroke-width="1"/><text x="68" y="279" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fact(0,   n!)</text><text x="304" y="292" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="700">n 层帧</text><text x="304" y="310" font-size="11" fill="#ee5d7b" text-anchor="start" font-weight="400">同时活着</text><text x="304" y="338" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">够深就是</text><text x="304" y="354" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">stack</text><text x="304" y="370" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">overflow</text><path d="M430,306 l26,0" fill="none" stroke="#7b7280" stroke-width="1.5" marker-end="url(#ar)"/><text x="443" y="294" font-size="10.5" fill="#7b7280" text-anchor="middle" font-weight="400">改写</text><rect x="470" y="78" width="382" height="118" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="486" y="100" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="700">循环版（完全等价）</text><text x="486" y="122" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">int fact(int n) {</text><text x="486" y="139" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    int acc = 1;</text><text x="486" y="156" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    while (n &gt; 0) { acc *= n; n--; }</text><text x="486" y="173" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    return acc;</text><text x="486" y="190" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">}</text><rect x="470" y="208" width="382" height="234" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="486" y="230" font-size="12" fill="#3f9e79" text-anchor="start" font-weight="700">栈</text><text x="836" y="230" font-size="12" fill="#3f9e79" text-anchor="end" font-weight="700">空间 O(1)</text><text x="496" y="266" font-size="11.5" fill="#3f9e79" text-anchor="start" font-weight="700">两个实参 → 两个变量的下一轮取值</text><text x="496" y="292" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">fact(n−1, acc*n) 里传下去的东西，正好是</text><text x="496" y="312" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">循环里 n 和 acc 每转一圈该变成的样子 ——</text><text x="496" y="332" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">照着抄过去就完了。之所以敢这么抄，是因为</text><text x="496" y="352" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400">调用之后没有未完成的工作，不必留着帧等结果。</text><rect x="496" y="388" width="300" height="28" rx="4" fill="#3f9e79" fill-opacity="0.18" stroke="#3f9e79" stroke-width="1"/><text x="508" y="407" font-size="11" fill="#3f9e79" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">fact(n)   ← 自始至终就这一层</text><text x="28" y="456" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">别指望编译器替你做：gcc / clang 开 -O2 常常会消掉这层调用，但 C/C++ 标准并不保证，Python 则明确不做。</text></svg>