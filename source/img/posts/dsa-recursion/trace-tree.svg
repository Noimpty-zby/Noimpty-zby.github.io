<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="451" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">跟踪树：同一条调用链，工作挂在哪一段，输出就完全相反</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">把「调用」和「返回」画成两条线，再把工作标在对应的那条线上，输出顺序照着读就行</text><rect x="28" y="78" width="386" height="104" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="100" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">尾递归：先打印，再调用自己</text><text x="44" y="124" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">void tail(int n) {</text><text x="44" y="142" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n &gt; 0) {</text><text x="44" y="160" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">        printf("%d ", n);</text><text x="44" y="178" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">        tail(n - 1);</text><rect x="52" y="204" width="100" height="32" rx="5" fill="#ee5d7b" fill-opacity="0.13" stroke="#ee5d7b" stroke-width="1"/><text x="102" y="225" font-size="12" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(3)</text><line x1="102" y1="236" x2="102" y2="256" stroke="#ee5d7b" stroke-width="1.3" marker-end="url(#arp)"/><line x1="176" y1="256" x2="176" y2="236" stroke="#3f9e79" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arg)"/><rect x="52" y="258" width="100" height="32" rx="5" fill="#ee5d7b" fill-opacity="0.13" stroke="#ee5d7b" stroke-width="1"/><text x="102" y="279" font-size="12" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(2)</text><line x1="102" y1="290" x2="102" y2="310" stroke="#ee5d7b" stroke-width="1.3" marker-end="url(#arp)"/><line x1="176" y1="310" x2="176" y2="290" stroke="#3f9e79" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arg)"/><rect x="52" y="312" width="100" height="32" rx="5" fill="#ee5d7b" fill-opacity="0.13" stroke="#ee5d7b" stroke-width="1"/><text x="102" y="333" font-size="12" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(1)</text><line x1="102" y1="344" x2="102" y2="364" stroke="#ee5d7b" stroke-width="1.3" marker-end="url(#arp)"/><line x1="176" y1="364" x2="176" y2="344" stroke="#3f9e79" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arg)"/><rect x="52" y="366" width="100" height="32" rx="5" fill="#7b7280" fill-opacity="0.07" stroke="#7b7280" stroke-width="1"/><text x="102" y="387" font-size="12" fill="#7b7280" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(0)</text><text x="164" y="387" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">n == 0，到底</text><circle cx="102" cy="247" r="9.5" fill="#ffffff"/><circle cx="102" cy="247" r="9.5" fill="#ee5d7b" fill-opacity="0.22" stroke="#ee5d7b" stroke-width="1"/><text x="102" y="250.5" font-size="10" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="102" cy="301" r="9.5" fill="#ffffff"/><circle cx="102" cy="301" r="9.5" fill="#ee5d7b" fill-opacity="0.22" stroke="#ee5d7b" stroke-width="1"/><text x="102" y="304.5" font-size="10" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="102" cy="355" r="9.5" fill="#ffffff"/><circle cx="102" cy="355" r="9.5" fill="#ee5d7b" fill-opacity="0.22" stroke="#ee5d7b" stroke-width="1"/><text x="102" y="358.5" font-size="10" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="236" y="216" font-size="11.5" fill="#ee5d7b" text-anchor="start" font-weight="700">打印挂在「下去」的路上</text><text x="236" y="236" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">还没调用自己，就已经输出了</text><text x="236" y="266" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="400">实线 = 调用，往下走</text><text x="236" y="286" font-size="10.5" fill="#3f9e79" text-anchor="start" font-weight="400">虚线 = 返回，往回走</text><rect x="236" y="306" width="178" height="62" rx="6" fill="#f5f3f6" stroke="#e8e4ea" stroke-width="1"/><text x="252" y="328" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">顺着圆圈读下来就是输出</text><text x="252" y="354" font-size="14" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3 2 1</text><line x1="440" y1="78" x2="440" y2="400" stroke="#e8e4ea" stroke-width="1"/><rect x="466" y="78" width="386" height="104" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="482" y="100" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">头递归：先调用自己，再打印</text><text x="482" y="124" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">void head(int n) {</text><text x="482" y="142" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">    if (n &gt; 0) {</text><text x="482" y="160" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">        head(n - 1);</text><text x="482" y="178" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">        printf("%d ", n);</text><rect x="490" y="204" width="100" height="32" rx="5" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="540" y="225" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(3)</text><line x1="540" y1="236" x2="540" y2="256" stroke="#4d7fc4" stroke-width="1.3" marker-end="url(#arb)"/><line x1="614" y1="256" x2="614" y2="236" stroke="#3f9e79" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arg)"/><rect x="490" y="258" width="100" height="32" rx="5" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="540" y="279" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(2)</text><line x1="540" y1="290" x2="540" y2="310" stroke="#4d7fc4" stroke-width="1.3" marker-end="url(#arb)"/><line x1="614" y1="310" x2="614" y2="290" stroke="#3f9e79" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arg)"/><rect x="490" y="312" width="100" height="32" rx="5" fill="#4d7fc4" fill-opacity="0.13" stroke="#4d7fc4" stroke-width="1"/><text x="540" y="333" font-size="12" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(1)</text><line x1="540" y1="344" x2="540" y2="364" stroke="#4d7fc4" stroke-width="1.3" marker-end="url(#arb)"/><line x1="614" y1="364" x2="614" y2="344" stroke="#3f9e79" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arg)"/><rect x="490" y="366" width="100" height="32" rx="5" fill="#7b7280" fill-opacity="0.07" stroke="#7b7280" stroke-width="1"/><text x="540" y="387" font-size="12" fill="#7b7280" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">fun(0)</text><text x="602" y="387" font-size="10" fill="#7b7280" text-anchor="start" font-weight="400">n == 0，到底</text><circle cx="614" cy="247" r="9.5" fill="#ffffff"/><circle cx="614" cy="247" r="9.5" fill="#3f9e79" fill-opacity="0.22" stroke="#3f9e79" stroke-width="1"/><text x="614" y="250.5" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><circle cx="614" cy="301" r="9.5" fill="#ffffff"/><circle cx="614" cy="301" r="9.5" fill="#3f9e79" fill-opacity="0.22" stroke="#3f9e79" stroke-width="1"/><text x="614" y="304.5" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><circle cx="614" cy="355" r="9.5" fill="#ffffff"/><circle cx="614" cy="355" r="9.5" fill="#3f9e79" fill-opacity="0.22" stroke="#3f9e79" stroke-width="1"/><text x="614" y="358.5" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="674" y="216" font-size="11.5" fill="#3f9e79" text-anchor="start" font-weight="700">打印挂在「回来」的路上</text><text x="674" y="236" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">自己整个调完了，才轮到输出</text><text x="674" y="266" font-size="10.5" fill="#4d7fc4" text-anchor="start" font-weight="400">实线 = 调用，往下走</text><text x="674" y="286" font-size="10.5" fill="#3f9e79" text-anchor="start" font-weight="400">虚线 = 返回，往回走</text><rect x="674" y="306" width="178" height="62" rx="6" fill="#f5f3f6" stroke="#e8e4ea" stroke-width="1"/><text x="690" y="328" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400">顺着圆圈读下来就是输出</text><text x="690" y="354" font-size="14" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">1 2 3</text><text x="28" y="432" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">两段代码只差 printf 和递归调用的先后。跟踪树的用处就是：不必在脑子里模拟，顺着标记读一遍就是答案。</text></svg>