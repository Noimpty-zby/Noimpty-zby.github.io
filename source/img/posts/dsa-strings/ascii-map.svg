-anchor="start" font-weight="400">差的就是第 5 位</text><text x="640.0" y="380.0" font-size="12" fill="#7b7280" text-anchor="start" font-weight="400">第 7 位始终是 0</text><text x="640.0" y="400.0" font-size="12" fill="#7b7280" text-anchor="start" font-weight="400">所以 7 位就够用</text><text x="44.0" y="430.0" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">左边的虚线格就是第 7 位，ASCII 用不到它。</text></svg>