<line x1="155.0" y1="158.0" x2="155.0" y2="168.0" stroke="#7b7280" stroke-width="1.2"/><text x="155.0" y="184.0" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600">控制字符</text><text x="155.0" y="201.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">0–31</text><line x1="253.0" y1="158.0" x2="253.0" y2="168.0" stroke="#c98a2b" stroke-width="1.2"/><text x="253.0" y="184.0" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600">空格</text><text x="253.0" y="201.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">32</text><line x1="374.7" y1="158.0" x2="374.7" y2="168.0" stroke="#3f9e79" stroke-width="1.2"/><text x="374.7" y="184.0" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">'0'–'9'</text><text x="374.7" y="201.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">48–57</text><line x1="523.1" y1="158.0" x2="523.1" y2="168.0" stroke="#4d7fc4" stroke-width="1.2"/><text x="523.1" y="184.0" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">'A'–'Z'</text><text x="523.1" y="201.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">65–90</text><line x1="713.1" y1="158.0" x2="713.1" y2="168.0" stroke="#ee5d7b" stroke-width="1.2"/><text x="713.1" y="184.0" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">'a'–'z'</text><text x="713.1" y="201.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">97–122</text><text x="836.0" y="220.0" font-size="11.5" fill="#7b7280" te