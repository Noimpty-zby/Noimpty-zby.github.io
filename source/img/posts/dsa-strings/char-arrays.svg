<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="559" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28.0" y="34.0" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">字符数组和字符串，差在末尾那个 '\0'</text><text x="28.0" y="58.0" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">printf 和 strlen 都只认 '\0'，数组开了多大它们并不知道</text><rect x="28.0" y="82.0" width="824.0" height="62.0" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44.0" y="118.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">char x[5] = {'A','B'};</text><rect x="330.0" y="96.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="347.0" y="117.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><rect x="368.0" y="96.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="385.0" y="117.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><rect x="406.0" y="96.0" width="34.0" height="34.0" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="423.0" y="117.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text><rect x="444.0" y="96.0" width="34.0" height="34.0" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="461.0" y="117.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text><rect x="482.0" y="96.0" width="34.0" height="34.0" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="499.0" y="117.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text><text x="536.0" y="112.0" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">没给初值的位置补 0</text><text x="536.0" y="130.0" font-size="12" fill="#7b7280" text-anchor="start" font-weight="400">所以它已经是字符串 "AB"</text><rect x="28.0" y="156.0" width="824.0" height="62.0" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44.0" y="192.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">char x[] = "ABCDE";</text><rect x="330.0" y="170.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="347.0" y="191.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><rect x="368.0" y="170.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="385.0" y="191.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><rect x="406.0" y="170.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="423.0" y="191.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><rect x="444.0" y="170.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="461.0" y="191.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">D</text><rect x="482.0" y="170.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="499.0" y="191.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">E</text><rect x="520.0" y="170.0" width="34.0" height="34.0" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1"/><text x="537.0" y="191.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text><text x="574.0" y="186.0" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">双引号自动在末尾补 '\0'</text><text x="574.0" y="204.0" font-size="12" fill="#7b7280" text-anchor="start" font-weight="400">sizeof 是 6，strlen 是 5</text><rect x="28.0" y="230.0" width="824.0" height="128.0" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44.0" y="266.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">char c[] = {'A','B','C','D','E'};</text><text x="44.0" y="288.0" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">前面还声明了 char s[8] = "abcdefg";</text><rect x="330.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="347.0" y="281.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">A</text><rect x="368.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="385.0" y="281.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">B</text><rect x="406.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="423.0" y="281.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">C</text><rect x="444.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="461.0" y="281.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">D</text><rect x="482.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="499.0" y="281.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">E</text><rect x="520.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="537.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">a</text><rect x="558.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="575.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">b</text><rect x="596.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="613.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">c</text><rect x="634.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="651.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">d</text><rect x="672.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="689.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">e</text><rect x="710.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="727.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">f</text><rect x="748.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#7b7280" fill-opacity="0.05" stroke="#7b7280" stroke-width="1.1" stroke-dasharray="4 3"/><text x="765.0" y="281.5" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">g</text><rect x="786.0" y="260.0" width="34.0" height="34.0" rx="5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1.1" stroke-dasharray="4 3"/><text x="803.0" y="281.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">\0</text><text x="670.0" y="252.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400">紧挨在后面的数组 s</text><line x1="518.0" y1="256.0" x2="518.0" y2="300.0" stroke="#ee5d7b" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="347.0" y1="314.0" x2="797.0" y2="314.0" stroke="#ee5d7b" stroke-width="1.4" marker-end="url(#arp)"/><circle cx="347.0" cy="314.0" r="4" fill="#ee5d7b" stroke="#ee5d7b" stroke-width="1.2"/><text x="330.0" y="336.0" font-size="12" fill="#ee5d7b" text-anchor="start" font-weight="600">printf("%s") 一直读到 0 才停，-O0 下打印出 ABCDEabcdefg</text><rect x="28.0" y="370.0" width="824.0" height="62.0" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44.0" y="406.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">char z[5] = "Hello";</text><rect x="330.0" y="384.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="347.0" y="405.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">H</text><rect x="368.0" y="384.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="385.0" y="405.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">e</text><rect x="406.0" y="384.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="423.0" y="405.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">l</text><rect x="444.0" y="384.0" width="34.0" height="34.0" rx="5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1.1"/><text x="461.0" y="405.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">l</text><rect x="482.0" y="