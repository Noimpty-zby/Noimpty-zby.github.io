<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="447" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28.0" y="34.0" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">交换法：S 本身就是正在拼的排列</text><text x="28.0" y="58.0" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">方框里是进入这一层时 S 的内容；一共 10 个节点，对应 Perm2 的 10 次调用</text><text x="28.0" y="108.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">l = 0</text><text x="28.0" y="125.0" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">定第 1 个位置</text><text x="28.0" y="200.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">l = 1</text><text x="28.0" y="217.0" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">定第 2 个位置</text><text x="28.0" y="292.0" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">l = 2 = h</text><text x="28.0" y="309.0" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">打印</text><path d="M500.0,125.0 L500.0,143.0 L244.0,143.0 L244.0,186.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="250.0" y="162.0" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">不换</text><path d="M244.0,217.0 L244.0,235.0 L180.0,235.0 L180.0,278.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="186.0" y="254.0" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">不换</text><path d="M244.0,217.0 L244.0,235.0 L308.0,235.0 L308.0,278.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="302.0" y="254.0" font-size="10.5" fill="#c98a2b" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">S[1]↔S[2]</text><path d="M500.0,125.0 L500.0,143.0 L500.0,143.0 L500.0,186.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="506.0" y="162.0" font-size="10.5" fill="#c98a2b" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">S[0]↔S[1]</text><path d="M500.0,217.0 L500.0,235.0 L436.0,235.0 L436.0,278.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="442.0" y="254.0" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">不换</text><path d="M500.0,217.0 L500.0,235.0 L564.0,235.0 L564.0,278.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="558.0" y="254.0" font-size="10.5" fill="#c98a2b" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">S[1]↔S[2]</text><path d="M500.0,125.0 L500.0,143.0 L756.0,143.0 L756.0,186.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="750.0" y="162.0" font-size="10.5" fill="#c98a2b" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">S[0]↔S[2]</text><path d="M756.0,217.0 L756.0,235.0 L692.0,235.0 L692.0,278.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="698.0" y="254.0" font-size="10.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">不换</text><path d="M756.0,217.0 L756.0,235.0 L820.0,235.0 L820.0,278.0" fill="none" stroke="#c9c3cc" stroke-width="1.2"/><text x="814.0" y="254.0" font-size="10.5" fill="#c98a2b" text-anchor="end" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">S[1]↔S[2]</text><rect x="467.0" y="95.0" width="66.0" height="30.0" rx="6" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="500.0" y="114.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ABC</text><rect x="211.0" y="187.0" width="66.0" height="30.0" rx="6" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="244.0" y="206.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ABC</text><rect x="467.0" y="187.0" width="66.0" height="30.0" rx="6" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="500.0" y="206.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">BAC</text><rect x="723.0" y="187.0" width="66.0" height="30.0" rx="6" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="756.0" y="206.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">CBA</text><rect x="147.0" y="279.0" width="66.0" height="30.0" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="180.0" y="298.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ABC</text><rect x="275.0" y="279.0" width="66.0" height="30.0" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="308.0" y="298.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ACB</text><rect x="403.0" y="279.0" width="66.0" height="30.0" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="436.0" y="298.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">BAC</text><rect x="531.0" y="279.0" width="66.0" height="30.0" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="564.0" y="298.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">BCA</text><rect x="659.0" y="279.0" width="66.0" height="30.0" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="692.0" y="298.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">CBA</text><rect x="787.0" y="279.0" width="66.0" height="30.0" rx="6" fill="#3f9e79" fill-opacity="0.16" stroke="#3f9e79" stroke-width="1.2"/><text x="820.0" y="298.8" font-size="13.5" fill="#2f2a33" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">CAB</text><text x="28.0" y="336.0" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">打印顺序</text><circle cx="180.0" cy="332.0" r="8" fill="#ffffff" stroke="#3f9e79" stroke-width="1.2"/><text x="180.0" y="335.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700">1</text><circle cx="308.0" cy="332.0" r="8" fill="#ffffff" stroke="#3f9e79" stroke-width="1.2"/><text x="308.0" y="335.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700">2</text><circle cx="436.0" cy="332.0" r="8" fill="#ffffff" stroke="#3f9e79" stroke-width="1.2"/><text x="436.0" y="335.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700">3</text><circle cx="564.0" cy="332.0" r="8" fill="#ffffff" stroke="#3f9e79" stroke-width="1.2"/><text x="564.0" y="335.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700">4</text><circle cx="692.0" cy="332.0" r="8" fill="#ffffff" stroke="#3f9e79" stroke-width="1.2"/><text x="692.0" y="335.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700">5</text><circle cx="820.0" cy="332.0" r="8" fill="#ffffff" stroke="#3f9e79" stroke-width="1.2"/><text x="820.0" y="335.6" font-size="10" fill="#3f9e79" text-anchor="middle" font-weight="700">6</text><rect x="28.0" y="362.0" width="824.0" height="70.0" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/><text x="44.0" y="388.0" font-size="12" fill="#2f2a33" text-anchor="start" font-weight="400">每条边往下走之前交换一次，从下面回来以后再交换一次，S 就恢复成父节点里的样子。</text><text x="44.0" y="410.0" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">l = 0 的第三个分支先把 A、C 交换成 CBA，所以这一支先打印 CBA、后打印 CAB，最后两个不是字典序。</text></svg>