<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">git push origin cat:main：拿本地的 cat，去更新远程的 main</text>
<text x="28" y="58" font-size="13" fill="#7b7280">推完之后，远程的 main 和本地的 origin/main 都指向 dade8c9，本地的 main 一动没动</text>
