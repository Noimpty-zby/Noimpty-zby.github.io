<text x="270" y="176" font-size="13" fill="#4d7fc4" font-weight="700" text-anchor="middle">origin：远程仓库的名字</text>
<text x="270" y="195" font-size="12" fill="#7b7280" text-anchor="middle">地址记在 .git/config 里</text>
<text x="490" y="176" font-size="13" fill="#ee5d7b" font-weight="700" text-anchor="middle">cat：本地分支（src）</text>
<text x="490" y="195" font-size="12" fill="#7b7280" text-anchor="middle">从这里取提交</text>
<text x="700" y="176" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="middle">main：远程的分支（dst）</text>
<text x="700" y="195" font-size="12" fill="#7b7280" text-anchor="middle">没有就新建，有就往前挪</text>
