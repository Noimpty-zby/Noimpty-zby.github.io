<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0.5" y="0.5" width="879" height="383" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0b9c8"/></marker><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker></defs>
<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">上游：-u 让 cat 和 origin/cat 配成一对</text>
<text x="28" y="58" font-size="13" fill="#7b7280">git status 只在本地比较 cat 和 origin/cat，并不联网；git push 推到远程，推完把 origin/cat 也挪过去</text>
<rect x="30" y="84" width="530" height="274" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="48" y="108" font-size="13" fill="#2f2a33" font-weight="700">本地仓库 notes</text>
<rect x="650" y="84" width="200" height="274" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="668" y="108" font-size="13" fill="#2f2a33" font-weight="700">远程仓库</text>
<text x="668" y="126" font-size="11" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">github/notes.git</text>
<rect x="55" y="152" width="190" height="76" rx="10" fill="#ee5d7b" fill-opacity="0.07" stroke="#ee5d7b" stroke-opacity="0.7" stroke-width="1.5"/>
<text x="150.0" y="184" font-size="15" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">cat</text>
<text x="150.0" y="208" font-size="12" fill="#7b7280" text-anchor="middle">0e2687d 猫喜欢纸箱</text>
<rect x="330" y="152" width="205" height="76" rx="10" fill="#4d7fc4" fill-opacity="0.07" stroke="#4d7fc4" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="432.5" y="184" font-size="15" fill="#4d7fc4" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">origin/cat</text>
<text x="432.5" y="208" font-size="12" fill="#7b7280" text-anchor="middle">dade8c9 猫咪笔记</text>
<rect x="670" y="152" width="160" height="76" rx="10" fill="#3f9e79" fill-opacity="0.07" stroke="#3f9e79" stroke-opacity="0.7" stroke-width="1.5"/>
<text x="750.0" y="184" font-size="15" fill="#3f9e79" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">cat</text>
<text x="750.0" y="208" font-size="12" fill="#7b7280" text-anchor="middle">dade8c9 猫咪笔记</text>
<line x1="249" y1="190" x2="326" y2="190" stroke="#7b7280" stroke-width="1.6" marker-start="url(#mi)" marker-end="url(#mi)"/>
<text x="287" y="178" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">status</text>
<text x="287" y="210" font-size="12" fill="#7b7280" text-anchor="middle">比较</text>
<line x1="539" y1="190" x2="666" y2="190" stroke="#7b7280" stroke-width="1.6" marker-start="url(#mi)" marker-end="url(#mi)"/>
<text x="605" y="178" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">push</text>
<text x="605" y="210" font-size="12" fill="#7b7280" text-anchor="middle">同步</text>
<text x="55" y="256" font-size="11" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">$ git status</text>
<text x="55" y="273" font-size="11" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">Your branch is ahead of 'origin/cat' by 1 commit.</text>
<rect x="55" y="284" width="200" height="62" rx="8" fill="#ffffff" stroke="#e8e4ea" stroke-width="1.2"/>
<text x="67" y="304" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">[branch "cat"]</text>
<text x="81" y="321" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">remote = origin</text>
<text x="81" y="338" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">merge = refs/heads/cat</text>
<text x="272" y="310" font-size="12" fill="#ee5d7b" font-weight="700">-u 写进 .git/config 的两行</text>
<text x="272" y="330" font-size="12" fill="#7b7280">上游指的就是这两行记下的关系</text>
<text x="670" y="262" font-size="11" fill="#7b7280">推送之后，远程的 cat</text>
<text x="670" y="278" font-size="11" fill="#7b7280">和 origin/cat 一起</text>
<text x="670" y="294" font-size="11" fill="#7b7280">挪到 0e2687d</text>
</svg>
