<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0.5" y="0.5" width="879" height="451" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/>
<defs>
<marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker>
</defs>
<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">冲突的时候，索引里同时存着三个版本</text>
<text x="28" y="58" font-size="13" fill="#7b7280">工作区那个夹着标记的文件只是给人看的草稿 —— 真正卡住提交的是索引里没塌下去的三个槽</text>

<rect x="30" y="84" width="376" height="220" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1"/>
<text x="46" y="106" font-size="12" fill="#9b93a3" font-weight="700">工作区 · config.txt</text>
<text x="46" y="132" font-size="11.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace"># 服务配置</text>
<text x="46" y="151" font-size="11.5" fill="#c98a2b" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="46" y="170" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 3000</text>
<text x="46" y="189" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">超时 = 60</text>
<text x="46" y="208" font-size="11.5" fill="#c98a2b" font-family="ui-monospace,Menlo,Consolas,monospace">=======</text>
<text x="46" y="227" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 8080</text>
<text x="46" y="246" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">超时 = 30</text>
<text x="46" y="265" font-size="11.5" fill="#c98a2b" font-family="ui-monospace,Menlo,Consolas,monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>
<text x="46" y="284" font-size="11.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">日志 = info</text>

<text x="446" y="106" font-size="12" fill="#9b93a3" font-weight="700">索引 · git ls-files -u 列出来的</text>

<rect x="446" y="118" width="404" height="56" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1" stroke-dasharray="5 4"/>
<text x="462" y="140" font-size="12" fill="#9b93a3" font-weight="700">槽 1 · 共同祖先</text>
<text x="834" y="140" font-size="11" fill="#c0b9c8" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">291e1ec</text>
<text x="462" y="161" font-size="11.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 3000　超时 = 30</text>

<rect x="446" y="182" width="404" height="56" rx="8" fill="#4d7fc4" fill-opacity="0.04" stroke="#4d7fc4" stroke-opacity="0.5" stroke-width="1.4"/>
<text x="462" y="204" font-size="12" fill="#4d7fc4" font-weight="700">槽 2 · HEAD 这一边</text>
<text x="834" y="204" font-size="11" fill="#c0b9c8" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">92df3e8</text>
<text x="462" y="225" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 3000　超时 = 60</text>

<rect x="446" y="246" width="404" height="56" rx="8" fill="#ee5d7b" fill-opacity="0.04" stroke="#ee5d7b" stroke-opacity="0.5" stroke-width="1.4"/>
<text x="462" y="268" font-size="12" fill="#ee5d7b" font-weight="700">槽 3 · feature 这一边</text>
<text x="834" y="268" font-size="11" fill="#c0b9c8" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">8c13359</text>
<text x="462" y="289" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 8080　超时 = 30</text>

<line x1="648" y1="304" x2="648" y2="344" stroke="#3f9e79" stroke-opacity="0.75" stroke-width="1.8" marker-end="url(#sg)"/>
<text x="664" y="330" font-size="12.5" fill="#3f9e79" font-weight="700">git add config.txt</text>

<rect x="446" y="352" width="404" height="66" rx="8" fill="#3f9e79" fill-opacity="0.05" stroke="#3f9e79" stroke-opacity="0.55" stroke-width="1.6"/>
<text x="462" y="376" font-size="12" fill="#3f9e79" font-weight="700">槽 0 · 只剩你定下的那一版</text>
<text x="462" y="400" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">工作区文件当时是什么样，收进去的就是什么样</text>

<text x="46" y="330" font-size="12.5" fill="#2f2a33" font-weight="700">Git 从不检查标记有没有删干净</text>
<text x="46" y="354" font-size="12" fill="#7b7280">那七个尖括号照原样留着，一样能 add、能提交</text>
<text x="46" y="376" font-size="12" fill="#7b7280">退出码 0，一句提醒都不会有</text>
<text x="46" y="404" font-size="12" fill="#c98a2b" font-weight="700">提交前自己查：git diff --cached --check</text>
</svg>
