<text x="665" y="139" font-size="11" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">&lt;用户名&gt;.github.io/notes/</text>
<rect x="618" y="166" width="120" height="13" rx="3" fill="#2f2a33" fill-opacity="0.8"/>
<rect x="618" y="192" width="210" height="7" rx="3" fill="#e8e4ea"/>
