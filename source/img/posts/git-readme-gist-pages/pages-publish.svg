<text x="299" y="182" font-size="12" fill="#3f9e79" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle" xml:space="preserve">push</text>
<path d="M 560 192 L 598 192" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/>
<text x="579" y="182" font-size="12" fill="#4d7fc4" font-weight="700" text-anchor="middle" xml:space="preserve">发布</text>
<line x1="28" y1="326" x2="852" y2="326" stroke="#e8e4ea" stroke-width="1"/>
<text x="28" y="352" font-size="13" fill="#2f2a33" font-weight="700" xml:space="preserve">网站的地址有两种</text>
<text x="28" y="380" font-size="13" fill="#c98a2b" font-weight="700" xml:space="preserve">项目网站</text>
<text x="98" y="380" font-size="12" fill="#7b7280" xml:space="preserve">任意仓库都可以，每个仓库一个</text>
<text x="852" y="380" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end" xml:space="preserve">https://&lt;用户名&gt;.github.io/&lt;仓库名&gt;/</text>
<text x="28" y="410" font-size="13" fill="#c98a2b" font-weight="700" xml:space="preserve">用户网站</text>
<text x="98" y="410" font-size="12" fill="#7b7280" xml:space="preserve">仓库名必须是 &lt;用户名&gt;.github.io，每个账号一个</text>
<text x="852" y="410" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end" xml:space="preserve">https://&lt;用户名&gt;.github.io/</text>
</svg>
