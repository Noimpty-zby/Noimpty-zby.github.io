<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0.5" y="0.5" width="879" height="439" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/>
<defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker></defs>
<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">从分支发布到 GitHub Pages</text>
<text x="28" y="58" font-size="13" fill="#7b7280">在 Settings 的 Pages 页选好分支和目录，以后每次推送到这条分支，Pages 都会重新构建并发布这个目录</text>
<rect x="28" y="84" width="248" height="216" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.4"/>
<text x="44" y="108" font-size="14" fill="#2f2a33" font-weight="700" xml:space="preserve">仓库 notes</text>
<text x="126" y="108" font-size="12" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">main 分支</text>
<text x="52" y="140" font-size="13" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">README.md</text>
<text x="52" y="164" font-size="13" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">ssh.md</text>
<text x="52" y="188" font-size="13" fill="#3f9e79" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">docs/</text>
<text x="74" y="212" font-size="13" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">index.md</text>
<text x="74" y="236" font-size="13" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">style.css</text>
<rect x="44" y="171" width="216" height="76" rx="7" fill="#3f9e79" fill-opacity="0.07" stroke="#3f9e79" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="44" y="278" font-size="12" fill="#3f9e79" font-weight="700" xml:space="preserve">发布源：main 分支的 /docs</text>
<rect x="326" y="120" width="234" height="144" rx="10" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.4"/>
<text x="342" y="144" font-size="14" fill="#2f2a33" font-weight="700" xml:space="preserve">Pages 构建</text>
<text x="342" y="166" font-size="12" fill="#7b7280" xml:space="preserve">默认用 Jekyll</text>
<text x="342" y="196" font-size="13" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">index.md</text>
<text x="424" y="196" font-size="13" fill="#7b7280" xml:space="preserve">→</text>
<text x="442" y="196" font-size="13" fill="#4d7fc4" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">index.html</text>
<text x="342" y="222" font-size="13" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">style.css</text>
<text x="424" y="222" font-size="13" fill="#7b7280" xml:space="preserve">→</text>
<text x="442" y="222" font-size="13" fill="#4d7fc4" font-family="ui-monospace,Menlo,Consolas,monospace" xml:space="preserve">style.css</text>
<text x="342" y="248" font-size="12" fill="#7b7280" xml:space="preserve">Markdown 转成 HTML，其余原样</text>
