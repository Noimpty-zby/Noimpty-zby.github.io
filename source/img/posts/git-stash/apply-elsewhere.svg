<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0.5" y="0.5" width="879" height="439" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/>
<defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0b9c8"/></marker><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker></defs>
<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">在 feature 上收，在 master 上取：带过去的只是那段改动</text>
<text x="28" y="58" font-size="13" fill="#7b7280">取出来是一次三方合并：以收的时候的 HEAD 为祖先，只合进「收起来的那份相对它改了什么」</text>
<rect x="30" y="84" width="270" height="128" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.2"/>
<text x="46" y="108" font-size="12.5" fill="#4d7fc4" font-weight="700">feature · 收的时候的 HEAD</text>
<text x="284" y="108" font-size="11" fill="#c0b9c8" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end">58e596c</text>
<text x="46" y="140" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 8080</text>
<text x="46" y="166" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">日志 = info</text>
<text x="46" y="192" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">容量 = 256MB</text>
<rect x="580" y="84" width="270" height="128" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.2"/>
<text x="596" y="108" font-size="12.5" fill="#c98a2b" font-weight="700">stash@{0}</text>
<text x="834" y="108" font-size="11" fill="#c0b9c8" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end">d0a1d53</text>
<text x="596" y="140" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 8080</text>
<text x="596" y="166" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">日志 = info</text>
<rect x="590" y="178" width="150" height="20" rx="4" fill="#c98a2b" fill-opacity="0.13"/>
<text x="596" y="192" font-size="12.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">容量 = 512MB</text>
<rect x="30" y="272" width="270" height="128" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.2"/>
<text x="46" y="296" font-size="12.5" fill="#ee5d7b" font-weight="700">master · apply 之前</text>
<text x="284" y="296" font-size="11" fill="#c0b9c8" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end">0bcc629</text>
<text x="46" y="328" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 3000</text>
<text x="46" y="354" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">日志 = debug</text>
<text x="46" y="380" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">容量 = 256MB</text>
<rect x="580" y="272" width="270" height="128" rx="8" fill="#fdfcfd" stroke="#e8e4ea" stroke-width="1.2"/>
<text x="596" y="296" font-size="12.5" fill="#ee5d7b" font-weight="700">master · apply 之后</text>
<text x="834" y="296" font-size="11" fill="#c0b9c8" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="end">工作区</text>
<rect x="590" y="314" width="150" height="20" rx="4" fill="#3f9e79" fill-opacity="0.13"/>
<text x="596" y="328" font-size="12.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">端口 = 3000</text>
<text x="596" y="354" font-size="12.5" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">日志 = debug</text>
<rect x="590" y="366" width="150" height="20" rx="4" fill="#c98a2b" fill-opacity="0.13"/>
<text x="596" y="380" font-size="12.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">容量 = 512MB</text>
<line x1="306" y1="148" x2="574" y2="148" stroke="#c98a2b" stroke-opacity="0.75" stroke-width="1.6" marker-end="url(#ma)"/>
<text x="440" y="136" font-size="12.5" fill="#c98a2b" font-weight="700" text-anchor="middle">收起来的这段改动</text>
<text x="440" y="170" font-size="12" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">容量 256MB → 512MB</text>
<line x1="306" y1="336" x2="574" y2="336" stroke="#c98a2b" stroke-opacity="0.75" stroke-width="1.6" marker-end="url(#ma)"/>
<text x="440" y="324" font-size="12.5" fill="#c98a2b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">git stash apply</text>
<text x="440" y="358" font-size="12" fill="#7b7280" text-anchor="middle">同一段改动，换个地方再做一遍</text>
<line x1="440" y1="184" x2="440" y2="302" stroke="#c98a2b" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ma)"/>
<text x="30" y="424" font-size="12" fill="#7b7280">端口 = 8080 是 feature 自己那次提交的内容，不在收起来的改动里，所以没有跟过来；master 上也没有多出任何提交。</text>
</svg>
