<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0.5" y="0.5" width="879" height="329" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/>
<defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs>
<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">两种标签都是 .git/refs/tags/ 下的一个文件，区别在于文件里记的是谁</text>
<text x="28" y="58" font-size="13" fill="#7b7280">轻量标签记的就是提交号；带注释的标签记的是一个标签对象，标签对象再指向提交</text>
<text x="28" y="123" font-size="14" fill="#4d7fc4" font-weight="700">轻量标签</text>
<rect x="140" y="90" width="170" height="56" rx="8" fill="#4d7fc4" fill-opacity="0.06" stroke="#4d7fc4" stroke-opacity="0.6" stroke-width="1.4"/>
<text x="154" y="113" font-size="12" fill="#2f2a33" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">refs/tags/v1.0.1</text>
<text x="154" y="134" font-size="12" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">e64ec5b…</text>
<path d="M 310 118 L 649 118" fill="none" stroke="#4d7fc4" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="480" y="110" font-size="12" fill="#4d7fc4" text-anchor="middle">直接指向提交</text>
<rect x="655" y="100" width="200" height="36" rx="18" fill="#ffffff" stroke="#3f9e79" stroke-opacity="0.75" stroke-width="1.8"/>
<text x="672" y="123" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">e64ec5b</text>
<text x="732" y="123" font-size="12" fill="#2f2a33">README 写上用法</text>
<text x="672" y="156" font-size="11" fill="#7b7280">提交对象</text>
<text x="28" y="233" font-size="14" fill="#c98a2b" font-weight="700">带注释的标签</text>
<rect x="140" y="200" width="170" height="56" rx="8" fill="#c98a2b" fill-opacity="0.06" stroke="#c98a2b" stroke-opacity="0.6" stroke-width="1.4"/>
<text x="154" y="223" font-size="12" fill="#2f2a33" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">refs/tags/v1.1.0</text>
<text x="154" y="244" font-size="12" fill="#7b7280" font-family="ui-monospace,Menlo,Consolas,monospace">fd49d23…</text>
<path d="M 310 228 L 339 228" fill="none" stroke="#c98a2b" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="345" y="170" width="280" height="136" rx="10" fill="#c98a2b" fill-opacity="0.06" stroke="#c98a2b" stroke-opacity="0.75" stroke-width="1.6"/>
<text x="361" y="193" font-size="13" fill="#c98a2b" font-weight="700">标签对象 fd49d23</text>
<text x="361" y="216" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">object a6db516</text>
<text x="361" y="234" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">type commit</text>
<text x="361" y="252" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">tag v1.1.0</text>
<text x="361" y="270" font-size="11.5" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">tagger Noimpty-zby …</text>
<text x="361" y="294" font-size="11.5" fill="#2f2a33">新增 done 命令，可以删掉已经做完的事项</text>
<path d="M 625 228 L 649 228" fill="none" stroke="#c98a2b" stroke-width="1.8" marker-end="url(#ma)"/>
<rect x="655" y="210" width="200" height="36" rx="18" fill="#ffffff" stroke="#3f9e79" stroke-opacity="0.75" stroke-width="1.8"/>
<text x="672" y="233" font-size="12" fill="#2f2a33" font-family="ui-monospace,Menlo,Consolas,monospace">a6db516</text>
<text x="732" y="233" font-size="12" fill="#2f2a33">新增 done 命令</text>
<text x="672" y="266" font-size="11" fill="#7b7280">提交对象</text>
</svg>
