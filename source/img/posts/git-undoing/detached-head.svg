<text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700">git checkout &lt;提交&gt; 只挪 HEAD：它越过分支，直接记住一个提交号</text>
<text x="28" y="58" font-size="13" fill="#7b7280">左边是平时；右边是 git checkout HEAD~2 之后。master 那个文件一个字没变</text>
