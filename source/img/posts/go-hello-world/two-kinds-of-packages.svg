<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="880" height="404" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="403" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><defs><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">名叫 main 的包编译成程序，别的包要被导入才会用上</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">go build 对这两种包的处理不一样</text><rect x="28" y="80" width="76" height="24" rx="12" fill="#4d7fc4" fill-opacity="0.14"/><text x="66" y="96.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600">可执行包</text><rect x="532" y="80" width="76" height="24" rx="12" fill="#3f9e79" fill-opacity="0.14"/><text x="570" y="96.5" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="600">可复用包</text><rect x="28" y="114" width="320" height="84" rx="10" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1.3"/><rect x="532" y="114" width="320" height="84" rx="10" fill="#3f9e79" fill-opacity="0.08" stroke="#3f9e79" stroke-width="1.3"/><text x="188.0" y="144" font-size="15" fill="#2f2a33" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">package main</text><text x="188.0" y="166" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">test.go、greeting.go</text><text x="188.0" y="186" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="400">必须有 func main()</text><text x="692.0" y="144" font-size="15" fill="#2f2a33" text-anchor="middle" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">package calculator</text><text x="692.0" y="166" font-size="12.5" fill="#2f2a33" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">calculator/calculator.go</text><text x="692.0" y="186" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="400">提供首字母大写的 Add</text><line x1="356" y1="156.0" x2="522" y2="156.0" stroke="#7b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="440.0" y="146.0" font-size="12" fill="#7b7280" text-anchor="middle" font-weight="500" font-family="ui-monospace,Menlo,Consolas,monospace">import</text><text x="440.0" y="176.0" font-size="11.5" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">gostudy/calculator</text><line x1="188.0" y1="204" x2="188.0" y2="254" stroke="#4d7fc4" stroke-width="1.6" marker-end="url(#arb)"/><text x="176.0" y="235" font-size="12.5" fill="#4d7fc4" text-anchor="end" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">go build</text><line x1="692.0" y1="204" x2="692.0" y2="254" stroke="#3f9e79" stroke-width="1.6" marker-end="url(#arg)"/><text x="680.0" y="235" font-size="12.5" fill="#3f9e79" text-anchor="end" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">go build ./calculator</text><rect x="28" y="262" width="320" height="84" rx="10" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1.3"/><rect x="532" y="262" width="320" height="84" rx="10" fill="#3f9e79" fill-opacity="0.08" stroke="#3f9e79" stroke-width="1.3"/><text x="188.0" y="294" font-size="15" fill="#2f2a33" text-anchor="middle" font-weight="700">可执行文件 gostudy</text><text x="188.0" y="318" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="400">./gostudy 直接运行，Add 的代码也编译在里面</text><text x="692.0" y="294" font-size="15" fill="#2f2a33" text-anchor="middle" font-weight="700">不生成任何文件</text><text x="692.0" y="318" font-size="12.5" fill="#7b7280" text-anchor="middle" font-weight="400">只检查这个包能不能通过编译</text><text x="28" y="380" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">同一个目录里只能有一个包；导入路径是模块路径 gostudy 加上目录名 calculator。</text></svg>