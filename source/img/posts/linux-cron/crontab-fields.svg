<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="383" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">crontab 里一行的六个部分</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">前五个字段规定什么时候运行，剩下的部分是要运行的命令，cron 把它交给 /bin/sh 执行</text><rect x="28" y="92" width="112" height="44" rx="8" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1"/><text x="84.0" y="121" font-size="20" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">30</text><line x1="84.0" y1="142" x2="84.0" y2="162" stroke="#e8e4ea" stroke-width="2"/><rect x="28" y="168" width="112" height="104" rx="8" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="84.0" y="194" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">分钟</text><text x="84.0" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">0–59</text><text x="84.0" y="252" font-size="13" fill="#4d7fc4" font-weight="700" text-anchor="middle">第 30 分</text><rect x="152" y="92" width="112" height="44" rx="8" fill="#4d7fc4" fill-opacity="0.08" stroke="#4d7fc4" stroke-width="1"/><text x="208.0" y="121" font-size="20" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">9</text><line x1="208.0" y1="142" x2="208.0" y2="162" stroke="#e8e4ea" stroke-width="2"/><rect x="152" y="168" width="112" height="104" rx="8" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="208.0" y="194" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">小时</text><text x="208.0" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">0–23</text><text x="208.0" y="252" font-size="13" fill="#4d7fc4" font-weight="700" text-anchor="middle">9 点</text><rect x="276" y="92" width="112" height="44" rx="8" fill="#7b7280" fill-opacity="0.08" stroke="#7b7280" stroke-width="1"/><text x="332.0" y="121" font-size="20" fill="#2f2a33" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">*</text><line x1="332.0" y1="142" x2="332.0" y2="162" stroke="#e8e4ea" stroke-width="2"/><rect x="276" y="168" width="112" height="104" rx="8" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="332.0" y="194" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">日</text><text x="332.0" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">1–31</text><text x="332.0" y="252" font-size="13" fill="#2f2a33" font-weight="700" text-anchor="middle">每一天</text><rect x="400" y="92" width="112" height="44" rx="8" fill="#7b7280" fill-opacity="0.08" stroke="#7b7280" stroke-width="1"/><text x="456.0" y="121" font-size="20" fill="#2f2a33" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">*</text><line x1="456.0" y1="142" x2="456.0" y2="162" stroke="#e8e4ea" stroke-width="2"/><rect x="400" y="168" width="112" height="104" rx="8" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="456.0" y="194" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">月</text><text x="456.0" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">1–12</text><text x="456.0" y="252" font-size="13" fill="#2f2a33" font-weight="700" text-anchor="middle">每个月</text><rect x="524" y="92" width="112" height="44" rx="8" fill="#ee5d7b" fill-opacity="0.08" stroke="#ee5d7b" stroke-width="1"/><text x="580.0" y="121" font-size="20" fill="#ee5d7b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1-5</text><line x1="580.0" y1="142" x2="580.0" y2="162" stroke="#e8e4ea" stroke-width="2"/><rect x="524" y="168" width="112" height="104" rx="8" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="580.0" y="194" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">星期</text><text x="580.0" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">0–7</text><text x="580.0" y="252" font-size="13" fill="#ee5d7b" font-weight="700" text-anchor="middle">周一到周五</text><rect x="648" y="92" width="204" height="44" rx="8" fill="#3f9e79" fill-opacity="0.08" stroke="#3f9e79" stroke-width="1"/><text x="750.0" y="120" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">date &gt;&gt; ~/cron.log</text><line x1="750.0" y1="142" x2="750.0" y2="162" stroke="#e8e4ea" stroke-width="2"/><rect x="648" y="168" width="204" height="104" rx="8" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="750.0" y="194" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">命令</text><text x="750.0" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">这一行剩下的部分</text><text x="750.0" y="252" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="middle">由 /bin/sh 执行</text><rect x="28" y="302" width="824" height="40" rx="8" fill="#7b7280" fill-opacity="0.05" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="328" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="start">合起来就是在周一到周五的每天 9:30，运行一次 date &gt;&gt; ~/cron.log</text><text x="28" y="362" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">灰色的 * 表示这个字段取任何值都可以，所以这一行只看分钟、小时和星期这三个字段。</text></svg>
