<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b7280"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f9e79"/></marker></defs><rect x="0.5" y="0.5" width="879" height="431" rx="14" fill="#ffffff" stroke="#e8e4ea"/><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">bash 启动时读取的配置文件</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">带编号的是 bash 自己按顺序读取的文件，虚线连着的是上一个文件用 source（.）读入的文件</text><rect x="28" y="84" width="260" height="60" rx="10" fill="#2f2a33" fill-opacity="0.04" stroke="#2f2a33" stroke-width="1.2"/><text x="158.0" y="110" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">登录 Shell</text><text x="158.0" y="131" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">WSL 的终端、SSH 登录、su -</text><circle cx="55" cy="170" r="11" fill="#2f2a33"/><text x="55" y="174.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="72" y="155" width="133.2" height="30" rx="7" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="84" y="175" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/etc/profile</text><path d="M84 185 V216 H96" fill="none" stroke="#7b7280" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="98" y="201" width="167.6" height="30" rx="7" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="110" y="221" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/etc/bash.bashrc</text><circle cx="55" cy="262" r="11" fill="#2f2a33"/><text x="55" y="266.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="72" y="247" width="116.0" height="30" rx="7" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1.2"/><text x="84" y="267" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.profile</text><path d="M84 277 V308 H96" fill="none" stroke="#7b7280" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="98" y="293" width="107.39999999999999" height="30" rx="7" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1.2"/><text x="110" y="313" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.bashrc</text><path d="M110 323 V354 H122" fill="none" stroke="#7b7280" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="124" y="339" width="159.0" height="30" rx="7" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1.2"/><text x="136" y="359" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.bash_aliases</text><rect x="310" y="84" width="260" height="60" rx="10" fill="#2f2a33" fill-opacity="0.04" stroke="#2f2a33" stroke-width="1.2"/><text x="440.0" y="110" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">交互式的非登录 Shell</text><text x="440.0" y="131" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">桌面终端、在终端里输入 bash</text><circle cx="337" cy="170" r="11" fill="#2f2a33"/><text x="337" y="174.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="354" y="155" width="167.6" height="30" rx="7" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="366" y="175" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/etc/bash.bashrc</text><circle cx="337" cy="216" r="11" fill="#2f2a33"/><text x="337" y="220.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="354" y="201" width="107.39999999999999" height="30" rx="7" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1.2"/><text x="366" y="221" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.bashrc</text><path d="M366 231 V262 H378" fill="none" stroke="#7b7280" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="380" y="247" width="159.0" height="30" rx="7" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1.2"/><text x="392" y="267" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">~/.bash_aliases</text><rect x="592" y="84" width="260" height="60" rx="10" fill="#2f2a33" fill-opacity="0.04" stroke="#2f2a33" stroke-width="1.2"/><text x="722.0" y="110" font-size="15" fill="#2f2a33" font-weight="700" text-anchor="middle">非交互式的 Shell</text><text x="722.0" y="131" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">bash -c、运行 Shell 脚本</text><text x="722.0" y="194" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="middle">不读这几个配置文件</text><text x="722.0" y="220" font-size="12.5" fill="#7b7280" font-weight="400" text-anchor="middle">只能拿到父进程导出的环境变量，</text><text x="722.0" y="240" font-size="12.5" fill="#7b7280" font-weight="400" text-anchor="middle">~/.bashrc 里没有 export 的变量</text><text x="722.0" y="260" font-size="12.5" fill="#7b7280" font-weight="400" text-anchor="middle">和别名都看不到</text><line x1="28" y1="384" x2="852" y2="384" stroke="#e8e4ea"/><rect x="28" y="395" width="16" height="16" rx="4" fill="#4d7fc4" fill-opacity="0.1" stroke="#4d7fc4" stroke-width="1.2"/><text x="52" y="408" font-size="12.5" fill="#7b7280" font-weight="400" text-anchor="start">/etc 下的文件：属于 root，这台机器上的所有用户共用</text><rect x="460" y="395" width="16" height="16" rx="4" fill="#3f9e79" fill-opacity="0.1" stroke="#3f9e79" stroke-width="1.2"/><text x="484" y="408" font-size="12.5" fill="#7b7280" font-weight="400" text-anchor="start">家目录里的文件：只对当前用户起作用</text></svg>