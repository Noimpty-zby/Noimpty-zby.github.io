<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 514" width="880" height="514" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b7280"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f9e79"/></marker></defs><rect x="0.5" y="0.5" width="879" height="513" rx="14" fill="#ffffff" stroke="#e8e4ea"/><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">Shell 变量和环境变量</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">子进程启动时，只从父进程那里复制带导出属性的变量；子进程里的修改只改它自己的副本</text><text x="28" y="98" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="start">export 之前：animal 只是当前 Shell 的变量</text><rect x="28" y="112" width="360" height="142" rx="10" fill="#7b7280" fill-opacity="0.03" stroke="#7b7280" stroke-width="1.2"/><text x="48" y="140" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">当前的 bash（父进程）</text><rect x="520" y="112" width="332" height="142" rx="10" fill="#7b7280" fill-opacity="0.03" stroke="#7b7280" stroke-width="1.2"/><text x="540" y="140" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">子进程（bash、printenv……）</text><text x="48" y="172" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">HOME=/home/zby</text><rect x="276" y="157" width="42" height="21" rx="10.5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="297.0" y="172" font-size="12" fill="#4d7fc4" font-weight="700" text-anchor="middle">导出</text><text x="48" y="202" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">USER=zby</text><rect x="276" y="187" width="42" height="21" rx="10.5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="297.0" y="202" font-size="12" fill="#4d7fc4" font-weight="700" text-anchor="middle">导出</text><text x="48" y="232" font-size="15" fill="#ee5d7b" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">animal=cat</text><rect x="276" y="217" width="56" height="21" rx="10.5" fill="#ee5d7b" fill-opacity="0.12" stroke="#ee5d7b" stroke-width="1"/><text x="304.0" y="232" font-size="12" fill="#ee5d7b" font-weight="700" text-anchor="middle">未导出</text><text x="540" y="172" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">HOME=/home/zby</text><text x="540" y="202" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">USER=zby</text><text x="540" y="232" font-size="15" fill="#7b7280" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">$animal</text><text x="609.7" y="232" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">是空的，没有这个变量</text><path d="M396 172 H512" stroke="#7b7280" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="454.0" y="160" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">启动子进程</text><text x="454.0" y="194" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">复制导出的变量</text><text x="28" y="300" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="start">export animal 之后：子进程拿到一份副本</text><rect x="28" y="314" width="360" height="172" rx="10" fill="#7b7280" fill-opacity="0.03" stroke="#7b7280" stroke-width="1.2"/><text x="48" y="342" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">当前的 bash（父进程）</text><rect x="520" y="314" width="332" height="172" rx="10" fill="#7b7280" fill-opacity="0.03" stroke="#7b7280" stroke-width="1.2"/><text x="540" y="342" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">子进程（bash、printenv……）</text><text x="48" y="374" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">HOME=/home/zby</text><rect x="276" y="359" width="42" height="21" rx="10.5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="297.0" y="374" font-size="12" fill="#4d7fc4" font-weight="700" text-anchor="middle">导出</text><text x="48" y="404" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">USER=zby</text><rect x="276" y="389" width="42" height="21" rx="10.5" fill="#4d7fc4" fill-opacity="0.12" stroke="#4d7fc4" stroke-width="1"/><text x="297.0" y="404" font-size="12" fill="#4d7fc4" font-weight="700" text-anchor="middle">导出</text><text x="48" y="434" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">animal=cat</text><rect x="276" y="419" width="42" height="21" rx="10.5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="297.0" y="434" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">导出</text><text x="48" y="464" font-size="14" fill="#7b7280" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">echo $animal</text><text x="188" y="464" font-size="14" fill="#7b7280" font-weight="400" text-anchor="start">→</text><text x="212" y="464" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">cat</text><text x="540" y="374" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">HOME=/home/zby</text><text x="540" y="404" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">USER=zby</text><text x="540" y="434" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">animal=cat</text><text x="540" y="464" font-size="15" fill="#c98a2b" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">animal=dog</text><text x="637.0" y="464" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">只改了子进程的副本</text><path d="M396 374 H512" stroke="#7b7280" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="454.0" y="362" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">启动子进程</text><text x="454.0" y="396" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">复制导出的变量</text><path d="M512 464 H396" stroke="#ee5d7b" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/><path d="M447.0 457 L461.0 471 M461.0 457 L447.0 471" stroke="#ee5d7b" stroke-width="2.2"/><text x="454.0" y="488" font-size="12" fill="#ee5d7b" font-weight="700" text-anchor="middle">不会传回</text></svg>