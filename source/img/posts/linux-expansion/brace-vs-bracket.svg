<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="395" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">花括号按写法生成，方括号按目录里的文件匹配</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">当前目录里只有 day1.log、day2.log、day3.log 和 day10.log</text><rect x="28" y="96" width="160" height="44" rx="8" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="108" y="123" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day{1..5}.log</text><path d="M190,118 L214,118" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><rect x="222" y="96" width="118" height="44" rx="8" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="281.0" y="123" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day1.log</text><rect x="348" y="96" width="118" height="44" rx="8" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="407.0" y="123" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day2.log</text><rect x="474" y="96" width="118" height="44" rx="8" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="533.0" y="123" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day3.log</text><rect x="600" y="96" width="118" height="44" rx="8" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="659.0" y="123" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day4.log</text><rect x="726" y="96" width="118" height="44" rx="8" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="785.0" y="123" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day5.log</text><text x="28" y="170" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">不看目录里有什么，按 1 到 5 的序列直接生成 5 个单词，day4.log 和 day5.log 不存在也照样生成。</text><rect x="28" y="214" width="160" height="44" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="108" y="241" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day[1-5].log</text><path d="M190,236 L214,236" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><rect x="222" y="214" width="118" height="44" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="281.0" y="241" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day1.log</text><rect x="348" y="214" width="118" height="44" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="407.0" y="241" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day2.log</text><rect x="474" y="214" width="118" height="44" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="533.0" y="241" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day3.log</text><rect x="600" y="214" width="118" height="44" rx="8" fill="#ffffff" stroke="#c9c3cf" stroke-width="1.5" stroke-dasharray="5 4"/><text x="659.0" y="241" font-size="14" fill="#b4adb9" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day4.log</text><rect x="726" y="214" width="118" height="44" rx="8" fill="#ffffff" stroke="#c9c3cf" stroke-width="1.5" stroke-dasharray="5 4"/><text x="785.0" y="241" font-size="14" fill="#b4adb9" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">day5.log</text><text x="28" y="288" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">去目录里找名字符合模式的文件，只留下存在的 3 个；day10.log 的数字部分有两个字符，也不符合。</text><line x1="28" y1="318" x2="852" y2="318" stroke="#e8e4ea" stroke-width="1.5"/><text x="28" y="346" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">touch day{4..6}.log</text><text x="250" y="346" font-size="13" fill="#2f2a33" font-weight="400" text-anchor="start">新建 day4.log、day5.log、day6.log 三个文件</text><text x="28" y="374" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">touch day[4-6].log</text><text x="250" y="374" font-size="13" fill="#2f2a33" font-weight="400" text-anchor="start">一个都匹配不到，模式原样保留，新建的文件就叫 day[4-6].log</text></svg>