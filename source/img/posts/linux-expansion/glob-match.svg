b7280" font-weight="400" text-anchor="start">* 不会匹配以点开头的文件名；? 恰好匹配一个字符，所以 day?.log 不包括 day10.log；</text><text x="28" y="476" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">方括号也只匹配一个字符，[13] 是 1 或 3，[^1] 是除了 1 以外的任意字符。</text></svg>