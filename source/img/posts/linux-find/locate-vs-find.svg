<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">locate 查的是上一次 updatedb 留下的数据库，find 看的是此刻的目录</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">数据库更新以后，目录里新建了 new.txt、删掉了 todo.txt，这时两条命令看到的内容不一样</text><rect x="28" y="90" width="184" height="132" rx="10" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="120" y="114" font-size="13" fill="#2f2a33" font-weight="700" text-anchor="middle">磁盘上的目录（此刻）</text><text x="48" y="144" font-size="13" fill="#2f2a33" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">notes.txt</text><text x="48" y="170" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">new.txt</text><text x="118" y="170" font-size="12" fill="#3f9e79" font-weight="600" text-anchor="start">刚新建</text><text x="48" y="196" font-size="13" fill="#b4adb9" font-weight="500" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">todo.txt</text><line x1="46" y1="192" x2="114" y2="192" stroke="#b4adb9" stroke-width="1.5"/><text x="122" y="196" font-size="12" fill="#b4adb9" font-weight="600" text-anchor="start">已删除</text><rect x="338" y="90" width="248" height="64" rx="10" fill="#fbf3e6" stroke="#c98a2b" stroke-width="1.5"/><text x="462" y="114" font-size="13" fill="#c98a2b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">/var/lib/plocate/plocate.db</text><text x="462" y="140" font-size="12" fill="#2f2a33" font-weight="500" text-anchor="middle">快照：有 todo.txt，没有 new.txt</text><path d="M214,122 L334,122" fill="none" stroke="#c98a2b" stroke-width="2" marker-end="url(#ma)"/><text x="274" y="112" font-size="12" fill="#c98a2b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">updatedb</text><text x="274" y="142" font-size="11" fill="#7b7280" font-weight="500" text-anchor="middle">默认每天一次</text><rect x="712" y="98" width="140" height="48" rx="10" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="782" y="127" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">locate</text><path d="M710,122 L590,122" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><text x="650" y="112" font-size="12" fill="#4d7fc4" font-weight="700" text-anchor="middle">查询</text><rect x="712" y="176" width="140" height="48" rx="10" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="782" y="205" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">find</text><path d="M710,200 L216,200" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><text x="462" y="192" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">逐个目录现场读取</text><line x1="28" y1="268" x2="852" y2="268" stroke="#e8e4ea" stroke-width="1.5"/><text x="430" y="256" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">locate</text><text x="600" y="256" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">locate -e</text><text x="770" y="256" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">find</text><rect x="28" y="282" width="824" height="44" fill="#faf9fb"/><text x="40" y="302" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">new.txt</text><text x="40" y="319" font-size="11" fill="#7b7280" font-weight="400" text-anchor="start">刚新建，应该找得到</text><rect x="368" y="291" width="124" height="26" rx="13" fill="#fdeef2" stroke="#ee5d7b" stroke-width="1.3"/><text x="430" y="309" font-size="12" fill="#ee5d7b" font-weight="700" text-anchor="middle">没有列出</text><rect x="538" y="291" width="124" height="26" rx="13" fill="#fdeef2" stroke="#ee5d7b" stroke-width="1.3"/><text x="600" y="309" font-size="12" fill="#ee5d7b" font-weight="700" text-anchor="middle">没有列出</text><rect x="708" y="291" width="124" height="26" rx="13" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.3"/><text x="770" y="309" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">列出</text><text x="40" y="346" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">todo.txt</text><text x="40" y="363" font-size="11" fill="#7b7280" font-weight="400" text-anchor="start">已删除，不应该再出现</text><rect x="368" y="335" width="124" height="26" rx="13" fill="#fdeef2" stroke="#ee5d7b" stroke-width="1.3"/><text x="430" y="353" font-size="12" fill="#ee5d7b" font-weight="700" text-anchor="middle">仍然列出</text><rect x="538" y="335" width="124" height="26" rx="13" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.3"/><text x="600" y="353" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">没有列出</text><rect x="708" y="335" width="124" height="26" rx="13" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.3"/><text x="770" y="353" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">没有列出</text><line x1="28" y1="374" x2="852" y2="374" stroke="#e8e4ea" stroke-width="1.5"/><text x="28" y="400" font-size="12" fill="#7b7280" font-weight="400" text-anchor="start">绿色表示和磁盘上的实际情况一致，粉色表示不一致。执行 sudo updatedb 重建数据库以后，locate 的结果才会和 find 一样。</text></svg>