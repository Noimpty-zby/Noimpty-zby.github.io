<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 374" width="880" height="374" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="373" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">-mtime 先算出距今有几个 24 小时，再把小数部分舍掉</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">数轴从左往右是越来越早的时间，下面每一行是一个条件能匹配到的范围</text><line x1="200" y1="128" x2="852" y2="128" stroke="#7b7280" stroke-width="1.5"/><line x1="200" y1="123" x2="200" y2="133" stroke="#7b7280" stroke-width="1.5"/><text x="200" y="150" font-size="12" fill="#7b7280" font-weight="500" text-anchor="middle">现在</text><line x1="375" y1="123" x2="375" y2="133" stroke="#7b7280" stroke-width="1.5"/><text x="375" y="150" font-size="12" fill="#7b7280" font-weight="500" text-anchor="middle">24 小时前</text><line x1="375" y1="158" x2="375" y2="326" stroke="#d8d2dd" stroke-width="1" stroke-dasharray="4 4"/><line x1="550" y1="123" x2="550" y2="133" stroke="#7b7280" stroke-width="1.5"/><text x="550" y="150" font-size="12" fill="#7b7280" font-weight="500" text-anchor="middle">48 小时前</text><line x1="550" y1="158" x2="550" y2="326" stroke="#d8d2dd" stroke-width="1" stroke-dasharray="4 4"/><line x1="725" y1="123" x2="725" y2="133" stroke="#7b7280" stroke-width="1.5"/><text x="725" y="150" font-size="12" fill="#7b7280" font-weight="500" text-anchor="middle">72 小时前</text><line x1="725" y1="158" x2="725" y2="326" stroke="#d8d2dd" stroke-width="1" stroke-dasharray="4 4"/><circle cx="208.75" cy="128" r="6" fill="#c98a2b"/><text x="202.75" y="114" font-size="12" fill="#c98a2b" font-weight="700" text-anchor="start">10 个文件（3 小时以内）</text><circle cx="418.75" cy="128" r="6" fill="#c98a2b"/><text x="418.75" y="114" font-size="12" fill="#c98a2b" font-weight="700" text-anchor="middle">sat.log（30 小时前）</text><circle cx="725.0" cy="128" r="6" fill="#c98a2b"/><text x="725.0" y="114" font-size="12" fill="#c98a2b" font-weight="700" text-anchor="middle">old.log（3 天前）</text><text x="28" y="188" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">-mtime 0</text><rect x="202" y="170" width="171" height="26" rx="6" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.3"/><text x="212" y="188" font-size="12" fill="#2f2a33" font-weight="600" text-anchor="start">10 个文件</text><text x="28" y="230" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">-mtime 1</text><rect x="377" y="212" width="171" height="26" rx="6" fill="#edf3fb" stroke="#4d7fc4" stroke-width="1.3"/><text x="387" y="230" font-size="12" fill="#2f2a33" font-weight="600" text-anchor="start">sat.log</text><text x="28" y="272" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">-mtime +1</text><rect x="552" y="254" width="298" height="26" rx="6" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.3"/><text x="840" y="272" font-size="11" fill="#3f9e79" font-weight="600" text-anchor="end">更早 →</text><text x="562" y="272" font-size="12" fill="#2f2a33" font-weight="600" text-anchor="start">old.log</text><text x="28" y="314" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">-mtime +0</text><rect x="377" y="296" width="473" height="26" rx="6" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.3"/><text x="840" y="314" font-size="11" fill="#3f9e79" font-weight="600" text-anchor="end">更早 →</text><text x="387" y="314" font-size="12" fill="#2f2a33" font-weight="600" text-anchor="start">sat.log、old.log</text><text x="28" y="352" font-size="12" fill="#7b7280" font-weight="400" text-anchor="start">-mtime -1 和 -mtime 0 一样，都是 24 小时以内。30 小时前修改的 sat.log 舍掉小数后是 1，所以它不算 -mtime +1。</text></svg>