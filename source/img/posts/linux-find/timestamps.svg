<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 418" width="880" height="418" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="417" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">哪些操作会改动哪一个时间戳</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">对同一个文件依次执行下面六条命令，每执行一条就用 stat 读一次三个时间</text><text x="560" y="96" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">atime</text><text x="560" y="114" font-size="11" fill="#7b7280" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ls -lu</text><text x="680" y="96" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">mtime</text><text x="680" y="114" font-size="11" fill="#7b7280" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ls -l</text><text x="800" y="96" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ctime</text><text x="800" y="114" font-size="11" fill="#7b7280" font-weight="500" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ls -lc</text><line x1="28" y1="124" x2="852" y2="124" stroke="#e8e4ea" stroke-width="1.5"/><rect x="28" y="130" width="824" height="36" fill="#faf9fb"/><text x="40" y="153" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">echo more &gt;&gt; t.txt</text><text x="250" y="153" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">往文件里追加内容</text><circle cx="560" cy="148.0" r="3" fill="#ded9e3"/><circle cx="680" cy="148.0" r="8" fill="#3f9e79"/><path d="M676,148.0 L679,151.0 L684.5,144.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="148.0" r="8" fill="#3f9e79"/><path d="M796,148.0 L799,151.0 L804.5,144.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="189" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">chmod 600 t.txt</text><text x="250" y="189" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">修改权限</text><circle cx="560" cy="184.0" r="3" fill="#ded9e3"/><circle cx="680" cy="184.0" r="3" fill="#ded9e3"/><circle cx="800" cy="184.0" r="8" fill="#3f9e79"/><path d="M796,184.0 L799,187.0 L804.5,180.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="28" y="202" width="824" height="36" fill="#faf9fb"/><text x="40" y="225" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">mv t.txt t2.txt</text><text x="250" y="225" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">改名</text><circle cx="560" cy="220.0" r="3" fill="#ded9e3"/><circle cx="680" cy="220.0" r="3" fill="#ded9e3"/><circle cx="800" cy="220.0" r="8" fill="#3f9e79"/><path d="M796,220.0 L799,223.0 L804.5,216.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="261" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">cat t2.txt</text><text x="250" y="261" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">第一次读取</text><circle cx="560" cy="256.0" r="8" fill="#3f9e79"/><path d="M556,256.0 L559,259.0 L564.5,252.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="680" cy="256.0" r="3" fill="#ded9e3"/><circle cx="800" cy="256.0" r="3" fill="#ded9e3"/><rect x="28" y="274" width="824" height="36" fill="#faf9fb"/><text x="40" y="297" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">cat t2.txt</text><text x="250" y="297" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">紧接着再读一次</text><circle cx="560" cy="292.0" r="3" fill="#ded9e3"/><circle cx="680" cy="292.0" r="3" fill="#ded9e3"/><circle cx="800" cy="292.0" r="3" fill="#ded9e3"/><text x="40" y="333" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">touch t2.txt</text><text x="250" y="333" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">不带参数的 touch</text><circle cx="560" cy="328.0" r="8" fill="#3f9e79"/><path d="M556,328.0 L559,331.0 L564.5,324.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="680" cy="328.0" r="8" fill="#3f9e79"/><path d="M676,328.0 L679,331.0 L684.5,324.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="328.0" r="8" fill="#3f9e79"/><path d="M796,328.0 L799,331.0 L804.5,324.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="28" y1="350" x2="852" y2="350" stroke="#e8e4ea" stroke-width="1.5"/><text x="28" y="376" font-size="12" fill="#7b7280" font-weight="400" text-anchor="start">ctime 记录的是文件的属性最后一次变化的时间，内容、权限、名字一变它就跟着变，它并不是创建时间。</text><text x="28" y="398" font-size="12" fill="#7b7280" font-weight="400" text-anchor="start">第二次 cat 没有更新 atime，因为默认的 relatime 规则只在 atime 早于 mtime 或 ctime、或者已经超过一天时才更新它。</text></svg>