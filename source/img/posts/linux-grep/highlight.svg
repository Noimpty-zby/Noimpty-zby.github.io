<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" width="880" height="466" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="465" rx="14" fill="#ffffff" stroke="#e8e4ea"/><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">grep 打印整行，只把匹配到的那一段标出来</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">下面是终端里 --color=auto 的效果，粉色底的部分就是正则表达式匹配到的字符</text><rect x="28" y="80" width="400" height="166" rx="10" fill="#faf9fb" stroke="#e8e4ea"/><text x="44.0" y="106" font-size="13" fill="#4d7fc4" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="179.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ grep 'w...' words.txt</text><text x="44.0" y="132" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="15.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I </text><rect x="59.1" y="120" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="59.6" y="132" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wrot</text><text x="90.8" y="132" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="46.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">e one </text><rect x="137.1" y="120" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="137.6" y="132" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="168.8" y="132" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> on the board.</text><text x="44.0" y="156" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The </text><rect x="74.7" y="144" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="75.2" y="156" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="106.4" y="156" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="15.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">s </text><rect x="121.5" y="144" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="122.0" y="156" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">were</text><text x="153.2" y="156" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> hard to read.</text><text x="44.0" y="180" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="23.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A s</text><rect x="66.9" y="168" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="67.4" y="180" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="98.6" y="180" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="78.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> is not a </text><rect x="176.1" y="168" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="176.6" y="180" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="207.8" y="180" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">.</text><text x="44.0" y="204" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Write do</text><rect x="105.9" y="192" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="106.4" y="204" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wn y</text><text x="137.6" y="204" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">our pass</text><rect x="199.5" y="192" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="200.0" y="204" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="231.2" y="204" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="132.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> (keep it secret)</text><rect x="43.5" y="216" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="44.0" y="228" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">we w</text><text x="75.2" y="228" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="39.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ere a</text><rect x="113.7" y="216" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="114.2" y="228" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">way </text><text x="145.4" y="228" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="46.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">for a </text><rect x="191.7" y="216" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="192.2" y="228" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">week</text><rect x="28" y="262" width="400" height="94" rx="10" fill="#faf9fb" stroke="#e8e4ea"/><text x="44.0" y="288" font-size="13" fill="#4d7fc4" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ grep -w word words.txt</text><text x="44.0" y="314" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="93.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I wrote one </text><rect x="137.1" y="302" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="137.6" y="314" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="168.8" y="314" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> on the board.</text><text x="44.0" y="338" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="132.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A sword is not a </text><rect x="176.1" y="326" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="176.6" y="338" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">word</text><text x="207.8" y="338" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="7.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">.</text><rect x="452" y="80" width="400" height="70" rx="10" fill="#faf9fb" stroke="#e8e4ea"/><text x="468.0" y="106" font-size="13" fill="#4d7fc4" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="202.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ grep 'gr[ae]y' words.txt</text><text x="468.0" y="132" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="93.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I think the </text><rect x="561.1" y="120" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="561.6" y="132" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">grey</text><text x="592.8" y="132" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> cat is </text><rect x="654.7" y="120" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="655.2" y="132" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">gray</text><text x="686.4" y="132" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="39.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> now.</text><rect x="452" y="166" width="400" height="70" rx="10" fill="#faf9fb" stroke="#e8e4ea"/><text x="468.0" y="192" font-size="13" fill="#4d7fc4" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="202.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ grep 'gr[^e]y' words.txt</text><text x="468.0" y="218" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="187.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I think the grey cat is </text><rect x="654.7" y="206" width="32.2" height="18" rx="3" fill="#fde8ed"/><text x="655.2" y="218" font-size="13" fill="#ee5d7b" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="31.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">gray</text><text x="686.4" y="218" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="39.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> now.</text><rect x="452" y="252" width="400" height="142" rx="10" fill="#faf9fb" stroke="#e8e4ea"/><text x="468.0" y="278" font-size="13" fill="#4d7fc4" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="163.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ grep 'x*' words.txt</text><text x="468.0" y="304" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="234.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I wrote one word on the board.</text><text x="468.0" y="328" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="218.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The words were hard to read.</text><text x="468.0" y="352" font-size="13" fill="#2f2a33" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace" textLength="171.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A sword is not a word.</text><text x="468" y="376" font-size="12" fill="#7b7280" font-weight="400" text-anchor="start">……一共打印了 11 行，没有一处高亮</text><text x="28" y="424" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">w... 里的点可以是任意一个字符，空格也算，所以 wn y、we w 这样中间带空格的片段也被标了出来。</text><text x="28" y="446" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">x* 在每一行里都匹配到了零个 x，也就是一个空字符串，所以每一行都被打印，但是没有字符被标出来。</text></svg>