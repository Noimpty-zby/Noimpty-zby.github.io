70" y="278" font-size="10.5" fill="#ee5d7b" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">ShoppingList.txt.save</text><text x="670" y="300" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">不是原来那个名字</text><text x="28" y="124" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">内</text><text x="28" y="141" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">存</text><text x="28" y="264" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">磁</text><text x="28" y="281" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">盘</text><line x1="38" y1="218" x2="842" y2="218" stroke="#ded9e3" stroke-width="1" stroke-dasharray="5 4"/><text x="440" y="213" font-size="11.5" fill="#9b93a3" text-anchor="middle" font-weight="400">这条线以下才是真的存下来了</text><line x1="38" y1="352" x2="842" y2="352" stroke="#9b93a3" stroke-width="1" marker-end="url(#ar)"/><text x="38" y="372" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">时间</text><rect x="32" y="396" width="816" height="58" rx="8" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="50" y="420" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">③′ 是实测时撞出来的：我用 tmux 直接杀掉了那个终端。</text><text x="50" y="440" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="400">nano 收到 SIGHUP，把缓冲区抢救到 ShoppingList.txt.save —— 不是你要的那个名字，但内容在。</text></svg>