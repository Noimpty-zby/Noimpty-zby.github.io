<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="880" height="456" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="455" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">nano 的屏幕分成四块，最下面那两行是一张永远在的说明书</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">帮助文本自己就是这么说的：four main sections —— 标题栏、编辑窗口、状态行、两行快捷键</text><rect x="36" y="90" width="500" height="306" rx="8" fill="#fdfcfd" stroke="#ded9e3" stroke-width="1"/><rect x="36" y="90" width="500" height="28" rx="8" fill="#2f2a33"/><rect x="36" y="100" width="500" height="18" rx="0" fill="#2f2a33"/><text x="59.2" y="109" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">GNU nano 6.2</text><text x="217.6" y="109" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">work/List.txt</text><text x="310.0" y="109" font-size="11" fill="#ffd479" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">*</text><text x="46.0" y="142" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">buy milk</text><text x="46.0" y="162" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">eggs</text><text x="46.0" y="182" font-size="11" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">oat milk</text><rect x="98.8" y="172" width="6.6" height="14" fill="#2f2a33" fill-opacity="0.55"/><rect x="36" y="258" width="500" height="26" rx="0" fill="#f6f4f8"/><text x="286.0" y="276" font-size="11" fill="#7b7280" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">[ Wrote 1 line ]</text><line x1="36" y1="290" x2="536" y2="290" stroke="#ded9e3" stroke-width="1"/><rect x="44.0" y="300" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="47.0" y="312" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^G</text><text x="65.8" y="312" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Help</text><rect x="156.2" y="300" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="159.2" y="312" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^O</text><text x="178.0" y="312" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Write Out</text><rect x="268.4" y="300" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="271.4" y="312" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^W</text><text x="290.2" y="312" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Where Is</text><rect x="380.6" y="300" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="383.59999999999997" y="312" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^K</text><text x="402.4" y="312" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Cut</text><rect x="44.0" y="326" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="47.0" y="338" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^X</text><text x="65.8" y="338" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Exit</text><rect x="156.2" y="326" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="159.2" y="338" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^R</text><text x="178.0" y="338" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Read File</text><rect x="268.4" y="326" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="271.4" y="338" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^\</text><text x="290.2" y="338" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Replace</text><rect x="380.6" y="326" width="19.2" height="17" rx="2" fill="#2f2a33"/><text x="383.59999999999997" y="338" font-size="11" fill="#ffffff" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">^U</text><text x="402.4" y="338" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">Paste</text><rect x="566" y="94" width="278" height="64" rx="8" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="580" y="116" font-size="13" fill="#4d7fc4" text-anchor="start" font-weight="700">① 标题栏</text><text x="580" y="135" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">版本、当前文件名，以及那个 *。</text><text x="580" y="152" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">* = 缓冲区改过了还没存 —— 唯一</text><text x="580" y="169" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">一处能看出「存没存」的地方。</text><rect x="566" y="168" width="278" height="82" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="580" y="190" font-size="13" fill="#3f9e79" text-anchor="start" font-weight="700">② 编辑窗口</text><text x="580" y="209" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">所见即所得：打字就是打字，没有</text><text x="580" y="226" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">模式要切。这一点是 nano 和 vim</text><text x="580" y="243" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">最大的区别，也是它排在 vim 前面</text><text x="580" y="260" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">教的原因。</text><rect x="566" y="258" width="278" height="64" rx="8" fill="#fdf3e3" stroke="#c98a2b" stroke-width="1"/><text x="580" y="280" font-size="13" fill="#c98a2b" text-anchor="start" font-weight="700">③ 状态行</text><text x="580" y="299" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">一次性的反馈：写了几行、报了什么</text><text x="580" y="316" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">错。按下一个键它就被清掉了，所以</text><text x="580" y="333" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">出错时要当场看这一行。</text><rect x="566" y="332" width="278" height="82" rx="8" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="580" y="354" font-size="13" fill="#ee5d7b" text-anchor="start" font-weight="700">④ 两行快捷键</text><text x="580" y="373" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">不会消失的速查表。^ 就是 Ctrl，</text><text x="580" y="390" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">M- 是 Meta（Alt / Cmd / Esc）。</text><text x="580" y="407" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">不用背 —— 忘了就低头看一眼，</text><text x="580" y="424" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">这是 nano 整个设计的核心。</text><line x1="542" y1="104" x2="560" y2="126" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><line x1="542" y1="200" x2="560" y2="209" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><line x1="542" y1="271" x2="560" y2="290" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><line x1="542" y1="325" x2="560" y2="373" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="28" y="434" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">四块里有三块是给你看的，只有一块是你的文件。</text></svg>