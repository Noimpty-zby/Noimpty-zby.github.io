<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 578" width="880" height="578" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="577" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">保存有三条路：^S 写、^O 写去哪、^X 只是替你问一句</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">三条都从同一个东西出发 —— 内存里那个已经改过的缓冲区</text><rect x="32" y="92" width="168" height="88" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="48" y="118" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="700">内存里的缓冲区</text><text x="48" y="140" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">改过了，标题栏</text><text x="48" y="157" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">上挂着一个 *</text><rect x="214" y="206" width="54" height="34" rx="6" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="241" y="229" font-size="15" fill="#3f9e79" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">^S</text><line x1="200" y1="223" x2="208" y2="223" stroke="#3f9e79" stroke-width="1"/><rect x="282" y="192" width="566" height="89" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="300" y="214" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">写回它现在的文件名，不问任何问题。</text><text x="300" y="235" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">状态行回一句 [ Wrote 1 line ]，标题栏的 * 消失。</text><text x="300" y="256" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">缓冲区要是还没有名字（裸 nano），它会退回去问名字。</text><rect x="214" y="306" width="54" height="34" rx="6" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="241" y="329" font-size="15" fill="#4d7fc4" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">^O</text><line x1="200" y1="323" x2="208" y2="323" stroke="#4d7fc4" stroke-width="1"/><rect x="282" y="292" width="566" height="110" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="300" y="314" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">Write Out —— 它问的是「写到哪个文件」，不是「要不要改名」。</text><text x="300" y="335" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">提示语里名字是预填好的：File Name to Write: work/List.txt</text><text x="300" y="356" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">直接回车 = 和 ^S 一样；改掉名字 = 另存为，</text><text x="300" y="377" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">会再确认一次 Save file under DIFFERENT NAME?</text><rect x="214" y="424" width="54" height="34" rx="6" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="241" y="447" font-size="15" fill="#ee5d7b" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">^X</text><line x1="200" y1="441" x2="208" y2="441" stroke="#ee5d7b" stroke-width="1"/><rect x="282" y="410" width="566" height="89" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="300" y="432" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">Exit。它自己不写盘，只在有改动时拦一句：</text><text x="300" y="453" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">Save modified buffer?   Y = 转去走 ^O 那条</text><text x="300" y="474" font-size="12.5" fill="#7b7280" text-anchor="start" font-weight="400">N = 丢掉，磁盘上一个字节都不会变；^C = 回去接着编辑</text><line x1="126" y1="180" x2="126" y2="424" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="138" y="260" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">同</text><text x="138" y="278" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">一</text><text x="138" y="296" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">份</text><text x="138" y="314" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">内</text><text x="138" y="332" font-size="11.5" fill="#9b93a3" text-anchor="start" font-weight="400">容</text><rect x="32" y="500" width="816" height="54" rx="8" fill="#fdf3e3" stroke="#c98a2b" stroke-width="1"/><text x="50" y="524" font-size="13" fill="#c98a2b" text-anchor="start" font-weight="700">三条路里真正会动磁盘的只有 ^S 和 ^O。</text><text x="50" y="544" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="400">^X 是个岔路口，不是一个「保存并退出」的键 —— 手快按成 N，这次编辑就白做了。</text></svg>