<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">tee 把读到的数据写进文件，同时原样交给下一条命令</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">ls /usr/bin | tee cmds.txt | wc -l</text><rect x="28" y="116" width="120" height="48" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="88.0" y="145.04" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ls /usr/bin</text><rect x="148" y="125" width="104" height="30" rx="15" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="200.0" y="145" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="middle">管道</text><path d="M252,140 L276,140" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><rect x="278" y="116" width="120" height="48" rx="8" fill="#fbf3e6" stroke="#c98a2b" stroke-width="1.5"/><text x="338.0" y="145.4" font-size="15" fill="#c98a2b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tee</text><rect x="398" y="125" width="104" height="30" rx="15" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="450.0" y="145" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="middle">管道</text><path d="M502,140 L526,140" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><rect x="528" y="116" width="120" height="48" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="588.0" y="145.04" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">wc -l</text><path d="M648,140 L700,140" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><rect x="702" y="116" width="150" height="48" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="777" y="146" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle">屏幕：949</text><path d="M338,164 L338,228" fill="none" stroke="#c98a2b" stroke-width="2" marker-end="url(#ma)"/><path d="M296,230 L364,230 L380,246 L380,310 L296,310 z" fill="#fbf3e6" stroke="#c98a2b" stroke-width="1.5"/><path d="M364,230 L364,246 L380,246" fill="none" stroke="#c98a2b" stroke-width="1.5"/><text x="338" y="276" font-size="13" fill="#c98a2b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cmds.txt</text><text x="338" y="296" font-size="12" fill="#c98a2b" font-weight="600" text-anchor="middle">949 行</text><text x="404" y="266" font-size="13" fill="#2f2a33" font-weight="600" text-anchor="start">另存一份完整的列表</text><text x="404" y="288" font-size="12" fill="#7b7280" font-weight="400" text-anchor="start">和 &gt; 一样会先清空文件，追加要用 tee -a</text></svg>