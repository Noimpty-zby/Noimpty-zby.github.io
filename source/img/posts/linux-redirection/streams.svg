<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="355" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">命令只认 0、1、2 三个编号，接到哪里由 shell 决定</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">重定向在命令启动之前改接好，命令本身看不出区别</text><text x="28" y="104" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="start">默认</text><rect x="174" y="132" width="112" height="168" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="230.0" y="221.0" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="middle">命令</text><circle cx="188" cy="216" r="10" fill="#ffffff" stroke="#4d7fc4" stroke-width="1.5"/><text x="188" y="221" font-size="13" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><circle cx="272" cy="172" r="10" fill="#ffffff" stroke="#3f9e79" stroke-width="1.5"/><text x="272" y="177" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="272" cy="260" r="10" fill="#ffffff" stroke="#ee5d7b" stroke-width="1.5"/><text x="272" y="265" font-size="13" fill="#ee5d7b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="28" y="196" width="98" height="40" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="77.0" y="221.04" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle">键盘</text><path d="M126,216 L172,216" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><rect x="332" y="152" width="98" height="40" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="381.0" y="177.04" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle">屏幕</text><rect x="332" y="240" width="98" height="40" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="381.0" y="265.04" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle">屏幕</text><path d="M286,172 L330,172" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><path d="M286,260 L330,260" fill="none" stroke="#ee5d7b" stroke-width="2" marker-end="url(#mp)"/><text x="150" y="206" font-size="11" fill="#4d7fc4" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stdin</text><text x="309" y="162" font-size="11" fill="#3f9e79" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stdout</text><text x="309" y="250" font-size="11" fill="#ee5d7b" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stderr</text><text x="230" y="330" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">三个都接在当前终端上（/dev/pts/2）</text><line x1="440" y1="84" x2="440" y2="336" stroke="#e8e4ea" stroke-width="1.5"/><text x="468" y="104" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">cmd &lt; in.txt &gt; out.txt 2&gt; err.txt</text><rect x="614" y="132" width="112" height="168" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="670.0" y="221.0" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="middle">命令</text><circle cx="628" cy="216" r="10" fill="#ffffff" stroke="#4d7fc4" stroke-width="1.5"/><text x="628" y="221" font-size="13" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0</text><circle cx="712" cy="172" r="10" fill="#ffffff" stroke="#3f9e79" stroke-width="1.5"/><text x="712" y="177" font-size="13" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><circle cx="712" cy="260" r="10" fill="#ffffff" stroke="#ee5d7b" stroke-width="1.5"/><text x="712" y="265" font-size="13" fill="#ee5d7b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><rect x="468" y="196" width="98" height="40" rx="8" fill="#eef3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="517.0" y="221.04" font-size="14" fill="#4d7fc4" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">in.txt</text><path d="M566,216 L612,216" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><rect x="772" y="152" width="98" height="40" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="821.0" y="177.04" font-size="14" fill="#3f9e79" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">out.txt</text><rect x="772" y="240" width="98" height="40" rx="8" fill="#fdf0f3" stroke="#ee5d7b" stroke-width="1.5"/><text x="821.0" y="265.04" font-size="14" fill="#ee5d7b" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">err.txt</text><path d="M726,172 L770,172" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><path d="M726,260 L770,260" fill="none" stroke="#ee5d7b" stroke-width="2" marker-end="url(#mp)"/><text x="590" y="206" font-size="11" fill="#4d7fc4" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stdin</text><text x="749" y="162" font-size="11" fill="#3f9e79" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stdout</text><text x="749" y="250" font-size="11" fill="#ee5d7b" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">stderr</text><text x="670" y="330" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">换成了三个文件，命令的写法不变</text></svg>