<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" width="880" height="462" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="461" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">一个「文件」其实是两样东西：目录里的一条记录，和数据本身</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">rm / mv / cp 的快慢和危险，全都能从「它动的是哪一层」推出来</text><rect x="40" y="92" width="330" height="156" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="58" y="118" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">目录：一张「名字 → inode 号」的表</text><rect x="58" y="140" width="140" height="24" rx="4" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="68" y="157" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f1.txt</text><text x="208" y="157" font-size="12" fill="#9b93a3" text-anchor="start" font-weight="400">→</text><rect x="228" y="140" width="124" height="24" rx="4" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="238" y="157" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">104359</text><rect x="58" y="172" width="140" height="24" rx="4" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="68" y="189" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">f2.txt</text><text x="208" y="189" font-size="12" fill="#9b93a3" text-anchor="start" font-weight="400">→</text><rect x="228" y="172" width="124" height="24" rx="4" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="238" y="189" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">104359</text><rect x="58" y="204" width="140" height="24" rx="4" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="68" y="221" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">sub</text><text x="208" y="221" font-size="12" fill="#9b93a3" text-anchor="start" font-weight="400">→</text><rect x="228" y="204" width="124" height="24" rx="4" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="238" y="221" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">104360</text><rect x="520" y="92" width="320" height="156" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="538" y="118" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">inode + 数据块</text><rect x="538" y="140" width="284" height="42" rx="6" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><text x="550" y="158" font-size="11.5" fill="#4d7fc4" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">104359</text><text x="620" y="158" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">链接数 2</text><text x="550" y="175" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">两个名字指着同一份数据</text><rect x="538" y="190" width="284" height="42" rx="6" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="550" y="208" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">104360</text><text x="620" y="208" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">链接数 2</text><text x="550" y="225" font-size="11" fill="#7b7280" text-anchor="start" font-weight="400">这是个目录</text><line x1="356" y1="152" x2="532" y2="156" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><line x1="356" y1="184" x2="532" y2="156" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><line x1="356" y1="216" x2="532" y2="208" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="444" y="122" font-size="11.5" fill="#9b93a3" text-anchor="middle" font-weight="400">指向</text><rect x="40" y="272" width="800" height="48" rx="8" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><rect x="54" y="282" width="52" height="28" rx="5" fill="#ee5d7b"/><text x="80" y="302" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">rm</text><text x="122" y="296" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">划掉目录里的那条记录。</text><text x="122" y="313" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">数据要等到没有任何名字指着它，才会被回收 —— 所以删 500 MB 也只要 16 ms。</text><rect x="40" y="332" width="800" height="48" rx="8" fill="#eaf1fb" stroke="#4d7fc4" stroke-width="1"/><rect x="54" y="342" width="52" height="28" rx="5" fill="#4d7fc4"/><text x="80" y="362" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">mv</text><text x="122" y="356" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">同一分区内，只改这条记录。</text><text x="122" y="373" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">inode 一点没变，200 MB 的文件改名 3 ms；跨分区才真的搬数据，同样的文件 154 ms。</text><rect x="40" y="392" width="800" height="48" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><rect x="54" y="402" width="52" height="28" rx="5" fill="#3f9e79"/><text x="80" y="422" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">cp</text><text x="122" y="416" font-size="12.5" fill="#2f2a33" text-anchor="start" font-weight="700">新加一条记录，并且复制一整份数据。</text><text x="122" y="433" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">所以它是三条里唯一一个「越大越慢」的，也是唯一一个真的多占一份磁盘的。</text></svg>