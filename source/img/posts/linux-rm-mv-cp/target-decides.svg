<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 474" width="880" height="474" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="473" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" text-anchor="start" font-weight="700">mv a.txt X 的结果，取决于 X 当时是什么</text><text x="28" y="58" font-size="13" fill="#7b7280" text-anchor="start" font-weight="400">同一条命令有三种完全不同的结局，其中两种不会给你任何提示</text><rect x="40" y="96" width="168" height="62" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1"/><text x="58" y="122" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">mv a.txt X</text><text x="58" y="143" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400">cp -r s X 同理</text><rect x="252" y="96" width="588" height="80" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1"/><text x="272" y="120" font-size="12.5" fill="#3f9e79" text-anchor="start" font-weight="700">X 是已存在的目录</text><text x="272" y="142" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">mv a.txt real/</text><text x="430" y="142" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">→ real/a.txt</text><text x="272" y="162" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">搬进去。这是大多数时候想要的结果。</text><line x1="212" y1="127" x2="246" y2="136" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><rect x="252" y="192" width="588" height="80" rx="8" fill="#fdf3e3" stroke="#c98a2b" stroke-width="1"/><text x="272" y="216" font-size="12.5" fill="#c98a2b" text-anchor="start" font-weight="700">X 不存在</text><text x="272" y="238" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">mv a.txt nope</text><text x="430" y="238" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">→ nope（内容是 a.txt 的）</text><text x="272" y="258" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">不报错，而是把 a.txt 改名成了 nope。目录敲错一个字母就会掉进这里。</text><line x1="212" y1="127" x2="246" y2="232" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><rect x="252" y="288" width="588" height="80" rx="8" fill="#fde9ee" stroke="#ee5d7b" stroke-width="1"/><text x="272" y="312" font-size="12.5" fill="#ee5d7b" text-anchor="start" font-weight="700">X 是已存在的文件</text><text x="272" y="334" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">mv a.txt dst.txt</text><text x="430" y="334" font-size="11.5" fill="#7b7280" text-anchor="start" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">→ dst.txt 的原内容没了</text><text x="272" y="354" font-size="11.5" fill="#2f2a33" text-anchor="start" font-weight="400">悄悄覆盖，没有任何提示，原来那份当场消失。</text><line x1="212" y1="127" x2="246" y2="328" stroke="#9b93a3" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ar)"/><rect x="40" y="396" width="800" height="54" rx="8" fill="#fbfafc" stroke="#e8e4ea" stroke-width="1"/><text x="58" y="420" font-size="13" fill="#2f2a33" text-anchor="start" font-weight="700">想要「搬进某个目录」的时候，给目标带上结尾斜杠。</text><text x="58" y="440" font-size="12" fill="#7b7280" text-anchor="start" font-weight="400">mv a.txt nope/ 在 nope 不存在时会直接报 Not a directory —— 把第二种悄悄改名变成一声响。</text></svg>