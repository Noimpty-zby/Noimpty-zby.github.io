<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" width="880" height="522" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b7280"/></marker></defs><rect x="0.5" y="0.5" width="879" height="521" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">按 PATH 的顺序查找命令</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">Shell 从第一个目录开始逐个查找，在哪个目录里先找到同名的可执行文件，就运行哪一个</text><text x="28" y="100" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">PATH 里的目录（从上往下）</text><text x="560" y="100" font-size="13" fill="#7b7280" font-weight="700" text-anchor="middle">输入 hi</text><text x="740" y="100" font-size="13" fill="#7b7280" font-weight="700" text-anchor="middle">输入 bash</text><rect x="20" y="108" width="840" height="30" rx="6" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="36" y="128" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/home/zby/bin</text><rect x="516.0" y="113" width="88" height="21" rx="10.5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="560" y="128" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">找到，运行它</text><text x="740" y="128" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">没有</text><text x="36" y="158" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/local/sbin</text><text x="740" y="158" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">没有</text><rect x="20" y="168" width="840" height="30" rx="6" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="36" y="188" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/local/bin</text><text x="740" y="188" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">没有</text><text x="36" y="218" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/sbin</text><text x="740" y="218" font-size="13" fill="#7b7280" font-weight="400" text-anchor="middle">没有</text><rect x="20" y="228" width="840" height="30" rx="6" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="36" y="248" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/bin</text><rect x="696.0" y="233" width="88" height="21" rx="10.5" fill="#3f9e79" fill-opacity="0.12" stroke="#3f9e79" stroke-width="1"/><text x="740" y="248" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">找到，运行它</text><text x="36" y="278" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/sbin</text><rect x="20" y="288" width="840" height="30" rx="6" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="36" y="308" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/bin</text><text x="740" y="308" font-size="13" fill="#c98a2b" font-weight="400" text-anchor="middle">也有，但不会查到</text><text x="36" y="338" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/games</text><rect x="20" y="348" width="840" height="30" rx="6" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="36" y="368" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/local/games</text><text x="36" y="398" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/usr/lib/wsl/lib</text><rect x="20" y="408" width="840" height="30" rx="6" fill="#7b7280" fill-opacity="0.04" stroke="none" stroke-width="1"/><text x="36" y="428" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/snap/bin</text><line x1="560" y1="140" x2="560" y2="434" stroke="#e8e4ea" stroke-width="2" stroke-dasharray="4 4"/><line x1="740" y1="260" x2="740" y2="290" stroke="#e8e4ea" stroke-width="2" stroke-dasharray="4 4"/><line x1="740" y1="318" x2="740" y2="434" stroke="#e8e4ea" stroke-width="2" stroke-dasharray="4 4"/><text x="28" y="480" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">虚线表示找到以后不再往下查。/bin 是指向 usr/bin 的链接，所以 /bin/bash 和 /usr/bin/bash 是同一个文件。</text></svg>