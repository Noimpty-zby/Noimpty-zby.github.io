<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b7280"/></marker></defs><rect x="0.5" y="0.5" width="879" height="457" rx="14" fill="#ffffff" stroke="#e8e4ea" stroke-width="1"/><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">运行 args hello world 时发生了什么</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">Shell 按 PATH 找到脚本，内核看到第一行的 #! 改为运行 bash，bash 再把后面的参数依次编号</text><text x="28" y="86" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">① 在终端里输入</text><rect x="28" y="94" width="824" height="34" rx="8" fill="#7b7280" fill-opacity="0.05" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="117" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">args</text><text x="92.0" y="117" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">hello</text><text x="149.6" y="117" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">world</text><text x="836" y="117" font-size="13" fill="#7b7280" font-weight="400" text-anchor="end">名字里没有斜杠，Shell 按 PATH 查找</text><line x1="60" y1="134" x2="60" y2="168" stroke="#7b7280" stroke-width="1.6" marker-end="url(#a)"/><text x="76" y="156" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">找到 /home/zby/bin/args，交给内核运行</text><text x="28" y="184" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">② 内核读到文件开头的 #!/bin/bash，实际运行的是</text><rect x="28" y="192" width="824" height="34" rx="8" fill="#7b7280" fill-opacity="0.05" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="215" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/bin/bash</text><text x="140.0" y="215" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/home/zby/bin/args</text><text x="322.4" y="215" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">hello</text><text x="380.0" y="215" font-size="16" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">world</text><path d="M44 236 v6 h86.4 v-6" fill="none" stroke="#7b7280" stroke-width="1.6"/><text x="87.19999999999999" y="262" font-size="14" fill="#7b7280" font-weight="700" text-anchor="middle">解释器</text><path d="M140.0 236 v6 h172.8 v-6" fill="none" stroke="#4d7fc4" stroke-width="1.6"/><text x="226.39999999999998" y="262" font-size="14" fill="#4d7fc4" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">$0</text><path d="M322.4 236 v6 h48.0 v-6" fill="none" stroke="#ee5d7b" stroke-width="1.6"/><text x="346.4" y="262" font-size="14" fill="#ee5d7b" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">$1</text><path d="M380.0 236 v6 h48.0 v-6" fill="none" stroke="#3f9e79" stroke-width="1.6"/><text x="404.0" y="262" font-size="14" fill="#3f9e79" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">$2</text><text x="468.0" y="262" font-size="14" fill="#c98a2b" font-weight="700" text-anchor="start">$# = 2（参数的个数）</text><text x="28" y="312" font-size="13" fill="#7b7280" font-weight="700" text-anchor="start">③ bash 执行脚本里的四条 echo，$0、$#、$1、$2 都被替换成了对应的值：</text><rect x="28" y="324" width="824" height="110" rx="8" fill="#7b7280" fill-opacity="0.05" stroke="#e8e4ea" stroke-width="1"/><text x="44" y="350" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">The script is </text><text x="170.0" y="350" font-size="15" fill="#4d7fc4" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">/home/zby/bin/args</text><text x="44" y="374" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">Number of arguments: </text><text x="233.0" y="374" font-size="15" fill="#c98a2b" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="44" y="398" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">The first value is </text><text x="215.0" y="398" font-size="15" fill="#ee5d7b" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">hello</text><text x="44" y="422" font-size="15" fill="#2f2a33" font-weight="400" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">The second value is </text><text x="224.0" y="422" font-size="15" fill="#3f9e79" font-weight="700" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace">world</text></svg>