<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0.5" y="0.5" width="879" height="339" rx="14" fill="#ffffff" stroke="#e8e4ea"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d7fc4"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ee5d7b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f9e79"/></marker><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7280"/></marker></defs><text x="28" y="34" font-size="17" fill="#2f2a33" font-weight="700" text-anchor="start">tail -f 跟的是文件，tail -F 跟的是名字</text><text x="28" y="58" font-size="13" fill="#7b7280" font-weight="400" text-anchor="start">sed -i 这类命令改文件时，是先写一个新文件，再把名字换过去</text><text x="32" y="100" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="start">改之前</text><rect x="32" y="124" width="112" height="40" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="88.0" y="149.0" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">log.txt</text><text x="88" y="184" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">文件名</text><rect x="32" y="222" width="112" height="36" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="88.0" y="245.0" font-size="14" fill="#3f9e79" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tail -F</text><rect x="32" y="276" width="112" height="36" rx="8" fill="#eef3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="88.0" y="299.0" font-size="14" fill="#4d7fc4" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tail -f</text><path d="M144,144 L250,144" fill="none" stroke="#7b7280" stroke-width="2" marker-end="url(#mk)"/><rect x="254" y="118" width="150" height="52" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="329.0" y="149.0" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle">文件 A（旧内容）</text><path d="M144,240 L294,240 L294,174" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><path d="M144,294 L364,294 L364,174" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><text x="462" y="100" font-size="14" fill="#2f2a33" font-weight="700" text-anchor="start">sed -i 改过之后</text><rect x="462" y="124" width="112" height="40" rx="8" fill="#f6f4f8" stroke="#ded9e3" stroke-width="1.5"/><text x="518.0" y="149.0" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">log.txt</text><text x="518" y="184" font-size="12" fill="#7b7280" font-weight="400" text-anchor="middle">文件名</text><rect x="462" y="222" width="112" height="36" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="518.0" y="245.0" font-size="14" fill="#3f9e79" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tail -F</text><rect x="462" y="276" width="112" height="36" rx="8" fill="#eef3fb" stroke="#4d7fc4" stroke-width="1.5"/><text x="518.0" y="299.0" font-size="14" fill="#4d7fc4" font-weight="600" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">tail -f</text><path d="M574,144 L680,144" fill="none" stroke="#7b7280" stroke-width="2" marker-end="url(#mk)"/><rect x="684" y="118" width="150" height="52" rx="8" fill="#ecf6f1" stroke="#3f9e79" stroke-width="1.5"/><text x="759.0" y="149.0" font-size="14" fill="#2f2a33" font-weight="600" text-anchor="middle">文件 B（新内容）</text><rect x="684" y="212" width="150" height="46" rx="8" fill="#fdf0f3" stroke="#ee5d7b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="759.0" y="240.0" font-size="14" fill="#ee5d7b" font-weight="600" text-anchor="middle">文件 A：没有名字了</text><path d="M574,240 L632,240 L632,160 L680,160" fill="none" stroke="#3f9e79" stroke-width="2" marker-end="url(#mg)"/><path d="M574,294 L759,294 L759,262" fill="none" stroke="#4d7fc4" stroke-width="2" marker-end="url(#mb)"/><text x="759" y="194" font-size="12" fill="#3f9e79" font-weight="700" text-anchor="middle">-F 按名字重新找到它</text><text x="759" y="318" font-size="12" fill="#ee5d7b" font-weight="700" text-anchor="middle">-f 还开着它，之后没有新输出</text><line x1="440" y1="84" x2="440" y2="318" stroke="#e8e4ea" stroke-width="1.5"/></svg>