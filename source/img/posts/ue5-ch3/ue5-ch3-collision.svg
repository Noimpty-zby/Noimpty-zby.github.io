<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="680" role="img" aria-label="自定义检测通道的白名单过滤">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f1f1f}
.s{font-size:12px;fill:#5c5c5c}
.cap{font-size:12px;fill:#7d7d76}
rect.b,circle.b{stroke-width:1.5}
.teal{fill:#dff2ea;stroke:#149472}
.purple{fill:#e6e3f8;stroke:#6259c9}
.coral{fill:#fbe4dc;stroke:#d4593a}
.gray{fill:#eeeeec;stroke:#8a8a82}
.ln{stroke:#8a8a82;stroke-width:1.5;fill:none}
.lnteal{stroke:#149472;stroke-width:2;fill:none}
.lnpurple{stroke:#6259c9;stroke-width:2;fill:none}
.dash{stroke:#b4b4ae;stroke-width:1;fill:none;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){
.t{fill:#eaeae8}
.s{fill:#a8a8a2}
.cap{fill:#8f8f88}
.teal{fill:#0f2f26;stroke:#2bb98f}
.purple{fill:#1c1938;stroke:#8b83e8}
.coral{fill:#38180f;stroke:#e87a5c}
.gray{fill:#26261f;stroke:#9a9a92}
.ln{stroke:#9a9a92}
.lnteal{stroke:#2bb98f}
.lnpurple{stroke:#8b83e8}
.dash{stroke:#55554e}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect class="b" x="30" y="36" width="170" height="44" rx="8"/></g>
<text class="t" x="115" y="55" text-anchor="middle">木桶</text>
<text class="s" x="115" y="72" text-anchor="middle">忽略</text>

<g class="gray"><rect class="b" x="30" y="90" width="170" height="44" rx="8"/></g>
<text class="t" x="115" y="109" text-anchor="middle">墙与地板</text>
<text class="s" x="115" y="126" text-anchor="middle">忽略</text>

<g class="gray"><rect class="b" x="30" y="144" width="170" height="44" rx="8"/></g>
<text class="t" x="115" y="163" text-anchor="middle">玩家胶囊体</text>
<text class="s" x="115" y="180" text-anchor="middle">忽略</text>

<g class="coral"><rect class="b" x="30" y="198" width="170" height="44" rx="8"/></g>
<text class="t" x="115" y="217" text-anchor="middle">宝箱底座</text>
<text class="s" x="115" y="234" text-anchor="middle">重叠</text>

<g class="gray"><rect class="b" x="30" y="252" width="170" height="44" rx="8"/></g>
<text class="t" x="115" y="271" text-anchor="middle">宝箱盖子</text>
<text class="s" x="115" y="288" text-anchor="middle">无碰撞</text>

<g class="purple"><rect class="b" x="290" y="36" width="120" height="260" rx="8"/></g>
<text class="t" x="350" y="155" text-anchor="middle">Interaction</text>
<text class="s" x="350" y="176" text-anchor="middle">检测通道</text>

<g class="coral"><rect class="b" x="470" y="198" width="170" height="44" rx="8"/></g>
<text class="t" x="555" y="217" text-anchor="middle">查询结果</text>
<text class="s" x="555" y="234" text-anchor="middle">只有宝箱底座</text>

<line class="ln" x1="200" y1="58" x2="286" y2="58" marker-end="url(#a)"/>
<line class="ln" x1="200" y1="112" x2="286" y2="112" marker-end="url(#a)"/>
<line class="ln" x1="200" y1="166" x2="286" y2="166" marker-end="url(#a)"/>
<line class="ln" x1="200" y1="220" x2="286" y2="220" marker-end="url(#a)"/>
<line class="ln" x1="200" y1="274" x2="286" y2="274" marker-end="url(#a)"/>
<line class="ln" x1="410" y1="220" x2="466" y2="220" marker-end="url(#a)"/>
<text class="cap" x="340" y="326" text-anchor="middle">新通道的默认响应是「忽略」，只有主动声明的物体才会进入结果</text>
</svg>
