<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 424" width="680" role="img" aria-label="UE Gameplay Framework 启动链条">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f1f1f}
.s{font-size:12px;fill:#5c5c5c}
.cap{font-size:12px;fill:#7d7d76}
rect.b,circle.b{stroke-width:1.5}
.teal{fill:#dff2ea;stroke:#149472}
.purple{fill:#e6e3f8;stroke:#6259c9}
.coral{fill:#fbe4dc;stroke:#d4593a}
.gray{fill:#eeeeec;stroke:#8a8a82}
.ln{stroke:#8a8a82;stroke-width:1.5;fill:none}
.lnteal{stroke:#149472;stroke-width:2;fill:none}
.lnpurple{stroke:#6259c9;stroke-width:2;fill:none}
.dash{stroke:#b4b4ae;stroke-width:1;fill:none;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){
.t{fill:#eaeae8}
.s{fill:#a8a8a2}
.cap{fill:#8f8f88}
.teal{fill:#0f2f26;stroke:#2bb98f}
.purple{fill:#1c1938;stroke:#8b83e8}
.coral{fill:#38180f;stroke:#e87a5c}
.gray{fill:#26261f;stroke:#9a9a92}
.ln{stroke:#9a9a92}
.lnteal{stroke:#2bb98f}
.lnpurple{stroke:#8b83e8}
.dash{stroke:#55554e}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect class="b" x="40" y="40" width="220" height="56" rx="8"/></g>
<text class="t" x="150" y="65" text-anchor="middle">项目设置</text>
<text class="s" x="150" y="83" text-anchor="middle">指定默认游戏模式</text>

<g class="purple"><rect class="b" x="40" y="136" width="220" height="56" rx="8"/></g>
<text class="t" x="150" y="161" text-anchor="middle">ARogueGameMode</text>
<text class="s" x="150" y="179" text-anchor="middle">规则与类型配置中心</text>

<g class="teal"><rect class="b" x="40" y="232" width="220" height="56" rx="8"/></g>
<text class="t" x="150" y="257" text-anchor="middle">ARoguePlayerController</text>
<text class="s" x="150" y="275" text-anchor="middle">玩家的意志，永不消失</text>

<g class="teal"><rect class="b" x="40" y="328" width="220" height="56" rx="8"/></g>
<text class="t" x="150" y="353" text-anchor="middle">InteractionComponent</text>
<text class="s" x="150" y="371" text-anchor="middle">交互逻辑，每帧 Tick</text>

<g class="coral"><rect class="b" x="400" y="232" width="200" height="56" rx="8"/></g>
<text class="t" x="500" y="257" text-anchor="middle">ACharacter</text>
<text class="s" x="500" y="275" text-anchor="middle">玩家的身体，会死</text>

<line class="ln" x1="150" y1="96" x2="150" y2="130" marker-end="url(#a)"/>
<line class="ln" x1="150" y1="192" x2="150" y2="226" marker-end="url(#a)"/>
<line class="ln" x1="150" y1="288" x2="150" y2="322" marker-end="url(#a)"/>
<path class="ln" d="M260 164 L500 164 L500 226" marker-end="url(#a)"/>
<text class="s" x="329" y="250" text-anchor="middle">Possess</text>
<line class="ln" x1="260" y1="264" x2="396" y2="264" marker-end="url(#a)"/>
<text class="s" x="370" y="346" text-anchor="middle">读取位置</text>
<path class="ln" d="M260 356 L500 356 L500 294" marker-end="url(#a)"/>
</svg>
