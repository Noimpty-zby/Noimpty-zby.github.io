<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" role="img" aria-label="交互接口的依赖关系">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f1f1f}
.s{font-size:12px;fill:#5c5c5c}
.cap{font-size:12px;fill:#7d7d76}
rect.b,circle.b{stroke-width:1.5}
.teal{fill:#dff2ea;stroke:#149472}
.purple{fill:#e6e3f8;stroke:#6259c9}
.coral{fill:#fbe4dc;stroke:#d4593a}
.gray{fill:#eeeeec;stroke:#8a8a82}
.ln{stroke:#8a8a82;stroke-width:1.5;fill:none}
.lnteal{stroke:#149472;stroke-width:2;fill:none}
.lnpurple{stroke:#6259c9;stroke-width:2;fill:none}
.dash{stroke:#b4b4ae;stroke-width:1;fill:none;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){
.t{fill:#eaeae8}
.s{fill:#a8a8a2}
.cap{fill:#8f8f88}
.teal{fill:#0f2f26;stroke:#2bb98f}
.purple{fill:#1c1938;stroke:#8b83e8}
.coral{fill:#38180f;stroke:#e87a5c}
.gray{fill:#26261f;stroke:#9a9a92}
.ln{stroke:#9a9a92}
.lnteal{stroke:#2bb98f}
.lnpurple{stroke:#8b83e8}
.dash{stroke:#55554e}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="teal"><rect class="b" x="20" y="118" width="180" height="56" rx="8"/></g>
<text class="t" x="110" y="143" text-anchor="middle">交互组件</text>
<text class="s" x="110" y="161" text-anchor="middle">InteractionComponent</text>

<g class="purple"><rect class="b" x="240" y="118" width="190" height="56" rx="8"/></g>
<text class="t" x="335" y="143" text-anchor="middle">交互接口</text>
<text class="s" x="335" y="161" text-anchor="middle">Interact() = 0</text>

<g class="coral"><rect class="b" x="470" y="122" width="160" height="48" rx="8"/></g>
<text class="t" x="550" y="151" text-anchor="middle">ARogueItemChest</text>

<g class="gray"><rect class="b" x="470" y="48" width="160" height="48" rx="8"/></g>
<text class="t" x="550" y="77" text-anchor="middle">以后的门</text>

<g class="gray"><rect class="b" x="470" y="196" width="160" height="48" rx="8"/></g>
<text class="t" x="550" y="225" text-anchor="middle">以后的 NPC</text>

<line class="ln" x1="200" y1="146" x2="236" y2="146" marker-end="url(#a)"/>
<line class="ln" x1="470" y1="72" x2="450" y2="72"/>
<line class="ln" x1="470" y1="220" x2="450" y2="220"/>
<line class="ln" x1="450" y1="72" x2="450" y2="220"/>
<line class="ln" x1="470" y1="146" x2="434" y2="146" marker-end="url(#a)"/>
<text class="cap" x="340" y="292" text-anchor="middle">交互组件在编译期完全不知道宝箱的存在</text>
</svg>
