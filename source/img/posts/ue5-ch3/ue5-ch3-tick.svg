<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" role="img" aria-label="宝箱 Actor 的 Tick 开关生命周期">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.t{font-size:14px;font-weight:600;fill:#1f1f1f}
.s{font-size:12px;fill:#5c5c5c}
.cap{font-size:12px;fill:#7d7d76}
rect.b,circle.b{stroke-width:1.5}
.teal{fill:#dff2ea;stroke:#149472}
.purple{fill:#e6e3f8;stroke:#6259c9}
.coral{fill:#fbe4dc;stroke:#d4593a}
.gray{fill:#eeeeec;stroke:#8a8a82}
.ln{stroke:#8a8a82;stroke-width:1.5;fill:none}
.lnteal{stroke:#149472;stroke-width:2;fill:none}
.lnpurple{stroke:#6259c9;stroke-width:2;fill:none}
.dash{stroke:#b4b4ae;stroke-width:1;fill:none;stroke-dasharray:4 4}
@media (prefers-color-scheme:dark){
.t{fill:#eaeae8}
.s{fill:#a8a8a2}
.cap{fill:#8f8f88}
.teal{fill:#0f2f26;stroke:#2bb98f}
.purple{fill:#1c1938;stroke:#8b83e8}
.coral{fill:#38180f;stroke:#e87a5c}
.gray{fill:#26261f;stroke:#9a9a92}
.ln{stroke:#9a9a92}
.lnteal{stroke:#2bb98f}
.lnpurple{stroke:#8b83e8}
.dash{stroke:#55554e}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ln" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect class="b" x="210" y="40" width="260" height="56" rx="8"/></g>
<text class="t" x="340" y="65" text-anchor="middle">构造函数</text>
<text class="s" x="340" y="83" text-anchor="middle">注册 Tick，但初始关闭</text>

<g class="teal"><rect class="b" x="210" y="136" width="260" height="56" rx="8"/></g>
<text class="t" x="340" y="161" text-anchor="middle">Interact()</text>
<text class="s" x="340" y="179" text-anchor="middle">打开 Tick 开关</text>

<g class="teal"><rect class="b" x="210" y="232" width="260" height="56" rx="8"/></g>
<text class="t" x="340" y="257" text-anchor="middle">Tick（每帧）</text>
<text class="s" x="340" y="275" text-anchor="middle">推进角度，写入相对旋转</text>

<g class="teal"><rect class="b" x="210" y="328" width="260" height="56" rx="8"/></g>
<text class="t" x="340" y="353" text-anchor="middle">IsNearlyEqual</text>
<text class="s" x="340" y="371" text-anchor="middle">到目标角度了吗</text>

<g class="coral"><rect class="b" x="210" y="424" width="260" height="56" rx="8"/></g>
<text class="t" x="340" y="449" text-anchor="middle">SetActorTickEnabled(false)</text>
<text class="s" x="340" y="467" text-anchor="middle">Tick 自己关掉自己</text>

<line class="ln" x1="340" y1="96" x2="340" y2="130" marker-end="url(#a)"/>
<line class="ln" x1="340" y1="192" x2="340" y2="226" marker-end="url(#a)"/>
<line class="ln" x1="340" y1="288" x2="340" y2="322" marker-end="url(#a)"/>
<line class="ln" x1="340" y1="384" x2="340" y2="418" marker-end="url(#a)"/>
<text class="s" x="352" y="410">已到达</text>
<path class="ln" d="M210 356 L160 356 L160 260 L206 260" marker-end="url(#a)"/>
<text class="s" x="152" y="312" text-anchor="end">未到达，下一帧</text>
</svg>
