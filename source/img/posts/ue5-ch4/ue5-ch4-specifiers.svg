<svg width="100%" viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>三种 UFUNCTION 说明符的调用方向</title>
<desc>BlueprintCallable 是蓝图调 C++；BlueprintImplementableEvent 和 BlueprintNativeEvent 是 C++ 调蓝图，区别在于有没有 C++ 默认实现。</desc>
<style>
.t{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:500}
.ts{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px}
.tm{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.nb{fill:#F1EFE8;stroke:#B4B2A9;stroke-width:1}
.nt{fill:#2C2C2A}.ns{fill:#5F5E5A}
.cb{fill:#E1F5EE;stroke:#5DCAA5;stroke-width:1}
.ct{fill:#04342C}.cs{fill:#0F6E56}
.pb{fill:#EEEDFE;stroke:#AFA9EC;stroke-width:1}
.pt{fill:#26215C}.ps{fill:#534AB7}
.ln{stroke:#888780;stroke-width:1.4;fill:none}
.hd{stroke:#B4B2A9;stroke-width:1;stroke-dasharray:3 4}
@media (prefers-color-scheme:dark){
.nb{fill:#2C2C2A;stroke:#5F5E5A}.nt{fill:#D3D1C7}.ns{fill:#B4B2A9}
.cb{fill:#085041;stroke:#1D9E75}.ct{fill:#9FE1CB}.cs{fill:#5DCAA5}
.pb{fill:#3C3489;stroke:#7F77DD}.pt{fill:#CECBF6}.ps{fill:#AFA9EC}
.ln{stroke:#9c9a92}.hd{stroke:#5F5E5A}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs>

<text class="t ct" x="120" y="32" text-anchor="middle">C++ 侧</text>
<text class="t pt" x="640" y="32" text-anchor="middle">蓝图侧</text>
<line class="hd" x1="380" y1="46" x2="380" y2="440"/>

<rect class="cb" x="30" y="60" width="180" height="56" rx="8"/>
<text class="tm ct" x="120" y="84" text-anchor="middle">void Explode()</text>
<text class="ts cs" x="120" y="104" text-anchor="middle">实现写在 C++</text>
<rect class="pb" x="550" y="60" width="180" height="56" rx="8"/>
<text class="t pt" x="640" y="84" text-anchor="middle">Explode 节点</text>
<text class="ts ps" x="640" y="104" text-anchor="middle">蓝图发起调用</text>
<line class="ln" x1="546" y1="88" x2="214" y2="88" marker-end="url(#a)"/>
<text class="tm ns" x="380" y="70" text-anchor="middle">BlueprintCallable</text>
<text class="ts ns" x="380" y="112" text-anchor="middle">蓝图 → C++</text>

<rect class="cb" x="30" y="180" width="180" height="72" rx="8"/>
<text class="tm ct" x="120" y="204" text-anchor="middle">ChestAnimation</text>
<text class="tm ct" x="120" y="220" text-anchor="middle">Complete()</text>
<text class="ts cs" x="120" y="242" text-anchor="middle">只声明，不写函数体</text>
<rect class="pb" x="550" y="180" width="180" height="72" rx="8"/>
<text class="t pt" x="640" y="206" text-anchor="middle">Event 节点</text>
<text class="ts ps" x="640" y="228" text-anchor="middle">唯一的实现在这里</text>
<text class="ts ps" x="640" y="244" text-anchor="middle">没画就静默什么都不做</text>
<line class="ln" x1="214" y1="212" x2="546" y2="212" marker-end="url(#a)"/>
<text class="tm ns" x="380" y="190" text-anchor="middle">BlueprintImplementableEvent</text>
<text class="ts ns" x="380" y="236" text-anchor="middle">C++ → 蓝图</text>

<rect class="cb" x="30" y="316" width="180" height="86" rx="8"/>
<text class="tm ct" x="120" y="340" text-anchor="middle">Interact()</text>
<text class="ts cs" x="120" y="362" text-anchor="middle">C++ 写默认实现</text>
<text class="tm cs" x="120" y="382" text-anchor="middle">Interact_</text>
<text class="tm cs" x="120" y="396" text-anchor="middle">Implementation()</text>
<rect class="pb" x="550" y="316" width="180" height="86" rx="8"/>
<text class="t pt" x="640" y="342" text-anchor="middle">Event 节点（可选）</text>
<text class="ts ps" x="640" y="364" text-anchor="middle">画了就完全覆盖 C++</text>
<text class="ts ps" x="640" y="384" text-anchor="middle">要保留默认行为</text>
<text class="ts ps" x="640" y="398" text-anchor="middle">必须连 Parent 节点</text>
<line class="ln" x1="214" y1="356" x2="546" y2="356" marker-end="url(#a)"/>
<text class="tm ns" x="380" y="326" text-anchor="middle">BlueprintNativeEvent</text>
<text class="ts ns" x="380" y="380" text-anchor="middle">C++ → 蓝图</text>
<text class="ts ns" x="380" y="396" text-anchor="middle">但有兜底</text>
</svg>
