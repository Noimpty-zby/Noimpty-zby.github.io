<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img">
<title>第五章完整链路</title>
<desc>伤害来源触发 TakeDamage，转发到 ApplyHealthChange 做钳制与守卫，再通过 Broadcast 同时通知蓝图血条和 C++ 角色的死亡处理。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect{stroke-width:.8}
.g{fill:#F1EFE8;stroke:#888780}
.c{fill:#FAECE7;stroke:#D85A30}
.tl{fill:#E1F5EE;stroke:#1D9E75}
.p{fill:#EEEDFE;stroke:#7F77DD}
.ln{stroke:#888780;stroke-width:1.2;fill:none}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DE}.ts{fill:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}
.c{fill:#712B13;stroke:#F0997B}
.tl{fill:#085041;stroke:#5DCAA5}
.p{fill:#3C3489;stroke:#AFA9EC}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="g" x="40" y="40" width="160" height="52" rx="8"/>
<text class="th" x="120" y="60" text-anchor="middle" dominant-baseline="central">伤害来源</text>
<text class="ts" x="120" y="79" text-anchor="middle" dominant-baseline="central">爆炸桶、投射物</text>

<rect class="g" x="230" y="40" width="160" height="52" rx="8"/>
<text class="th" x="310" y="60" text-anchor="middle" dominant-baseline="central">TakeDamage</text>
<text class="ts" x="310" y="79" text-anchor="middle" dominant-baseline="central">引擎伤害入口</text>

<rect class="c" x="420" y="40" width="180" height="52" rx="8"/>
<text class="th" x="510" y="60" text-anchor="middle" dominant-baseline="central">ApplyHealthChange</text>
<text class="ts" x="510" y="79" text-anchor="middle" dominant-baseline="central">Clamp + 变化守卫</text>

<path class="ln" d="M200 66 H224" marker-end="url(#a)"/>
<path class="ln" d="M390 66 H414" marker-end="url(#a)"/>

<rect class="c" x="420" y="150" width="180" height="52" rx="8"/>
<text class="th" x="510" y="170" text-anchor="middle" dominant-baseline="central">Broadcast()</text>
<text class="ts" x="510" y="189" text-anchor="middle" dominant-baseline="central">同一次广播，两个听众</text>
<path class="ln" d="M510 92 V144" marker-end="url(#a)"/>

<rect class="p" x="150" y="250" width="220" height="52" rx="8"/>
<text class="th" x="260" y="270" text-anchor="middle" dominant-baseline="central">PlayerHealth_WBP</text>
<text class="ts" x="260" y="289" text-anchor="middle" dominant-baseline="central">蓝图 Bind Event → Set Percent</text>

<rect class="tl" x="410" y="250" width="220" height="52" rx="8"/>
<text class="th" x="520" y="270" text-anchor="middle" dominant-baseline="central">ARoguePlayerCharacter</text>
<text class="ts" x="520" y="289" text-anchor="middle" dominant-baseline="central">C++ AddDynamic → 死亡表现</text>

<path class="ln" d="M510 202 V226 H260 V244" marker-end="url(#a)"/>
<path class="ln" d="M510 202 V226 H520 V244" marker-end="url(#a)"/>
</svg>
