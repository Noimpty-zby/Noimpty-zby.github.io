<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img">
<title>组合而非继承：同一个属性组件挂在三条不同继承链的 Actor 上</title>
<desc>玩家角色继承自 ACharacter、敌人 AI 继承自 APawn、可破坏物继承自 AActor，三者分属不同继承链，但都可以挂载同一个 URogueActionSystemComponent 获得血量能力。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect{stroke-width:.8}
.g{fill:#F1EFE8;stroke:#888780}
.c{fill:#FAECE7;stroke:#D85A30}
.ln{stroke:#888780;stroke-width:1;fill:none}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DE}.ts{fill:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}
.c{fill:#712B13;stroke:#F0997B}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="g" x="40" y="40" width="170" height="56" rx="8"/>
<text class="th" x="125" y="63" text-anchor="middle" dominant-baseline="central">玩家角色</text>
<text class="ts" x="125" y="81" text-anchor="middle" dominant-baseline="central">ACharacter</text>

<rect class="g" x="255" y="40" width="170" height="56" rx="8"/>
<text class="th" x="340" y="63" text-anchor="middle" dominant-baseline="central">敌人 AI</text>
<text class="ts" x="340" y="81" text-anchor="middle" dominant-baseline="central">APawn</text>

<rect class="g" x="470" y="40" width="170" height="56" rx="8"/>
<text class="th" x="555" y="63" text-anchor="middle" dominant-baseline="central">可破坏物</text>
<text class="ts" x="555" y="81" text-anchor="middle" dominant-baseline="central">AActor</text>

<path class="ln" d="M125 96 V140 H270 V174" marker-end="url(#a)"/>
<path class="ln" d="M340 96 V174" marker-end="url(#a)"/>
<path class="ln" d="M555 96 V140 H410 V174" marker-end="url(#a)"/>

<rect class="c" x="210" y="180" width="260" height="64" rx="8"/>
<text class="th" x="340" y="205" text-anchor="middle" dominant-baseline="central">URogueActionSystemComponent</text>
<text class="ts" x="340" y="225" text-anchor="middle" dominant-baseline="central">Health / ApplyHealthChange</text>

<text class="ts" x="340" y="272" text-anchor="middle" dominant-baseline="central">血量是横切关注点，用组合而非继承来提供</text>
</svg>
