<svg xmlns="http://www.w3.org/2000/svg" width="680" height="310" viewBox="0 0 680 310" role="img">
<title>蓝图的执行流与数据流</title>
<desc>白色执行线只经过 Event Tick、Cast 到角色、Set Percent 三个节点；其余取值节点不排队执行，而是在 Set Percent 需要参数时被倒着拉取求值。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
rect{stroke-width:.8}
.g{fill:#F1EFE8;stroke:#888780}
.tl{fill:#E1F5EE;stroke:#1D9E75}
.c{fill:#FAECE7;stroke:#D85A30}
.p{fill:#EEEDFE;stroke:#7F77DD}
.ex{stroke:#3d3d3a;stroke-width:2.5;fill:none}
.d1{stroke:#D85A30;stroke-width:1;fill:none}
.d2{stroke:#7F77DD;stroke-width:1;fill:none}
.d3{stroke:#888780;stroke-width:1;fill:none}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DE}.ts{fill:#B4B2A9}
.g{fill:#2C2C2A;stroke:#888780}
.tl{fill:#085041;stroke:#5DCAA5}
.c{fill:#712B13;stroke:#F0997B}
.p{fill:#3C3489;stroke:#AFA9EC}
.ex{stroke:#E8E6DE}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="g" x="60" y="40" width="140" height="48" rx="8"/>
<text class="th" x="130" y="58" text-anchor="middle" dominant-baseline="central">Event Tick</text>
<text class="ts" x="130" y="75" text-anchor="middle" dominant-baseline="central">每帧触发</text>

<rect class="g" x="240" y="40" width="160" height="48" rx="8"/>
<text class="th" x="320" y="58" text-anchor="middle" dominant-baseline="central">Cast 到角色</text>
<text class="ts" x="320" y="75" text-anchor="middle" dominant-baseline="central">Pawn 转角色类</text>

<rect class="tl" x="440" y="40" width="160" height="48" rx="8"/>
<text class="th" x="520" y="58" text-anchor="middle" dominant-baseline="central">Set Percent</text>
<text class="ts" x="520" y="75" text-anchor="middle" dominant-baseline="central">写进度条</text>

<path class="ex" d="M200 64 H234" marker-end="url(#a)"/>
<path class="ex" d="M400 64 H434" marker-end="url(#a)"/>

<rect class="c" x="40" y="130" width="170" height="44" rx="8"/>
<text class="th" x="125" y="145" text-anchor="middle" dominant-baseline="central">组件 → 属性集</text>
<text class="ts" x="125" y="161" text-anchor="middle" dominant-baseline="central">沿引用链取值</text>

<rect class="c" x="240" y="130" width="160" height="44" rx="8"/>
<text class="th" x="320" y="145" text-anchor="middle" dominant-baseline="central">Break 结构体</text>
<text class="ts" x="320" y="161" text-anchor="middle" dominant-baseline="central">拆出当前 Health</text>

<rect class="p" x="40" y="195" width="170" height="44" rx="8"/>
<text class="th" x="125" y="210" text-anchor="middle" dominant-baseline="central">Get class defaults</text>
<text class="ts" x="125" y="226" text-anchor="middle" dominant-baseline="central">读 CDO 默认值</text>

<rect class="p" x="240" y="195" width="160" height="44" rx="8"/>
<text class="th" x="320" y="210" text-anchor="middle" dominant-baseline="central">默认 Health</text>
<text class="ts" x="320" y="226" text-anchor="middle" dominant-baseline="central">= 100</text>

<rect class="g" x="450" y="162" width="90" height="44" rx="8"/>
<text class="th" x="495" y="184" text-anchor="middle" dominant-baseline="central">÷</text>

<path class="d1" d="M210 152 H234" marker-end="url(#a)"/>
<path class="d2" d="M210 217 H234" marker-end="url(#a)"/>
<path class="d1" d="M400 152 L444 174" marker-end="url(#a)"/>
<path class="d2" d="M400 217 L444 195" marker-end="url(#a)"/>
<path class="d3" d="M495 162 V94" marker-end="url(#a)"/>

<path class="ex" d="M60 278 H96"/>
<text class="ts" x="104" y="278" dominant-baseline="central">执行流：只有 3 个节点排队跑</text>
<path class="d3" d="M330 278 H366"/>
<text class="ts" x="374" y="278" dominant-baseline="central">数据流：被下游需要时才倒着求值</text>
</svg>
