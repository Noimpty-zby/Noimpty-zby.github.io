<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img">
<title>C++ 反射说明符与蓝图节点的对应关系</title>
<desc>组件指针上的 BlueprintReadOnly 生成组件取值节点，结构体上的 USTRUCT BlueprintType 生成 Break 节点，成员上的 BlueprintReadOnly 生成输出引脚，委托上的 BlueprintAssignable 生成 Bind Event 节点。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.hd{font-size:12px;font-weight:500;fill:#5F5E5A}
rect{stroke-width:.8}
.c{fill:#FAECE7;stroke:#D85A30}
.tl{fill:#E1F5EE;stroke:#1D9E75}
.ln{stroke:#888780;stroke-width:1;fill:none}
@media (prefers-color-scheme:dark){
.th{fill:#E8E6DE}.ts,.hd{fill:#B4B2A9}
.c{fill:#712B13;stroke:#F0997B}
.tl{fill:#085041;stroke:#5DCAA5}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="hd" x="40" y="46" dominant-baseline="central">C++ 侧写的宏</text>
<text class="hd" x="380" y="46" dominant-baseline="central">蓝图里凭空出现的节点</text>

<rect class="c" x="40" y="66" width="270" height="48" rx="8"/>
<text class="th" x="56" y="84" dominant-baseline="central">UPROPERTY(BlueprintReadOnly)</text>
<text class="ts" x="56" y="102" dominant-baseline="central">标在组件指针上</text>
<rect class="tl" x="380" y="66" width="260" height="48" rx="8"/>
<text class="th" x="396" y="84" dominant-baseline="central">Action System Component</text>
<text class="ts" x="396" y="102" dominant-baseline="central">组件取值节点</text>
<path class="ln" d="M310 90 H374" marker-end="url(#a)"/>

<rect class="c" x="40" y="128" width="270" height="48" rx="8"/>
<text class="th" x="56" y="146" dominant-baseline="central">USTRUCT(BlueprintType)</text>
<text class="ts" x="56" y="164" dominant-baseline="central">标在 FRogueAttributeSet 上</text>
<rect class="tl" x="380" y="128" width="260" height="48" rx="8"/>
<text class="th" x="396" y="146" dominant-baseline="central">Break Rogue Attribute Set</text>
<text class="ts" x="396" y="164" dominant-baseline="central">UHT 自动生成，白送</text>
<path class="ln" d="M310 152 H374" marker-end="url(#a)"/>

<rect class="c" x="40" y="190" width="270" height="48" rx="8"/>
<text class="th" x="56" y="208" dominant-baseline="central">UPROPERTY(BlueprintReadOnly)</text>
<text class="ts" x="56" y="226" dominant-baseline="central">标在 float health 上</text>
<rect class="tl" x="380" y="190" width="260" height="48" rx="8"/>
<text class="th" x="396" y="208" dominant-baseline="central">Health 输出引脚</text>
<text class="ts" x="396" y="226" dominant-baseline="central">Break 节点上那根绿线</text>
<path class="ln" d="M310 214 H374" marker-end="url(#a)"/>

<rect class="c" x="40" y="252" width="270" height="48" rx="8"/>
<text class="th" x="56" y="270" dominant-baseline="central">UPROPERTY(BlueprintAssignable)</text>
<text class="ts" x="56" y="288" dominant-baseline="central">标在委托实例上</text>
<rect class="tl" x="380" y="252" width="260" height="48" rx="8"/>
<text class="th" x="396" y="270" dominant-baseline="central">Bind Event to ...</text>
<text class="ts" x="396" y="288" dominant-baseline="central">订阅节点 + 红色事件引脚</text>
<path class="ln" d="M310 276 H374" marker-end="url(#a)"/>

<text class="ts" x="340" y="330" text-anchor="middle" dominant-baseline="central">链条上缺任何一环，蓝图侧就断在那里</text>
</svg>
