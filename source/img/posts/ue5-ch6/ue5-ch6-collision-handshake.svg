<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 300" role="img" font-family="-apple-system, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif">
<title>碰撞响应的双向握手</title>
<desc>两行对照：抛射物对 Pawn 一律设为阻挡，胶囊体回应忽略故穿过，角色 Mesh 回应阻挡故命中。</desc>
<style>
.bg{fill:#FAF9F5}
.tp{fill:#2C2C2A}
.tsec{fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#B4B2A9}
.boxt{fill:#2C2C2A}
.boxs{fill:#5F5E5A}
.hit{fill:#FAECE7;stroke:#D85A30}
.hitt{fill:#712B13}
.hits{fill:#993C1D}
.line{stroke:#888780}
@media (prefers-color-scheme: dark){
.bg{fill:#1F1E1C}
.tp{fill:#E8E6DF}
.tsec{fill:#B4B2A9}
.box{fill:#2C2C2A;stroke:#5F5E5A}
.boxt{fill:#E8E6DF}
.boxs{fill:#B4B2A9}
.hit{fill:#4A1B0C;stroke:#F0997B}
.hitt{fill:#F5C4B3}
.hits{fill:#F0997B}
}
</style>
<defs>
<marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="bg" x="0" y="0" width="680" height="300" rx="10"/>
<text class="tp" x="24" y="34" font-size="15" font-weight="500">碰撞响应是双向握手</text>

<rect class="box" x="40" y="66" width="170" height="56" rx="8" stroke-width="1"/>
<text class="boxt" x="125" y="90" font-size="14" text-anchor="middle">抛射物</text>
<text class="boxs" x="125" y="110" font-size="12" text-anchor="middle">对 Pawn：阻挡</text>
<line class="line" x1="212" y1="94" x2="246" y2="94" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect class="box" x="250" y="66" width="170" height="56" rx="8" stroke-width="1"/>
<text class="boxt" x="335" y="90" font-size="14" text-anchor="middle">胶囊体</text>
<text class="boxs" x="335" y="110" font-size="12" text-anchor="middle">对 projectile：忽略</text>
<line class="line" x1="422" y1="94" x2="456" y2="94" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect class="box" x="460" y="66" width="170" height="56" rx="8" stroke-width="1"/>
<text class="boxt" x="545" y="90" font-size="14" text-anchor="middle">结果：忽略</text>
<text class="boxs" x="545" y="110" font-size="12" text-anchor="middle">直接穿过</text>

<rect class="box" x="40" y="156" width="170" height="56" rx="8" stroke-width="1"/>
<text class="boxt" x="125" y="180" font-size="14" text-anchor="middle">抛射物</text>
<text class="boxs" x="125" y="200" font-size="12" text-anchor="middle">对 Pawn：阻挡</text>
<line class="line" x1="212" y1="184" x2="246" y2="184" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect class="box" x="250" y="156" width="170" height="56" rx="8" stroke-width="1"/>
<text class="boxt" x="335" y="180" font-size="14" text-anchor="middle">角色 Mesh</text>
<text class="boxs" x="335" y="200" font-size="12" text-anchor="middle">对 projectile：阻挡</text>
<line class="line" x1="422" y1="184" x2="456" y2="184" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect class="hit" x="460" y="156" width="170" height="56" rx="8" stroke-width="1"/>
<text class="hitt" x="545" y="180" font-size="14" text-anchor="middle">结果：阻挡</text>
<text class="hits" x="545" y="200" font-size="12" text-anchor="middle">产生命中事件</text>

<text class="tsec" x="340" y="252" font-size="12" text-anchor="middle">响应强弱：忽略 &lt; 重叠 &lt; 阻挡</text>
<text class="tsec" x="340" y="272" font-size="12" text-anchor="middle">最终结果取两边中较弱的一方——胶囊体与 Mesh 的对象类型同为 Pawn，差别全在另一侧</text>
</svg>
